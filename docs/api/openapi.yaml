        '412': { $ref: '#/components/responses/PreconditionFailed' }
    delete:
      tags: [Parties]
      operationId: removeParty
      x-roles: [owner, admin]
      description: '`409 PARTY_IN_USE` when documents or payments reference the party. Set `status: inactive` instead. (The prototype deletes without this check; the server must not.)'
      responses:
        '204': { description: Removed }
        '409': { $ref: '#/components/responses/Conflict' }
  /companies/{companyId}/parties/{id}/statement:
