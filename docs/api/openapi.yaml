openapi: 3.1.0
info:
  title: Elixir Books Smart API
  version: 1.0.0-draft
  summary: Backend contract for taking the Elixir Books Smart app fully online.
  description: |
    Every action the app now performs against its local Zustand store
    (`src/store/appStore.ts`) has a matching endpoint here. The entity shapes
    mirror `src/types/index.ts`, so the client can swap the store's local
    writes for these calls without changing its domain model.

    ## Conventions
    - **Auth**: `Authorization: Bearer <accessToken>` on everything except `/auth/*`,
      `/plans` and `/reference/*`.
    - **Tenancy**: the path scopes business data to a company:
      `/companies/{companyId}/...`. The server checks that the caller's
      `User.companyIds` (and `branchIds`, when set) include it.
    - **Money** is always `{ minor: integer, currency: "INR" }`, in integer
      minor units. There are no floats (see `src/lib/money.ts`).
    - **Dates** are `YYYY-MM-DD`. **Timestamps** are ISO 8601 UTC.
    - **Server-owned fields** are marked `readOnly`. The client may send them,
      but the server ignores them: `id`, `companyId`, `number`, `totals`,
      `createdAt`, `createdBy`, `updatedAt`, `version`, compliance results.
    - **The server is the authority on calculation.** It recomputes document
      totals, tax splits, stock levels, outstanding amounts and document
      status with the same rules as `src/domain/*`. The client keeps its
      engines for instant previews.
    - **Numbering**: the server assigns document numbers when a document is
      finalised and never reuses one. Drafts carry `"<KIND>-DRAFT"`.
    - **Concurrency**: every mutable resource has a `version` and an `ETag`.
      Send `If-Match` on `PUT`/`PATCH`/`DELETE`. A stale write gets `412`.
    - **Idempotency**: send `Idempotency-Key` (a UUID) on every `POST`. Retries
      from the offline queue are then safe. Keys are kept for 24 hours.
    - **Pagination** is by cursor: `?limit=50&cursor=...` returns
      `{ data, nextCursor }`.
    - **Errors** use `application/problem+json` with a stable `code`. Validation
      failures and compliance rejections also carry `issues[]`, which has the
      same shape as `ComplianceIssue`.
    - **Plan gating**: a request to a module the company's plan does not include
      (see `src/domain/plan.ts`) returns `403` with code `PLAN_UPGRADE_REQUIRED`
      and `requiredPlan`.
    - **Roles**: owner > admin > accountant > sales > viewer. Each operation's
      `x-roles` lists the minimum roles that may call it.
servers:
  - url: https://api.elixirbooks.example/v1
    description: Production
  - url: https://sandbox-api.elixirbooks.example/v1
    description: Sandbox (IRP / EWB sandbox, test payments)
security:
  - bearerAuth: []
tags:
  - { name: Auth, description: 'Sign-up, sign-in, OTP, tokens' }
  - { name: Me, description: 'Current user, profile, devices, push tokens' }
  - { name: Companies, description: 'Companies, branches, onboarding' }
  - { name: Users, description: 'Team members and invitations' }
  - { name: Billing, description: 'Plans and subscriptions' }
  - { name: Settings, description: 'Tax, expense categories, payment accounts, currencies, numbering, transporters' }
  - { name: Parties, description: 'Customers and suppliers' }
  - { name: Catalog, description: 'Items (goods and services)' }
  - { name: Documents, description: 'Quotes, orders, deliveries, invoices, returns, POs, receipts, bills' }
  - { name: Compliance, description: 'GST e-invoice (IRP) and e-way bills' }
  - { name: Payments, description: 'Payments received and made' }
  - { name: Expenses, description: 'Business expenses, recurring and billable' }
  - { name: Inventory, description: 'Stock levels, movements, adjustments, transfers' }
  - { name: Attachments, description: 'File uploads (receipts, logos, scans)' }
  - { name: OCR, description: 'Bill and receipt extraction' }
  - { name: Ledger, description: 'Receivables, payables, reminders' }
  - { name: Reports, description: 'The nine PRD reports, with CSV and PDF export' }
  - { name: GST, description: 'GSTR-1' }
  - { name: Dashboard, description: 'Home-tab summary' }
  - { name: Search, description: 'Global search' }
  - { name: Notifications, description: 'In-app notification feed' }
  - { name: Audit, description: 'Read-only audit trail' }
  - { name: Integrations, description: 'Payments, messaging, accounting and storage connectors' }
  - { name: Exports, description: 'Backup and data export' }
  - { name: Sync, description: 'Offline queue push and pull' }
  - { name: Reference, description: 'Countries, states, cities, currencies, HSN, GSTIN lookup' }

paths:
  # ------------------------------------------------------------------ Auth
  /auth/sign-up:
    post:
      tags: [Auth]
      operationId: signUp
      security: []
      summary: Create an account and its owner user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, maxLength: 120 }
                email: { type: string, format: email }
                phone: { type: string, description: E.164 }
                password: { type: string, minLength: 8, writeOnly: true }
                locale: { type: string, example: en }
      responses:
        '201': { $ref: '#/components/responses/AuthSession' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /auth/sign-in:
    post:
      tags: [Auth]
      operationId: signIn
      security: []
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, writeOnly: true }
                device: { $ref: '#/components/schemas/DeviceInfo' }
      responses:
        '200': { $ref: '#/components/responses/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/otp/request:
    post:
      tags: [Auth]
      operationId: requestOtp
      security: []
      summary: Send a 6-digit sign-in code by SMS
      description: The prototype accepts `123456`. The real server sends the code through the SMS provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, description: E.164, example: '+919876543210' }
                channel: { type: string, enum: [sms, whatsapp], default: sms }
      responses:
        '200':
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string }
                  expiresInSeconds: { type: integer, example: 300 }
                  resendAfterSeconds: { type: integer, example: 30 }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyOtp
      security: []
      summary: Exchange an OTP for a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, code]
              properties:
                requestId: { type: string }
                code: { type: string, pattern: '^[0-9]{6}$' }
                device: { $ref: '#/components/schemas/DeviceInfo' }
      responses:
        '200': { $ref: '#/components/responses/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/password/forgot:
    post:
      tags: [Auth]
      operationId: forgotPassword
      security: []
      summary: Email a password-reset link
      description: Always returns 202, so the response does not reveal whether the email is registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Accepted }
  /auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8, writeOnly: true }
      responses:
        '204': { description: Password changed; all other sessions revoked }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      security: []
      summary: Rotate the refresh token and issue a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200': { $ref: '#/components/responses/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/sign-out:
    post:
      tags: [Auth]
      operationId: signOut
      summary: Revoke the current device session
      responses:
        '204': { description: Signed out }

  # ------------------------------------------------------------------ Me
  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: The signed-in user, their account, and the companies they can reach
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
    patch:
      tags: [Me]
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                phone: { type: string }
                avatarColor: { type: string }
                locale: { type: string, enum: [en, ta] }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /me/onboarding/complete:
    post:
      tags: [Me]
      operationId: completeOnboarding
      responses:
        '204': { description: Marked complete }
  /me/devices:
    get:
      tags: [Me]
      operationId: listDevices
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DeviceSession' } }
  /me/devices/{deviceId}:
    delete:
      tags: [Me]
      operationId: revokeDevice
      summary: Sign a device out. Its refresh token is revoked at once.
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/push-tokens:
    post:
      tags: [Me]
      operationId: registerPushToken
      summary: Register an Expo / FCM / APNs push token for this device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, provider]
              properties:
                token: { type: string }
                provider: { type: string, enum: [expo, fcm, apns] }
      responses:
        '204': { description: Registered }
  /me/push-tokens/{token}:
    delete:
      tags: [Me]
      operationId: unregisterPushToken
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Removed }

  # ------------------------------------------------------------------ Companies
  /companies:
    get:
      tags: [Companies]
      operationId: listCompanies
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Company' } }
    post:
      tags: [Companies]
      operationId: createCompany
      summary: Create a company. Onboarding sends branches, tax and numbering in the same call.
      x-roles: [owner]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Company'
                - type: object
                  properties:
                    branches: { type: array, items: { $ref: '#/components/schemas/Branch' } }
                    numberingSeries: { type: array, items: { $ref: '#/components/schemas/NumberingSeries' } }
                    seedDefaults:
                      type: boolean
                      default: true
                      description: Create default tax categories, expense categories, a cash account and compliance settings for the country.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /companies/{companyId}:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Companies]
      operationId: getCompany
      responses:
        '200':
          description: OK
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
    put:
      tags: [Companies]
      operationId: saveCompany
      x-roles: [owner, admin]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Company' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /companies/{companyId}/logo:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    put:
      tags: [Companies]
      operationId: uploadCompanyLogo
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary, description: 'PNG or JPEG, up to 2 MB' }
      responses:
        '200':
          description: Logo stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
    delete:
      tags: [Companies]
      operationId: removeCompanyLogo
      x-roles: [owner, admin]
      responses:
        '204': { description: Removed }
  /companies/{companyId}/branches:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Companies]
      operationId: listBranches
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Branch' } }
    post:
      tags: [Companies]
      operationId: createBranch
      x-roles: [owner, admin]
      x-plan-module: branches
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Branch' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Branch' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /companies/{companyId}/branches/{branchId}:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { name: branchId, in: path, required: true, schema: { type: string } }
    put:
      tags: [Companies]
      operationId: saveBranch
      x-roles: [owner, admin]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Branch' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Branch' }
    delete:
      tags: [Companies]
      operationId: removeBranch
      x-roles: [owner, admin]
      description: '`409 BRANCH_IN_USE` when documents, stock or users reference the branch, or when it is the primary branch.'
      responses:
        '204': { description: Removed }
        '409': { $ref: '#/components/responses/Conflict' }

  # ------------------------------------------------------------------ Users
  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: Everyone on the account
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/User' } }
    post:
      tags: [Users]
      operationId: inviteUser
      summary: Invite a team member. Sends an email or SMS invite and creates the user with status `invited`.
      x-roles: [owner, admin]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, role, companyIds]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                role: { $ref: '#/components/schemas/UserRole' }
                companyIds: { type: array, items: { type: string } }
                branchIds: { type: array, items: { type: string } }
      responses:
        '201':
          description: Invited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{userId}:
    parameters: [{ name: userId, in: path, required: true, schema: { type: string } }]
    put:
      tags: [Users]
      operationId: saveUser
      summary: Change role, company and branch access, or status
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/User' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '409': { description: Cannot demote or disable the last owner }
    delete:
      tags: [Users]
      operationId: removeUser
      x-roles: [owner, admin]
      responses:
        '204': { description: Removed; their sessions are revoked }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{userId}/resend-invite:
    parameters: [{ name: userId, in: path, required: true, schema: { type: string } }]
    post:
      tags: [Users]
      operationId: resendInvite
      x-roles: [owner, admin]
      responses:
        '202': { description: Sent }
  /invites/{token}/accept:
    parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
    post:
      tags: [Users]
      operationId: acceptInvite
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string, writeOnly: true }
      responses:
        '200': { $ref: '#/components/responses/AuthSession' }

  # ------------------------------------------------------------------ Billing
  /plans:
    get:
      tags: [Billing]
      operationId: listPlans
      security: []
      summary: The plan catalogue (prices and modules), mirroring `PLANS` in `src/domain/plan.ts`
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PlanInfo' } }
  /companies/{companyId}/subscription:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Billing]
      operationId: getSubscription
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
  /companies/{companyId}/subscription/checkout:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    post:
      tags: [Billing]
      operationId: startCheckout
      summary: Start an upgrade or downgrade. The plan changes only after the payment webhook confirms it.
      x-roles: [owner]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan, cycle]
              properties:
                plan: { $ref: '#/components/schemas/PlanTier' }
                cycle: { type: string, enum: [monthly, yearly] }
      responses:
        '200':
          description: Checkout created
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider: { type: string, enum: [razorpay] }
                  subscriptionId: { type: string }
                  checkoutUrl: { type: string, format: uri }
                  keyId: { type: string, description: Public key for the in-app Razorpay checkout }
  /companies/{companyId}/subscription/cancel:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    post:
      tags: [Billing]
      operationId: cancelSubscription
      summary: Cancel at the end of the period. The company then falls back to Free, and no records are lost.
      x-roles: [owner]
      responses:
        '200':
          description: Scheduled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }

  # ------------------------------------------------------------------ Settings (master data)
  /companies/{companyId}/tax-categories:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Settings]
      operationId: listTaxCategories
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/TaxCategory' } }
    post:
      tags: [Settings]
      operationId: createTaxCategory
      x-roles: [owner, admin, accountant]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxCategory' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxCategory' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /companies/{companyId}/tax-categories/{id}:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    put:
      tags: [Settings]
      operationId: saveTaxCategory
      x-roles: [owner, admin, accountant]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaxCategory' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaxCategory' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
    delete:
      tags: [Settings]
      operationId: removeTaxCategory
      x-roles: [owner, admin, accountant]
      description: '`409 TAX_CATEGORY_IN_USE` when items or documents reference it.'
      responses:
        '204': { description: Removed }
        '409': { $ref: '#/components/responses/Conflict' }
  /companies/{companyId}/expense-categories:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Settings]
      operationId: listExpenseCategories
      x-plan-module: expenses
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ExpenseCategory' } }
    post:
      tags: [Settings]
      operationId: createExpenseCategory
      x-roles: [owner, admin, accountant]
      x-plan-module: expenses
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseCategory' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseCategory' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /companies/{companyId}/expense-categories/{id}:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    put:
      tags: [Settings]
      operationId: saveExpenseCategory
      x-roles: [owner, admin, accountant]
      x-plan-module: expenses
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpenseCategory' }
      responses:
        '200':
          description: Saved
