  # ------------------------------------------------------------------ Documents
  /companies/{companyId}/documents:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Documents]
      operationId: listDocuments
      description: 'Purchase-side kinds (`purchaseOrder`, `goodsReceipt`, `purchaseBill`, `purchaseReturn`, `supplierCreditNote`, `supplierDebitNote`) need the `purchases` module.'
      parameters:
        - name: kind
          in: query
          description: One or more kinds, comma-separated
          style: form
          explode: false
          schema: { type: array, items: { $ref: '#/components/schemas/DocumentKind' } }
        - name: status
          in: query
          style: form
          explode: false
          schema: { type: array, items: { $ref: '#/components/schemas/DocStatus' } }
        - { name: partyId, in: query, schema: { type: string } }
        - { name: recurring, in: query, description: 'true: only invoices that repeat', schema: { type: boolean } }
        - { $ref: '#/components/parameters/BranchIdQuery' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { name: outstanding, in: query, description: Only documents with an unpaid balance. Used by the payment allocation screen., schema: { type: boolean } }
        - { name: overdue, in: query, schema: { type: boolean } }
        - { name: eInvoiceStatus, in: query, schema: { $ref: '#/components/schemas/EInvoiceStatus' } }
        - { name: sourceDocumentId, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Q' }
        - { name: sort, in: query, schema: { type: string, enum: [date, -date, number, -number, total, -total], default: -date } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/DocumentSummary' } }
    post:
      tags: [Documents]
      operationId: createDocument
      summary: Create a document. It is a draft unless `status` asks for a finalised one.
      description: |
        The server computes `totals` (FRD §10 order: qty × price → line discount →
        taxable → tax → document discount → charges → round-off → grand total)
        and snapshots each line's `taxRate`. A number is consumed only when the
        document is created finalised. Stock movements are written for
        deliveries, invoices, receipts, bills and returns when they are finalised.
      x-roles: [owner, admin, accountant, sales]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewDocumentInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessDocument' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /companies/{companyId}/documents/summary:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Documents]
      operationId: summarizeDocumentList
      summary: How many documents a list's filters match, what they add up to, and how many are in each status
      description: |
        Takes the filters of `listDocuments`, so a paged list can show its count, total and status
        chips without loading every page. `byStatus` ignores the `status` filter (the chips show every
        status there is); `count` and `total` apply it. The total is in base currency and leaves out
        cancelled and rejected documents.
      parameters:
        - name: kind
          in: query
          style: form
          explode: false
          schema: { type: array, items: { $ref: '#/components/schemas/DocumentKind' } }
        - name: status
          in: query
          style: form
          explode: false
          schema: { type: array, items: { $ref: '#/components/schemas/DocStatus' } }
        - { name: partyId, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/BranchIdQuery' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { $ref: '#/components/parameters/Q' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [count, total, byStatus]
                properties:
                  count: { type: integer }
                  total: { $ref: '#/components/schemas/Money' }
                  byStatus:
                    type: array
                    items:
                      type: object
                      required: [status, count, total]
                      properties:
                        status: { $ref: '#/components/schemas/DocStatus' }
                        count: { type: integer }
                        total: { allOf: [{ $ref: '#/components/schemas/Money' }], description: In base currency }
  /companies/{companyId}/tds/preview:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    post:
      tags: [Documents]
      operationId: previewTds
      x-demo-allowed: true
      x-plan-module: payables
      summary: The TDS a supplier's bill would keep back, as saving it would work it out
      description: |
        Thresholds and catch-up count the deductee's earlier bills in the financial year (by PAN),
        so the editor doesn't need every bill on the device. Nothing is saved. A company with no TAN
        deducts nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partyId, date, taxable]
              properties:
                partyId: { type: string }
                date: { type: string, format: date }
                taxable: { allOf: [{ $ref: '#/components/schemas/Money' }], description: "The bill's taxable value, in base currency" }
                section: { type: string, enum: [none, 194C, 194JA, 194JB, 194H, 194IA, 194IB, 194A, 194Q], description: "The bill's own choice; defaults to the supplier's" }
                documentId: { type: string, description: "The bill being edited, left out of the year so far" }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [rate, amount]
                properties:
                  section: { type: string, description: "The section TDS was worked under; absent when none applies" }
                  rate: { type: number }
                  amount: { $ref: '#/components/schemas/Money' }
                  reason: { type: string }
  /companies/{companyId}/documents/calculate:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    post:
      tags: [Documents]
      operationId: calculateDocument
      x-demo-allowed: true
      summary: Compute totals and tax lines without saving anything
      description: The client's `lineCalc` gives an instant preview. This endpoint is the authoritative check.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewDocumentInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentTotals' }
  /companies/{companyId}/documents/openings/import:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    post:
      tags: [Documents]
      operationId: importOpeningDocuments
      summary: What customers owed, and what was owed to suppliers, invoice by invoice, when the books started here
      description: >-
        Each row becomes an openingInvoice (a customer owes it) or openingBill (we owe a supplier), issued
        under its original number and due date, for the amount still outstanding. They are paid, aged and
        shown on statements like an invoice or bill, and post only Dr party / Cr Opening balances (or the
        other way for a bill), never sales, purchases or GST (RULES 6.12). The party is found by GSTIN, or
        failing that by name in any case, and must be on that side (customer or supplier, or both). A party
        that already has an opening balance is refused, so nothing is counted twice: clear the balance, or
        leave its rows out. A number already used for that kind, here or earlier in the batch, is a
        duplicate. With `dryRun` nothing is written; otherwise every good row is created in one transaction.
      x-roles: [owner, admin, accountant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                rows:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: object
                    required: [kind, party, number, date, amount]
                    properties:
                      kind: { type: string, enum: [openingInvoice, openingBill] }
                      party: { type: string, description: GSTIN or name of the customer or supplier }
                      number: { type: string, minLength: 1, maxLength: 40, description: The invoice or bill number it was raised under }
                      date: { type: string, format: date }
                      dueDate: { type: string, format: date }
                      amount: { allOf: [{ $ref: '#/components/schemas/Money' }], description: "What is still outstanding on it, in the company's currency" }
                dryRun: { type: boolean, default: false }
      responses:
        '200':
          description: What happened to each row
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  skipped: { type: integer }
                  invalid: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        index: { type: integer }
                        status: { type: string, enum: [created, duplicate, invalid] }
                        id: { type: string }
                        partyName: { type: string }
                        issues: { type: array, items: { $ref: '#/components/schemas/ComplianceIssue' } }
  /companies/{companyId}/documents/{id}:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Documents]
      operationId: getDocument
      responses:
        '200':
          description: OK
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Documents]
      operationId: updateDocument
      description: |
        Merges the patch and recomputes totals. Lines, party, currency and dates
        are editable only while the document is a draft. After finalisation only
        `notes`, `terms`, `reference` and `attachmentIds` can change, and an
        e-invoiced document is locked (`409 DOCUMENT_LOCKED`).

        The exception (RULES 6.23, pending CA): an issued invoice whose `editable` is true is edited
        in full. It is recomputed as a draft save is and keeps its number and branch; its stock is
        taken back and posted again, and its expected TDS and TCS worked out afresh. Its date may not
        move before the invoice issued before it (422 DATE_BEFORE_PREVIOUS), out of its numbering
        period (422 DATE_OUTSIDE_SERIES), or into a closed (409 PERIOD_LOCKED) or filed (409
        RETURN_FILED) period. The audit trail keeps the invoice before and after. When `editable` is
        false, a change beyond those fields is 409 DOCUMENT_FINALIZED, naming the reason.
      x-roles: [owner, admin, accountant, sales]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewDocumentInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessDocument' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
    delete:
      tags: [Documents]
      operationId: removeDocument
      description: Only drafts can be deleted. A finalised document must be cancelled through `/status`, so its number is not lost. Stock movements the document wrote are reversed.
      x-roles: [owner, admin]
      responses:
        '204': { description: Removed }
        '409': { $ref: '#/components/responses/Conflict' }
  /companies/{companyId}/approvals:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Documents]
      operationId: listApprovals
      summary: Documents waiting for an owner or admin to approve them, oldest first
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/BusinessDocument' } }
  /companies/{companyId}/documents/{id}/approve:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Documents]
      operationId: approveDocument
      summary: Approves a document waiting for approval and issues it (409 NOT_AWAITING_APPROVAL otherwise)
      x-roles: [owner, admin]
      responses:
        '200':
          description: Issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessDocument' }
        '409': { $ref: '#/components/responses/Conflict' }
  /companies/{companyId}/documents/{id}/reject:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Documents]
      operationId: rejectDocument
      summary: Sends a document waiting for approval back to its creator as a draft, with why
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Sent back
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessDocument' }
        '409': { $ref: '#/components/responses/Conflict' }
  /companies/{companyId}/documents/{id}/finalize:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Documents]
      operationId: finalizeDocument
      summary: Assign a number, move to the kind's issued state, write stock, and auto-report compliance
      description: |
        Target status by kind: quote → `sent`; salesOrder/purchaseOrder → `confirmed`;
        delivery → `delivered`; goodsReceipt → `received`; returns → `approved`;
        invoice/purchaseBill → `issued`. When compliance settings have
        auto-generation on, the e-invoice and e-way bill are attempted too. Their
        outcome is in `compliance`, and a failed attempt does not roll back the
        finalisation.
      x-roles: [owner, admin, accountant, sales]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                overrideCreditLimit: { type: boolean, writeOnly: true, description: 'Finalise an invoice even though it takes the customer past their credit limit; without it that is 422 CREDIT_LIMIT_EXCEEDED.' }
      responses:
        '200':
          description: Finalised
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { $ref: '#/components/schemas/BusinessDocument' }
                  compliance:
                    type: object
                    properties:
                      eInvoice: { $ref: '#/components/schemas/ComplianceResult' }
                      ewayBill: { $ref: '#/components/schemas/ComplianceResult' }
        '409': { $ref: '#/components/responses/Conflict' }
  /companies/{companyId}/documents/{id}/status:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Documents]
      operationId: setDocumentStatus
      summary: Move a document to another status
      description: |
        Only transitions allowed by `src/domain/documentStates.ts` are accepted;
        anything else returns `409 INVALID_TRANSITION`. `paid`, `partiallyPaid`
        and `overdue` are derived by the server from payments and the due date,
        so clients cannot set them.
      x-roles: [owner, admin, accountant, sales]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/DocStatus' }
                reason: { type: string }
                overrideCreditLimit: { type: boolean, writeOnly: true, description: 'Finalise an invoice even though it takes the customer past their credit limit; without it that is 422 CREDIT_LIMIT_EXCEEDED.' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessDocument' }
        '409': { $ref: '#/components/responses/Conflict' }
  /companies/{companyId}/documents/{id}/convert:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Documents]
      operationId: convertDocument
      summary: Create a draft of another kind from this one (quote → order → delivery → invoice, PO → receipt → bill, invoice → return)
      x-roles: [owner, admin, accountant, sales]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetKind]
              properties:
                targetKind: { $ref: '#/components/schemas/DocumentKind' }
                lineIds: { type: array, items: { type: string }, description: Convert only these lines (partial fulfilment). All lines when omitted. }
      responses:
        '201':
          description: Draft created, with `sourceDocumentId` set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessDocument' }
        '409': { $ref: '#/components/responses/Conflict' }
  /companies/{companyId}/documents/{id}/duplicate:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Documents]
      operationId: duplicateDocument
      x-roles: [owner, admin, accountant, sales]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '201':
          description: A new draft dated today
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessDocument' }
  /companies/{companyId}/documents/{id}/recurrence:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    put:
      tags: [Documents]
      operationId: setDocumentRecurrence
      summary: Repeat an issued invoice weekly, monthly, quarterly or yearly
      description: >-
        The invoice becomes the template: each day the scheduler issues a copy for every date that has
        fallen due (same customer, lines and prices at the tax rates of the day, due the same number of
        days after its date), numbered from the series and e-invoiced like any other, and emails it when
        `autoSend` is on. Counting from the template's date keeps a series on the 31st at month ends.
        `none` stops it. Only an issued, uncancelled invoice that is not itself a copy can repeat
        (422 NOT_RECURRABLE).
      x-roles: [owner, admin, accountant]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recurrence]
              properties:
                recurrence: { type: string, enum: [none, weekly, monthly, quarterly, yearly] }
                endDate: { type: string, format: date, description: No copy is dated after this }
                autoSend: { type: boolean, default: false, description: Email each copy to the customer when it is issued }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessDocument' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /companies/{companyId}/documents/{id}/print-layout:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    put:
      tags: [Documents]
      operationId: setDocumentPrintLayout
      summary: Print this document in another layout than the company's
      description: >-
        How it prints, not what it says: an issued, e-invoiced or filed document can change it, and its
        PDF, share link and the copies emailed from now on follow. `null` goes back to the company's.
      x-roles: [owner, admin, accountant, sales]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [layout]
              properties:
                layout: { type: [string, 'null'], enum: [standard, classic, detailed, modern, null] }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessDocument' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /companies/{companyId}/documents/{id}/pdf:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Documents]
      operationId: getDocumentPdf
      summary: The printed document, with the IRN, signed QR, e-way bill number and UPI QR when present
      parameters:
        - { name: locale, in: query, schema: { type: string, enum: [en, ta] } }
        - { name: copy, in: query, description: 'Which copy (Rule 48), labelled at the top; `all` prints the original, duplicate and triplicate on separate sheets', schema: { type: string, enum: [original, duplicate, triplicate, all], default: original } }
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
  /companies/{companyId}/documents/{id}/share-link:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Documents]
      operationId: createShareLink
      summary: A public, expiring link where the customer can view, download and pay the document
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
                  pdfUrl: { type: string, format: uri, description: A signed link straight to the PDF in blob storage }
                  pdfExpiresAt: { type: string, format: date-time }
  /companies/{companyId}/documents/{id}/send:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Documents]
      operationId: sendDocument
      summary: Email, WhatsApp or SMS the document to the party
      description: Delivers the PDF or share link. A draft quote or an issued invoice moves to `sent`, and an `invoiceSent` notification is written.
      x-roles: [owner, admin, accountant, sales]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel: { type: string, enum: [email, whatsapp, sms] }
                to: { type: array, items: { type: string }, description: Defaults to the party's email or phone }
                cc: { type: array, items: { type: string } }
                message: { type: string }
                attachPdf: { type: boolean, default: true }
                includePaymentLink: { type: boolean, default: false }
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  messageId: { type: string }
                  status: { type: string, enum: [queued] }
        '502': { $ref: '#/components/responses/UpstreamError' }
  /companies/{companyId}/documents/{id}/payment-link:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Documents]
      operationId: createPaymentLink
      summary: A Razorpay payment link for the outstanding amount. A payment recorded by the gateway webhook is allocated to this document.
      x-roles: [owner, admin, accountant, sales]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { $ref: '#/components/schemas/Money' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
                  upiUri: { type: string, example: 'upi://pay?pa=vertex@okicici&am=11800.00&tn=INV-0042' }
                  expiresAt: { type: string, format: date-time }

  # ------------------------------------------------------------------ Compliance: e-invoice
  /companies/{companyId}/documents/{id}/e-invoice:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Compliance]
      operationId: getEInvoice
      summary: IRN, ack number and date, signed QR, and the last issues
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComplianceInfo' }
    post:
      tags: [Compliance]
      operationId: generateEInvoice
      summary: Validate the document, build the NIC schema 1.1 payload, and register it with the IRP
      description: |
        With `dryRun=true`, it only validates and returns the payload. Blocking
        issues return `422` with `issues[]`. A portal rejection returns `502`
        with the NIC error code (2150, 2172, 2176, 2182, 2211, 3028, 3029) in
        `issues[].code`. Duplicate IRN (2150) is resolved by fetching the
        existing IRN from the portal.
      x-roles: [owner, admin, accountant]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: dryRun, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Generated (or, when `dryRun`, validated)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ComplianceResult'
                  - properties:
                      compliance: { $ref: '#/components/schemas/ComplianceInfo' }
                      payload: { type: object, description: The NIC payload that was (or would be) sent }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '502': { $ref: '#/components/responses/UpstreamError' }
  /companies/{companyId}/documents/{id}/e-invoice/cancel:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Compliance]
      operationId: cancelEInvoice
      summary: Cancel the IRN. The portal allows this only within 24 hours of generation.
      x-roles: [owner, admin, accountant]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelRequest' }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComplianceResult' }
        '409': { description: 'Outside the 24-hour window, or an active e-way bill must be cancelled first' }
        '502': { $ref: '#/components/responses/UpstreamError' }

  # ------------------------------------------------------------------ Compliance: summary
  /companies/{companyId}/compliance/summary:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Compliance]
      operationId: getComplianceSummary
      summary: E-invoice and e-way bill counts for badges and the compliance hub
      description: |
        E-invoices by status (a finalised invoice or credit note that must be reported and has no
        attempt yet counts as pending), e-way bills by status as of now, live bills that run out
        within 24 hours, and finalised documents that need an e-way bill and have no live one.
      parameters:
        - { $ref: '#/components/parameters/BranchIdQuery' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [eInvoice, eway, expiringSoon, ewayOutstanding]
                properties:
                  eInvoice:
                    type: object
                    required: [notApplicable, pending, generated, cancelled, failed]
                    properties:
                      notApplicable: { type: integer }
                      pending: { type: integer }
                      generated: { type: integer }
                      cancelled: { type: integer }
                      failed: { type: integer }
                  eway:
                    type: object
                    required: [active, expired, cancelled]
                    properties: { active: { type: integer }, expired: { type: integer }, cancelled: { type: integer } }
                  expiringSoon: { type: integer }
                  ewayOutstanding: { type: integer }

  /companies/{companyId}/compliance/documents:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Compliance]
      operationId: listComplianceDocuments
      summary: The documents behind the compliance register, newest first
      description: |
        `need=eInvoice` lists invoices and credit notes that are or must be reported, by e-invoice
        status (one that must be reported and has no attempt yet is pending). `need=ewayBill` lists
        finalised documents that need an e-way bill and have no live one.
      parameters:
        - { name: need, in: query, required: true, schema: { type: string, enum: [eInvoice, ewayBill] } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/EInvoiceStatus' }, description: For `eInvoice` only }
        - { name: q, in: query, schema: { type: string }, description: "Number, party or IRN" }
        - { name: limit, in: query, schema: { type: integer, default: 100, minimum: 1, maximum: 500 } }
        - { $ref: '#/components/parameters/BranchIdQuery' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DocumentSummary' } }

  # ------------------------------------------------------------------ Compliance: e-way bills
  /companies/{companyId}/eway-bills:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Compliance]
      operationId: listEwayBills
      parameters:
        - { name: status, in: query, description: '`expired` is derived from `validUpto`', schema: { $ref: '#/components/schemas/EwayBillStatus' } }
        - { name: documentId, in: query, schema: { type: string } }
        - { name: expiringWithinHours, in: query, schema: { type: integer } }
        - { name: q, in: query, schema: { type: string }, description: "Bill number, document number or consignee" }
        - { $ref: '#/components/parameters/BranchIdQuery' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/EwayBill' } }
    post:
      tags: [Compliance]
      operationId: generateEwayBill
      summary: Generate an e-way bill (Part-A and Part-B) for a finalised document
      x-roles: [owner, admin, accountant]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: dryRun, in: query, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewEwayBillInput' }
      responses:
        '201':
          description: Generated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ComplianceResult'
                  - properties:
                      ewayBill: { $ref: '#/components/schemas/EwayBill' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '502': { $ref: '#/components/responses/UpstreamError' }
  /companies/{companyId}/eway-bills/{id}:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Compliance]
      operationId: getEwayBill
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EwayBill' }
  /companies/{companyId}/eway-bills/{id}/pdf:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Compliance]
      operationId: getEwayBillPdf
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
  /companies/{companyId}/eway-bills/{id}/part-b:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Compliance]
      operationId: updateEwayBillPartB
      summary: Change the vehicle or transport leg. This appends to `partBUpdates`.
      x-roles: [owner, admin, accountant]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EwayBillPartBUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ComplianceResult'
                  - properties:
                      ewayBill: { $ref: '#/components/schemas/EwayBill' }
        '409': { description: The bill is cancelled or expired }
        '502': { $ref: '#/components/responses/UpstreamError' }
  /companies/{companyId}/eway-bills/{id}/extend:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Compliance]
      operationId: extendEwayBill
      summary: Extend validity. Allowed only from 8 hours before expiry to 8 hours after it.
      x-roles: [owner, admin, accountant]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExtendEwayBillInput' }
      responses:
        '200':
          description: Extended
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ComplianceResult'
                  - properties:
                      ewayBill: { $ref: '#/components/schemas/EwayBill' }
        '409': { description: Outside the extension window }
        '502': { $ref: '#/components/responses/UpstreamError' }
  /companies/{companyId}/eway-bills/{id}/cancel:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Compliance]
      operationId: cancelEwayBill
      summary: Cancel. Allowed within 24 hours of generation.
      x-roles: [owner, admin, accountant]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelRequest' }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComplianceResult' }
        '409': { description: Outside the cancellation window }
        '502': { $ref: '#/components/responses/UpstreamError' }

  # ------------------------------------------------------------------ Payments
  /companies/{companyId}/payments/summary:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Payments]
      operationId: summarizePaymentList
      summary: How many payments a list's filters match, and what they add up to in base currency
      description: Takes the filters of `listPayments`, so a paged list can show its count and total without loading every page.
      parameters:
        - { name: direction, in: query, schema: { $ref: '#/components/schemas/PaymentDirection' } }
        - { name: partyId, in: query, schema: { type: string } }
        - { name: method, in: query, schema: { $ref: '#/components/schemas/PaymentMethod' } }
        - { name: accountId, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/BranchIdQuery' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { $ref: '#/components/parameters/Q' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [count, total]
                properties:
                  count: { type: integer }
                  total: { $ref: '#/components/schemas/Money' }
  /companies/{companyId}/credit-applications/{applicationId}:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { name: applicationId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Payments]
      operationId: removeCreditApplication
      summary: Undoes a credit note applied to an invoice or bill
      description: |
        Takes back a direct note's credit from the document it was applied to (adjustAdvances): the
        document owes that much again and the note has it to apply elsewhere. Refused in a closed
        period (409 PERIOD_LOCKED).
      x-roles: [owner, admin, accountant]
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /companies/{companyId}/payments/adjust:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Payments]
      operationId: listAdjustable
      summary: A party's unadjusted advances and credit, and its open documents they can settle
      description: |
        Credit on one side: receipts (or payments made) with an unallocated part, and direct credit
        notes (or a supplier's credit notes) not yet applied in full. Open on the other: invoices and
        debit notes (or bills and supplier debit notes) still owed, oldest first. Base currency only.
        `side` picks which side of a party that is both is read; a supplier is read as one.
      parameters:
        - { name: partyId, in: query, required: true, schema: { type: string } }
        - { name: side, in: query, schema: { type: string, enum: [customer, supplier] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Adjustable' }
    post:
      tags: [Payments]
      operationId: adjustAdvances
      summary: Applies a party's advances and direct notes to its open documents
      description: |
        With `allocations`, each names its source (`payment` or `note`) and target; without, every
        unadjusted advance is applied oldest first to the oldest open document (FIFO), notes before
        payments. A payment's part is added to its allocations, so the GST on a service advance comes
        back on the invoice's date (GSTR-1 11B). A note's part is a credit application: not money, and
        no GST on advance moves (RULES 8.13). Refused in a closed period.
      x-roles: [owner, admin, accountant]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partyId]
              properties:
                partyId: { type: string }
                side: { type: string, enum: [customer, supplier] }
                allocations:
                  type: array
                  items: { $ref: '#/components/schemas/AdjustmentAllocation' }
      responses:
        '200':
          description: Applied; what is left on both sides
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Adjustable'
                  - type: object
                    required: [applied]
                    properties:
                      applied: { type: array, items: { $ref: '#/components/schemas/AdjustmentAllocation' } }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /companies/{companyId}/payments:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Payments]
      operationId: listPayments
      description: '`direction=paid` needs the `payables` module.'
      parameters:
        - { name: direction, in: query, schema: { $ref: '#/components/schemas/PaymentDirection' } }
        - { name: partyId, in: query, schema: { type: string } }
        - { name: method, in: query, schema: { $ref: '#/components/schemas/PaymentMethod' } }
        - { name: accountId, in: query, schema: { type: string } }
        - { name: documentId, in: query, description: Payments allocated to this document, schema: { type: string } }
        - { $ref: '#/components/parameters/BranchIdQuery' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { $ref: '#/components/parameters/Q' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Payment' } }
    post:
      tags: [Payments]
      operationId: createPayment
      description: |
        The server assigns `number`, validates that allocations do not exceed each
        document's outstanding amount, computes `unallocated` (held as an
        advance) and `fxGainLoss`, and re-derives the status (`partiallyPaid` or
        `paid`) of every allocated document.
      x-roles: [owner, admin, accountant, sales]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Payment' }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '409':
          description: '`PAYMENT_HELD`: a payment made over the company''s payment approval rule, by someone who is not an owner or admin, is not recorded but kept as a payment request (`requestId`) for them to approve.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /companies/{companyId}/payment-requests:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Payments]
      operationId: listPaymentRequests
      summary: Payments waiting for approval (or decided), oldest request first; others see only their own
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected], default: pending } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PaymentRequest' } }
  /companies/{companyId}/payment-requests/{id}/approve:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Payments]
      operationId: approvePaymentRequest
      summary: Records the payment as the approver (checked as any payment is); 409 NOT_AWAITING_APPROVAL once decided
      x-roles: [owner, admin]
      responses:
        '200':
          description: Approved; `payment` is the payment recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /companies/{companyId}/payment-requests/{id}/reject:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Payments]
      operationId: rejectPaymentRequest
      summary: Turns a payment request down, with why; nothing is recorded
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /companies/{companyId}/payments/{id}:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Payments]
      operationId: getPayment
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
    put:
      tags: [Payments]
      operationId: savePayment
      x-roles: [owner, admin, accountant]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Payment' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
    delete:
      tags: [Payments]
      operationId: removePayment
      description: Re-derives the status of every document the payment was allocated to.
      x-roles: [owner, admin]
      responses:
        '204': { description: Removed }
  /companies/{companyId}/payments/{id}/receipt:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Payments]
      operationId: getPaymentReceiptPdf
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }

  # ------------------------------------------------------------------ Banking
  /companies/{companyId}/bank-statements/{id}:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    delete:
      tags: [Banking]
      operationId: removeBankStatement
      summary: Undo an import
      description: |
        Takes the statement and all its lines away. Whatever its lines were matched to stays in the books, free to match again; payments, expenses and vouchers recorded from its lines are not removed.
        A statement imported later over some of the same days skipped the lines this one had, so it is undone first (409 `LATER_IMPORT_OVERLAPS`).
      x-roles: [owner, admin, accountant]
      x-plan-module: books
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /companies/{companyId}/bank-statements/parse:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    post:
      tags: [Banking]
      operationId: parseBankStatement
      summary: Read an Excel (.xlsx) or CSV bank statement into rows of text
      description: |
        The first worksheet of an .xlsx (dates as dd/mm/yyyy, numbers as plain text), or a CSV
        (UTF-8). At most 5 MB once decoded. The app maps the rows to lines with core's
        `readStatement` and imports them with `importBankStatement`. A legacy .xls gets
        422 `UNSUPPORTED_FILE`.
      x-roles: [owner, admin, accountant]
      x-plan-module: books
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, contentBase64]
              properties:
                fileName: { type: string, maxLength: 200 }
                contentBase64: { type: string, description: 'The file, base64 encoded' }
      responses:
        '200':
          description: The rows, as text
          content:
            application/json:
              schema:
                type: object
                required: [rows]
                properties:
                  rows: { type: array, items: { type: array, items: { type: string } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /companies/{companyId}/payment-accounts/{id}/bank-statements:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Banking]
      operationId: listBankStatements
      summary: The statements imported into a bank account, newest first
      description: Each with how many of its lines are still to explain, matched and excluded.
      x-plan-module: books
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/BankStatement'
                        - type: object
                          required: [unmatched, matched, excluded]
                          properties:
                            unmatched: { type: integer }
                            matched: { type: integer }
                            excluded: { type: integer }
    post:
      tags: [Banking]
      operationId: importBankStatement
      summary: Import a bank statement's lines into a bank account
      description: |
        Lines already imported on this account (same date, amount, narration and running balance)
        are skipped as duplicates. New lines are matched to the account's payments, expenses and
        posted vouchers where there is no doubt (`autoMatched`). With `dryRun` nothing is written
        and the lines come back flagged `duplicate` (200). Only a bank account
        (422 `NOT_A_BANK_ACCOUNT`), in its own currency.
      x-roles: [owner, admin, accountant]
      x-plan-module: books
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BankStatementImport' }
      responses:
        '200':
          description: Dry run; nothing written
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankStatementImportResult' }
        '201':
          description: Imported
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankStatementImportResult' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /companies/{companyId}/payment-accounts/{id}/bank-lines:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Banking]
      operationId: listBankLines
      summary: A bank account's statement lines, newest first
      description: A matched line carries `match`; an unmatched one up to three `suggestions`.
      x-plan-module: books
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/BankLineStatus' } }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/BankStatementLine' } }
  /companies/{companyId}/payment-accounts/{id}/bank-lines/summary:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Banking]
      operationId: summarizeBankLines
      summary: How many of a bank account's lines are matched, waiting and excluded, and the latest statement balance
      x-plan-module: books
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankLineSummary' }
  /companies/{companyId}/payment-accounts/{id}/reconciliation:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Banking]
      operationId: getBankReconciliation
      summary: Bank reconciliation statement as of a day
      x-plan-module: books
      parameters:
        - { name: asOf, in: query, description: Defaults to today, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankReconciliation' }
  /companies/{companyId}/bank-lines/{id}/candidates:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Banking]
      operationId: listBankLineCandidates
      summary: What in the books a line could be matched to
      description: |
        The payments, expenses and posted vouchers through the line's account, dated within 30 days of it either
        way, that no other line is matched to, whatever their amount: those of the line's amount first, then by
        how near their date. `q` keeps those whose number, reference or party's name contains it. At most 100.
      x-plan-module: books
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/BankLineRecord' } }
  /companies/{companyId}/bank-lines/{id}/match:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Banking]
      operationId: matchBankLine
      summary: Match a line to the payment, expense or voucher it is
      description: |
        The record must be on the line's account with the same signed amount
        (422 `MATCH_AMOUNT_DIFFERS`), and not matched to another line (409 `ALREADY_MATCHED`).
        A matched line is unmatched first.
      x-roles: [owner, admin, accountant]
      x-plan-module: books
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, id]
              properties:
                type: { $ref: '#/components/schemas/BankMatchType' }
                id: { type: string }
      responses:
        '200':
          description: Matched
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankStatementLine' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [Banking]
      operationId: unmatchBankLine
      summary: Undo a line's match
      x-roles: [owner, admin, accountant]
      x-plan-module: books
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '200':
          description: Unmatched
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankStatementLine' }
  /companies/{companyId}/bank-lines/{id}/exclude:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Banking]
      operationId: excludeBankLine
      summary: Set a line aside as needing no record in the books
      x-roles: [owner, admin, accountant]
      x-plan-module: books
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Excluded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankStatementLine' }
  /companies/{companyId}/bank-lines/{id}/include:
