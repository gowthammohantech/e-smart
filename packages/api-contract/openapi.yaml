    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    post:
      tags: [Compliance]
      operationId: testComplianceConnection
      summary: Authenticate against the IRP and the EWB portal with the stored credentials
      x-roles: [owner, admin]
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  irp: { type: object, properties: { ok: { type: boolean }, message: { type: string } } }
                  ewb: { type: object, properties: { ok: { type: boolean }, message: { type: string } } }

  # ------------------------------------------------------------------ Parties
  /companies/{companyId}/parties/summary:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Parties]
      operationId: summarizePartyList
      summary: How many parties a list's filters match, and what they owe or are owed, in base currency
      description: Takes the filters of `listParties`. A party in another currency is counted at its latest rate.
      parameters:
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/PartyKind' } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { $ref: '#/components/parameters/Q' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [count, outstanding, overdue, advance]
                properties:
                  count: { type: integer }
                  outstanding: { $ref: '#/components/schemas/Money' }
                  overdue: { $ref: '#/components/schemas/Money' }
                  advance: { $ref: '#/components/schemas/Money' }
  /companies/{companyId}/parties:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Parties]
      operationId: listParties
      parameters:
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/PartyKind' } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { $ref: '#/components/parameters/Q' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/PartyWithBalance' } }
    post:
      tags: [Parties]
      operationId: createParty
      description: 'Suppliers need the `purchases` module. The GSTIN check digit is validated (`src/domain/gstin.ts`).'
      x-roles: [owner, admin, accountant, sales]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Party' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Party' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /companies/{companyId}/parties/{id}:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Parties]
      operationId: getParty
      responses:
        '200':
          description: OK
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartyWithBalance' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Parties]
      operationId: saveParty
      x-roles: [owner, admin, accountant, sales]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Party' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Party' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
    delete:
      tags: [Parties]
      operationId: removeParty
      x-roles: [owner, admin]
      description: '`409 PARTY_IN_USE` when documents or payments reference the party. Set `status: inactive` instead. (The prototype deletes without this check; the server must not.)'
      responses:
        '204': { description: Removed }
        '409': { $ref: '#/components/responses/Conflict' }
  /companies/{companyId}/parties/{id}/statement:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Parties]
      operationId: getPartyStatement
      summary: Running ledger of documents and payments, with opening and closing balance
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartyStatement' }
            application/pdf:
              schema: { type: string, format: binary }

  /companies/{companyId}/parties/import:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    post:
      tags: [Parties]
      operationId: importParties
      summary: Create many contacts at once, from a spreadsheet the app has read
      description: >-
        Each row is checked as createParty checks it. A row whose GSTIN, or failing that whose name (in any
        case), matches a contact already there or an earlier row is skipped as a duplicate. With `dryRun`
        nothing is written and the results say what would happen; otherwise every good row is created in
        one transaction.
      x-roles: [owner, admin, accountant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                rows: { type: array, minItems: 1, maxItems: 1000, items: { $ref: '#/components/schemas/Party' } }
                dryRun: { type: boolean, default: false }
      responses:
        '200':
          description: What happened to each row
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  skipped: { type: integer }
                  invalid: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        index: { type: integer }
                        status: { type: string, enum: [created, duplicate, invalid] }
                        id: { type: string }
                        issues: { type: array, items: { $ref: '#/components/schemas/ComplianceIssue' } }

  # ------------------------------------------------------------------ Catalog
  /companies/{companyId}/items/import:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    post:
      tags: [Catalog]
      operationId: importItems
      summary: Create many items at once, from a spreadsheet the app has read
      description: >-
        Each row is checked as createItem checks it (unit, tax category, prices, opening stock).
        A row whose SKU or barcode is already taken, by an item there or an earlier row, or whose name
        (in any case) matches one, is skipped as a duplicate. A blank SKU takes the next free number.
        With `dryRun` nothing is written and the results say what would happen; otherwise every good row
        is created in one transaction, opening stock posted at the primary branch as createItem does.
      x-roles: [owner, admin, accountant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                rows: { type: array, minItems: 1, maxItems: 1000, items: { $ref: '#/components/schemas/Item' } }
                dryRun: { type: boolean, default: false }
      responses:
        '200':
          description: What happened to each row
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  skipped: { type: integer }
                  invalid: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        index: { type: integer }
                        status: { type: string, enum: [created, duplicate, invalid] }
                        id: { type: string }
                        issues: { type: array, items: { $ref: '#/components/schemas/ComplianceIssue' } }
  /companies/{companyId}/items:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Catalog]
      operationId: listItems
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [goods, service] } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { name: barcode, in: query, description: 'Exact match, used by the scanner', schema: { type: string } }
        - { name: lowStock, in: query, schema: { type: boolean } }
        - { name: stock, in: query, description: 'low: in stock but at or under its reorder level; out: tracked and none on hand; tracked: every item that keeps stock; untracked: services and items without stock', schema: { type: string, enum: [low, out, tracked, untracked] } }
        - { name: branchId, in: query, description: Branch for `stockOnHand`, schema: { type: string } }
        - { name: categoryId, in: query, description: Items in this item category, schema: { type: string } }
        - { name: brandId, in: query, description: Items of this brand, schema: { type: string } }
        - { $ref: '#/components/parameters/Q' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/ItemWithStock' } }
    post:
      tags: [Catalog]
      operationId: createItem
      description: When `trackInventory` is set and `openingStock > 0`, the server also writes an `opening` stock movement, dated `openingStockDate` (today when it is left out).
      x-roles: [owner, admin, accountant]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Item' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '409': { description: SKU or barcode already used in this company }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /companies/{companyId}/items/{id}:
    parameters:
