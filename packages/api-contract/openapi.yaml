  /companies/{companyId}/books/{view}:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - name: view
        in: path
        required: true
        schema: { type: string, enum: [trial-balance, profit-loss, balance-sheet, ledger, day-book, cost-centres, accounts, integrity] }
    get:
      tags: [Books]
      operationId: getBooksView
      x-plan-module: books
      summary: One of the books' statements, worked out from the whole book
      description: |
        The same `@esmart/core` ledger functions the app ran on the device, on the server's book:
        `trial-balance` (core trialBalance over from–to), `profit-loss` (ProfitAndLoss over from–to), `balance-sheet` (BalanceSheet as of `to`), `ledger`
        (one account's LedgerStatement over from–to; needs `account`), `day-book` (DayBookEntry[] over
        from–to), `cost-centres` (CostCentreRow[] over from–to) and `accounts` (the chart of accounts,
        the book it names accounts from, and each account's balance as of `to`) and `integrity` (IntegrityCheck[] as of
        `to`: the ledger against the records it comes from). `profit-loss` and `balance-sheet` take `breakdown`
        (ProfitAndLossColumns / BalanceSheetColumns, a column per month or quarter of from–to) or `compare` (two
        columns: the range and the one before it, or the same dates last year). Amounts are base-currency
        paise, as core gives them. The books cover every branch, so a user limited to some is refused.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: account, in: query, description: "The account key, for `ledger`", schema: { type: string } }
        - { name: breakdown, in: query, description: "For `profit-loss` and `balance-sheet`: a column per month or quarter", schema: { type: string, enum: [month, quarter] } }
        - { name: compare, in: query, description: "For `profit-loss` and `balance-sheet`: beside the period before, or the same dates last year", schema: { type: string, enum: [previousPeriod, previousYear] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /companies/{companyId}/vouchers:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Books]
      operationId: listVouchers
      x-plan-module: books
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [journal, contra, gstJournal, tdsChallan, receipt] } }
        - { name: status, in: query, schema: { type: string, enum: [draft, posted] } }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Voucher' } }
    post:
      tags: [Books]
      operationId: createVoucher
      description: The server assigns `number` from the kind's series. A voucher sent with status `draft` is kept out of the books and takes no number (its `number` is its id) until a save sets status `posted`; a draft may be unbalanced or have one line, and is not refused in a closed period. A posted voucher must follow every rule. Debits must equal credits; a contra moves money only between cash and bank accounts; a GST journal touches a GST ledger; a TDS challan clears TDS payable. Refused in a closed period (409 PERIOD_LOCKED).
      x-roles: [owner, admin, accountant]
      x-plan-module: books
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Voucher' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Voucher' }
  /companies/{companyId}/vouchers/{id}:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Books]
      operationId: getVoucher
      x-plan-module: books
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Voucher' }
    put:
      tags: [Books]
      operationId: saveVoucher
      x-roles: [owner, admin, accountant]
      x-plan-module: books
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Voucher' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Voucher' }
    delete:
      tags: [Books]
      operationId: removeVoucher
      x-roles: [owner, admin, accountant]
      x-plan-module: books
      responses:
        '204': { description: Removed }

