    get:
      tags: [Settings]
      operationId: previewNextNumber
      summary: The number the next finalised document would get. Nothing is consumed.
      parameters:
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: branchId, in: query, schema: { type: string } }
      responses:
        '200':
