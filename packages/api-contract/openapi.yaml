      operationId: summarizeVoucherList
      x-plan-module: books
      summary: How many vouchers a list's filters match, what they add up to, and the split by account
      description: Takes the filters of `listVouchers`. `total` adds up each voucher's debits; `byAccount` totals by the account credited (for receipts, what the money was for). Base currency.
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [journal, contra, gstJournal, tdsChallan, receipt, gstChallan] } }
        - { name: status, in: query, schema: { type: string, enum: [draft, posted] } }
        - { name: partyId, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { $ref: '#/components/parameters/Q' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [count, total, byAccount]
                properties:
                  count: { type: integer }
                  total: { $ref: '#/components/schemas/Money' }
                  byAccount:
                    type: array
                    items:
                      type: object
                      required: [account, total]
                      properties: { account: { type: string }, total: { $ref: '#/components/schemas/Money' } }
  /companies/{companyId}/vouchers:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Books]
      operationId: listVouchers
      x-plan-module: books
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [journal, contra, gstJournal, tdsChallan, receipt, gstChallan] } }
        - { name: status, in: query, schema: { type: string, enum: [draft, posted] } }
        - { name: partyId, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { $ref: '#/components/parameters/Q' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Voucher' } }
    post:
      tags: [Books]
      operationId: createVoucher
      description: The server assigns `number` from the kind's series. A voucher sent with status `draft` is kept out of the books and takes no number (its `number` is its id) until a save sets status `posted`; a draft may be unbalanced or have one line, and is not refused in a closed period. A posted voucher must follow every rule. Debits must equal credits; a contra moves money only between cash and bank accounts; a GST journal touches a GST ledger; a TDS challan clears TDS payable. Refused in a closed period (409 PERIOD_LOCKED).
      x-roles: [owner, admin, accountant]
      x-plan-module: books
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Voucher' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Voucher' }
  /companies/{companyId}/vouchers/import:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    post:
      tags: [Books]
      operationId: importVouchers
      summary: Journals from a spreadsheet, each checked as one entered by hand
      description: Up to 500 journals. With asDrafts each is kept as a draft (unbalanced ones too); otherwise each is posted and must follow every voucher rule. dryRun checks and saves nothing; the good ones are saved in one transaction.
      x-roles: [owner, admin, accountant]
      x-plan-module: books
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vouchers]
              properties:
                asDrafts: { type: boolean, default: false }
                dryRun: { type: boolean, default: false }
                vouchers:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [date, lines]
                    properties:
                      kind: { type: string, enum: [journal, contra, gstJournal, tdsChallan, receipt, gstChallan] }
                      date: { type: string, format: date }
                      reference: { type: string }
                      narration: { type: string }
                      lines: { type: array, minItems: 1, items: { $ref: '#/components/schemas/VoucherLine' } }
      responses:
        '200':
          description: What happened to each journal
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  invalid: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        index: { type: integer }
                        status: { type: string, enum: [created, invalid] }
                        id: { type: string }
                        number: { type: string }
                        issues: { type: array, items: { $ref: '#/components/schemas/ComplianceIssue' } }
  /companies/{companyId}/voucher-templates:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Books]
      operationId: listVoucherTemplates
      x-plan-module: books
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/VoucherTemplate' } }
    post:
      tags: [Books]
      operationId: createVoucherTemplate
      x-roles: [owner, admin, accountant]
      x-plan-module: books
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoucherTemplate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoucherTemplate' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /companies/{companyId}/voucher-templates/{id}:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    put:
      tags: [Books]
      operationId: saveVoucherTemplate
      x-roles: [owner, admin, accountant]
      x-plan-module: books
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoucherTemplate' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VoucherTemplate' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
    delete:
      tags: [Books]
      operationId: removeVoucherTemplate
      x-roles: [owner, admin, accountant]
      x-plan-module: books
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '204': { description: Removed }
  /companies/{companyId}/vouchers/{id}:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Books]
      operationId: getVoucher
      x-plan-module: books
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Voucher' }
    put:
      tags: [Books]
      operationId: saveVoucher
      x-roles: [owner, admin, accountant]
      x-plan-module: books
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Voucher' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Voucher' }
    delete:
      tags: [Books]
      operationId: removeVoucher
      x-roles: [owner, admin, accountant]
      x-plan-module: books
      responses:
        '204': { description: Removed }

  # ------------------------------------------------------------------ Inventory
  /companies/{companyId}/stock/levels:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Inventory]
      operationId: getStockLevels
      summary: On-hand quantity per item (and branch), derived from the movement ledger
      x-plan-module: inventory
      parameters:
        - { $ref: '#/components/parameters/BranchIdQuery' }
        - { name: itemId, in: query, schema: { type: string } }
        - { name: lowStock, in: query, description: Only items at or below `reorderLevel`, schema: { type: boolean } }
        - { name: asOf, in: query, description: "What a document dated this day can take out: stock by the end of it, never more than the lowest on a later day", schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        itemId: { type: string }
                        branchId: { type: [string, 'null'] }
                        onHand: { type: number }
                        reorderLevel: { type: number }
                        low: { type: boolean }
                        value: { $ref: '#/components/schemas/Money' }
  /companies/{companyId}/items/{id}/ledger:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }, { $ref: '#/components/parameters/Id' }]
    get:
      tags: [Inventory]
      operationId: getItemLedger
      x-plan-module: inventory
      summary: One item's stock on hand, value and movements with a running balance
      description: The movements come newest first, at most 200; the balance after each is counted from the first.
      parameters:
        - { $ref: '#/components/parameters/BranchIdQuery' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [onHand, value, low, soldQuantity, rows]
                properties:
                  onHand: { type: number }
                  value: { allOf: [{ $ref: '#/components/schemas/Money' }], description: "Weighted-average value of what is on hand, in base currency" }
                  low: { type: boolean }
                  soldQuantity: { type: number, description: "Sold on finalised invoices, all time" }
                  rows:
                    type: array
                    items:
                      type: object
                      required: [movement, delta, balance]
                      properties:
                        movement: { $ref: '#/components/schemas/StockMovement' }
                        delta: { type: number }
                        balance: { type: number }
  /companies/{companyId}/stock/movements:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Inventory]
      operationId: listStockMovements
      summary: The movement ledger. It is immutable, so there is no PUT or DELETE.
      x-plan-module: inventory
      parameters:
        - { name: itemId, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/StockMovementType' } }
        - { name: referenceId, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/BranchIdQuery' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { $ref: '#/components/parameters/Q' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/StockMovement' } }
  /companies/{companyId}/stock/adjustments:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    post:
      tags: [Inventory]
      operationId: adjustStock
      summary: Record one or more adjustments (signed quantities) or opening stock
      x-roles: [owner, admin, accountant]
      x-plan-module: inventory
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branchId, date, lines]
              properties:
                branchId: { type: string }
                date: { type: string, format: date }
                type: { type: string, enum: [adjustment, opening], default: adjustment }
                reason: { type: string, enum: [damaged, lost, found, recount, expired, other] }
                notes: { type: string }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [itemId, quantity]
                    properties:
                      itemId: { type: string }
                      quantity: { type: number, description: Signed; negative reduces stock }
                      unitCost: { $ref: '#/components/schemas/Money' }
      responses:
        '201':
          description: Movements written
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/StockMovement' } }
        '422': { description: 'Would take stock negative, when the company forbids that' }
  /companies/{companyId}/stock/transfers:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    post:
      tags: [Inventory]
      operationId: transferStock
      summary: Move stock between branches. Writes a paired transferOut and transferIn.
      x-roles: [owner, admin, accountant]
      x-plan-module: branches
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId, fromBranchId, toBranchId, quantity, date]
              properties:
                itemId: { type: string }
                fromBranchId: { type: string }
                toBranchId: { type: string }
                quantity: { type: number, exclusiveMinimum: 0 }
                date: { type: string, format: date }
                notes: { type: string }
      responses:
        '201':
          description: Transferred
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/StockMovement' } }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ------------------------------------------------------------------ Attachments
  /companies/{companyId}/attachments:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Attachments]
      operationId: listAttachments
      parameters:
        - { name: entityType, in: query, schema: { type: string } }
        - { name: entityId, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
    post:
      tags: [Attachments]
      operationId: createAttachmentUpload
      summary: Reserve an attachment and get a pre-signed upload URL (S3 / GCS / R2)
      description: The client PUTs the bytes to `uploadUrl`, then calls `/complete`. Limit is 10 MB. Allowed types are images and PDF.
      x-roles: [owner, admin, accountant, sales]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, mimeType, size]
              properties:
                name: { type: string }
                mimeType: { type: string, enum: [image/jpeg, image/png, image/heic, application/pdf] }
                size: { type: integer, maximum: 10485760 }
                entityType: { type: string }
                entityId: { type: string }
      responses:
        '201':
          description: Reserved
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachment: { $ref: '#/components/schemas/Attachment' }
                  uploadUrl: { type: string, format: uri }
                  uploadHeaders: { type: object, additionalProperties: { type: string } }
                  expiresAt: { type: string, format: date-time }
  /companies/{companyId}/attachments/{id}/complete:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Attachments]
      operationId: completeAttachmentUpload
      responses:
        '200':
          description: Upload verified and the attachment is live
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
  /companies/{companyId}/attachments/{id}:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Attachments]
      operationId: getAttachment
      summary: Metadata plus a short-lived signed download URL in `uri`
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
    delete:
      tags: [Attachments]
      operationId: removeAttachment
      x-roles: [owner, admin, accountant]
      responses:
        '204': { description: Removed }

  # ------------------------------------------------------------------ OCR
  /companies/{companyId}/ocr/extractions:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    post:
      tags: [OCR]
      operationId: createOcrExtraction
      summary: Extract fields from an uploaded bill or receipt image
      description: Upload the image as an attachment first. Send `text` when the device already read the image (ML Kit); with OCR_PROVIDER=disabled that is the only way in, and an image alone answers 503. Poll the extraction, or wait for the `ocr.completed` push.
      x-roles: [owner, admin, accountant]
      x-plan-module: ocr
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attachmentId, kind]
              properties:
                attachmentId: { type: string }
                kind: { type: string, enum: [expense, purchaseBill] }
                text: { type: string, maxLength: 20000, description: 'Text the device already read off the image; skips recognition' }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OcrExtraction' }
        '503': { $ref: '#/components/responses/FeatureUnavailable' }
  /companies/{companyId}/ocr/extractions/{id}:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [OCR]
      operationId: getOcrExtraction
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OcrExtraction' }

  # ------------------------------------------------------------------ Ledger
  /companies/{companyId}/cash-forecast:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Reports]
      operationId: getCashForecast
      summary: Cash and bank week by week, from what is owed each way and what recurs
      description: >-
        Today's cash and bank balances, plus open invoices and debit notes by due date, less open bills by due date,
        plus copies of recurring invoices and recurring expenses on their dates. Overdue amounts count in the first
        week, marked. Base-currency minor units, as core's CashForecast.
      x-roles: [owner, admin, accountant]
      parameters:
        - { name: weeks, in: query, schema: { type: integer, minimum: 1, maximum: 52, default: 13 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /companies/{companyId}/receivables:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Ledger]
      operationId: getReceivables
      summary: Outstanding invoices with aging buckets (current, 1–30, 31–60, 61–90, 90+)
      parameters:
        - { name: asOf, in: query, schema: { type: string, format: date } }
        - { name: partyId, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/BranchIdQuery' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgingReport' }
  /companies/{companyId}/payables:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Ledger]
      operationId: getPayables
      x-plan-module: payables
      parameters:
        - { name: asOf, in: query, schema: { type: string, format: date } }
        - { name: partyId, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/BranchIdQuery' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgingReport' }
  /companies/{companyId}/receivables/reminders:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    post:
      tags: [Ledger]
      operationId: sendPaymentReminder
      summary: Send a payment reminder over WhatsApp, SMS or email (replaces the `wa.me` deep link)
      x-roles: [owner, admin, accountant, sales]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partyId, channel]
              properties:
                partyId: { type: string }
                documentIds: { type: array, items: { type: string } }
                channel: { type: string, enum: [whatsapp, sms, email] }
                message: { type: string }
                includePaymentLink: { type: boolean, default: true }
      responses:
        '202': { description: Queued }

  # ------------------------------------------------------------------ Reports
  /companies/{companyId}/report-data/{reportKey}:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - name: reportKey
        in: path
        required: true
        schema:
          type: string
          enum: [sales-summary, purchase-summary, expense-summary, receivables, payables, stock, tax-summary, payments, advances, profit, tds-register, tds-payable, tds-receivable, tds-26q, tds-challans, tcs-register, tcs-payable, msme-payables, gstr1]
    get:
      tags: [Reports]
      operationId: getReportData
      summary: A report as the app shows it, worked out on the server
      description: |
        The same `@esmart/core` reports function the app ran on the device, on the server's records
        (the whole book up to `to`, so balances carry their history), with the same filters. Shaped as
        core returns it, amounts as Money in base currency. A report outside the plan is refused.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/BranchIdQuery' }
        - { name: partyId, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /companies/{companyId}/reports/{reportKey}:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - name: reportKey
        in: path
        required: true
        schema:
          type: string
          enum: [sales-summary, purchase-summary, expense-summary, receivables, payables, stock, tax-summary, payments, profit, tds-register, trial-balance, msme-payables]
    get:
      tags: [Reports]
      operationId: getReport
      summary: One of the nine PRD reports, in base currency
      description: |
        `purchase-summary`, `expense-summary`, `payables`, `stock` and `profit` need
        a full plan. Send `Accept: text/csv` or `application/pdf` to export.
        The response schema depends on `reportKey`: sales/purchase-summary →
        TransactionSummary, expense-summary → ExpenseSummary, receivables/payables →
        AgingReport, stock → StockReport, tax-summary → TaxSummary, payments →
        PaymentSummary, profit → ProfitSnapshot, tds-register → TdsRegister,
        trial-balance → TrialBalance (the whole books, not only the period's documents),
        msme-payables → MsmePayables (as of `to`; `from` is ignored).
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/BranchIdQuery' }
        - { name: partyId, in: query, schema: { type: string } }
        - { name: currency, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/TransactionSummary'
                  - $ref: '#/components/schemas/ExpenseSummary'
                  - $ref: '#/components/schemas/AgingReport'
                  - $ref: '#/components/schemas/StockReport'
                  - $ref: '#/components/schemas/TaxSummary'
                  - $ref: '#/components/schemas/PaymentSummary'
                  - $ref: '#/components/schemas/MsmePayables'
                  - $ref: '#/components/schemas/ProfitSnapshot'
                  - $ref: '#/components/schemas/TdsRegister'
                  - $ref: '#/components/schemas/TrialBalance'
            text/csv:
              schema: { type: string }
            application/pdf:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------------------------ GST
  /companies/{companyId}/gst/portal-sessions:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [GST]
      operationId: listGstPortalSessions
      summary: The business's GSTINs and whether each is connected to the GST portal
      x-roles: [owner, admin, accountant]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/GstPortalSession' } } } }
    post:
      tags: [GST]
      operationId: connectGstPortal
      summary: Opens the taxpayer's GST portal session with the OTP sent to their registered phone
      description: >-
        The taxpayer switches API access on in the portal (Profile → Manage API Access) first. The
        session lasts six hours and refreshes on its own for as long as they chose there (up to 30 days).
      x-roles: [owner, admin, accountant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gstin, otp]
              properties:
                gstin: { type: string }
                otp: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Connected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GstPortalSession' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /companies/{companyId}/gst/portal-sessions/otp:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    post:
      tags: [GST]
      operationId: requestGstPortalOtp
      summary: Asks the GST portal to send an OTP to the taxpayer's registered phone
      x-roles: [owner, admin, accountant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gstin, username]
              properties:
                gstin: { type: string }
                username: { type: string, description: The GST portal username }
      responses:
        '202': { description: OTP sent }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /companies/{companyId}/gst/portal-sessions/{gstin}:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { name: gstin, in: path, required: true, schema: { type: string } }
    delete:
      tags: [GST]
      operationId: disconnectGstPortal
      x-roles: [owner, admin, accountant]
      responses:
        '204': { description: Disconnected }
  /companies/{companyId}/gst/returns:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [GST]
      operationId: listGstReturns
      summary: GSTR-1 and GSTR-3B for a financial year, as recorded here and, when connected, as the portal tracks them
      x-roles: [owner, admin, accountant]
      parameters:
        - { name: fy, in: query, required: true, schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$', example: '2026-27' } }
        - { name: gstin, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/GstReturn' } }, portal: { type: boolean, description: Whether the portal was asked } } }

  /companies/{companyId}/gst/gstr2b:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [GST]
      operationId: getGstr2b
      summary: A period's GSTR-2B matched against the purchase register
      x-roles: [owner, admin, accountant]
      x-plan-module: purchases
      parameters:
        - { name: gstin, in: query, required: true, schema: { type: string } }
        - { name: period, in: query, required: true, schema: { type: string, pattern: '^(0[1-9]|1[0-2])[0-9]{4}$', example: '092026' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gstr2bReconciliation' }
  /companies/{companyId}/gst/gstr2b/fetch:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    post:
      tags: [GST]
      operationId: fetchGstr2b
      summary: Downloads a period's GSTR-2B through the GST portal session, keeping decisions already made
      description: 409 GSTR2B_NOT_GENERATED until GSTN has made it (the 14th of the next month, for most).
      x-roles: [owner, admin, accountant]
      x-plan-module: purchases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gstin, period]
              properties:
                gstin: { type: string }
                period: { type: string, pattern: '^(0[1-9]|1[0-2])[0-9]{4}$' }
      responses:
        '200':
          description: Downloaded and matched
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gstr2bReconciliation' }
  /companies/{companyId}/gst/gstr2b/import:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    post:
      tags: [GST]
      operationId: importGstr2b
      summary: Reads a GSTR-2B file downloaded from the GST portal, in place of downloading it through a session
      description: |
        The JSON the portal gives (Returns → GSTR-2B → Download → JSON: `data.docdata.b2b`, `b2ba`, `cdnr`,
        `cdnra`, `impg`, `impgsez`, `isd`), or its Excel workbook (the B2B, B2BA, B2B-CDNR, B2B-CDNRA and
        IMPG sheets). Stored as a download is, keeping decisions already made, then matched. At most 6 MB
        decoded. 422 `GSTR2B_WRONG_GSTIN` or `GSTR2B_WRONG_PERIOD` when a JSON file is another
        registration's or month's; 422 `UNSUPPORTED_FILE` when it isn't a 2B file.
      x-roles: [owner, admin, accountant]
      x-plan-module: purchases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gstin, period, fileName, contentBase64]
              properties:
                gstin: { type: string }
                period: { type: string, pattern: '^(0[1-9]|1[0-2])[0-9]{4}$' }
                fileName: { type: string, maxLength: 200 }
                contentBase64: { type: string, description: 'The file, base64 encoded' }
      responses:
        '200':
          description: Imported and matched
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gstr2bReconciliation' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /companies/{companyId}/gst/gstr2b/claim:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    post:
      tags: [GST]
      operationId: claimGstr2b
      summary: Claims the period's credit on every matched bill (GSTR-3B reads it from there)
      x-roles: [owner, admin, accountant]
      x-plan-module: purchases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gstin, period]
              properties:
                gstin: { type: string }
                period: { type: string, pattern: '^(0[1-9]|1[0-2])[0-9]{4}$' }
      responses:
        '200':
          description: Claimed
          content:
            application/json:
              schema: { type: object, properties: { claimed: { type: integer } } }
  /companies/{companyId}/gst/gstr2b/lines/{id}/decision:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    put:
      tags: [GST]
      operationId: decideGstr2bLine
      summary: A person's call on one line of 2B
      x-roles: [owner, admin, accountant]
      x-plan-module: purchases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [accepted, notOurs, claimLater, undecided] }
                documentId: { type: string, description: 'With accepted: the bill this line is, when the matcher did not find it' }
      responses:
        '204': { description: Recorded }

  /companies/{companyId}/gst/gstr3b:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [GST]
      operationId: getGstr3b
      summary: A period's GSTR-3B worked out from the books, with the tax set off from credit and cash
      x-roles: [owner, admin, accountant]
      parameters:
        - { name: gstin, in: query, required: true, schema: { type: string } }
        - { name: period, in: query, required: true, schema: { type: string, pattern: '^(0[1-9]|1[0-2])[0-9]{4}$' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gstr3bView' }
  /companies/{companyId}/gst/utilization:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [GST]
      operationId: getGstUtilization
      summary: A period's GST set-off (utilization) to record, worked out from its GSTR-3B data, with the GST cash ledger
      x-roles: [owner, admin, accountant]
      parameters:
        - { name: gstin, in: query, required: true, schema: { type: string } }
        - { name: period, in: query, required: true, schema: { type: string, pattern: '^(0[1-9]|1[0-2])[0-9]{4}$' } }
        - { name: date, in: query, description: The set-off date the cash ledger is read on (default today), schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GstUtilizationView' }
    post:
      tags: [GST]
      operationId: postGstUtilization
      summary: Posts the set-off as one GST journal
      description: >-
        Dr Output / Cr Input for credit used; Dr Output, Reverse charge payable, Interest on GST and
        Late fee / Cr GST cash ledger for cash. Checked against the period's GSTR-3B: rule 88A order,
        CGST never for SGST, reverse charge, interest and late fee in cash only, every head paid in full
        (422 with the issues). 422 CASH_LEDGER_SHORT when the cash ledger holds too little: record a
        GST challan first. 409 SET_OFF_EXISTS when the period already has one. Refused in a closed period.
      x-roles: [owner, admin, accountant]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gstin, period, date, setOff]
              properties:
                gstin: { type: string }
                period: { type: string, pattern: '^(0[1-9]|1[0-2])[0-9]{4}$' }
                date: { type: string, format: date }
                narration: { type: string }
                setOff: { $ref: '#/components/schemas/GstSetOff' }
      responses:
        '201':
          description: Posted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Voucher' }
  /companies/{companyId}/gst/returns/{returnType}/save:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { name: returnType, in: path, required: true, schema: { type: string, enum: [gstr1, gstr3b] } }
    post:
      tags: [GST]
      operationId: saveGstReturn
      summary: Saves the period’s return to the GST portal (again, if it changed)
      description: >-
        GSTR-1 from the period’s sales; GSTR-3B from the books, with the set-off. Saving replaces
        what was saved before. 409 RETURN_FILED once filed.
      x-roles: [owner, admin, accountant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gstin, period]
              properties:
                gstin: { type: string }
                period: { type: string, pattern: '^(0[1-9]|1[0-2])[0-9]{4}$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GstReturn' }
  /companies/{companyId}/gst/returns/{returnType}/offset:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { name: returnType, in: path, required: true, schema: { type: string, enum: [gstr1, gstr3b] } }
    post:
      tags: [GST]
      operationId: offsetGstReturn
      summary: 'GSTR-3B: sets off the liability from credit and cash, as the saved return says'
      x-roles: [owner, admin, accountant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gstin, period]
              properties:
                gstin: { type: string }
                period: { type: string, pattern: '^(0[1-9]|1[0-2])[0-9]{4}$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GstReturn' }
  /companies/{companyId}/gst/returns/{returnType}/proceed:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { name: returnType, in: path, required: true, schema: { type: string, enum: [gstr1, gstr3b] } }
    post:
      tags: [GST]
      operationId: proceedGstReturn
      summary: 'GSTR-1: freezes the saved data for filing'
      x-roles: [owner, admin, accountant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gstin, period]
              properties:
                gstin: { type: string }
                period: { type: string, pattern: '^(0[1-9]|1[0-2])[0-9]{4}$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GstReturn' }
  /companies/{companyId}/gst/returns/{returnType}/evc:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { name: returnType, in: path, required: true, schema: { type: string, enum: [gstr1, gstr3b] } }
    post:
      tags: [GST]
      operationId: requestGstReturnEvc
      summary: Sends the EVC OTP to the authorised signatory’s phone
      x-roles: [owner, admin, accountant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gstin, period]
              properties:
                gstin: { type: string }
                period: { type: string, pattern: '^(0[1-9]|1[0-2])[0-9]{4}$' }
                pan: { type: string, description: 'The authorised signatory’s PAN; defaults to the one in the GSTIN' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GstReturn' }
  /companies/{companyId}/gst/returns/{returnType}/file:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { name: returnType, in: path, required: true, schema: { type: string, enum: [gstr1, gstr3b] } }
    post:
      tags: [GST]
      operationId: fileGstReturn
      summary: Files the return with the EVC OTP. Cannot be undone.
      description: >-
        503 FILING_DISABLED until GST_FILING_ENABLED is on. GSTR-3B needs the period’s GSTR-1 filed
        first. The portal is asked first whether it is already filed, so a return is never filed twice;
        an answer lost on the way is settled by the portal’s tracker. Filing GSTR-3B closes the books
        through the period and posts the set-off as a GST journal.
      x-roles: [owner, admin, accountant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gstin, period, otp]
              properties:
                gstin: { type: string }
                period: { type: string, pattern: '^(0[1-9]|1[0-2])[0-9]{4}$' }
                pan: { type: string }
                otp: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GstReturn' }

  /companies/{companyId}/gst/gstr1:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [GST]
      operationId: getGstr1
      summary: GSTR-1 tables (B2B, B2CL, B2CS, EXP, CDNR, CDNUR) plus the HSN summary for a return period
      parameters:
        - { name: period, in: query, required: true, description: MMYYYY, schema: { type: string, pattern: '^(0[1-9]|1[0-2])[0-9]{4}$', example: '092026' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gstr1Summary' }
  /companies/{companyId}/gst/gstr1/export:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [GST]
      operationId: exportGstr1
      summary: The GSTR-1 JSON the GST portal's offline tool accepts, or a CSV or Excel workbook
      parameters:
        - { name: period, in: query, required: true, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [gstn-json, csv, xlsx], default: gstn-json } }
        - { name: gstin, in: query, description: "The registration whose return the JSON is (a branch's own GSTIN); the company's when left out", schema: { type: string, pattern: '^[0-9]{2}[0-9A-Z]{13}$' } }
      responses:
        '200':
          description: File
          content:
            application/json: { schema: { type: object } }
            text/csv: { schema: { type: string } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }

  # ------------------------------------------------------------------ Dashboard / search
  /companies/{companyId}/dashboard:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Everything the home tab shows, in one call
      parameters:
        - { $ref: '#/components/parameters/BranchIdQuery' }
        - { name: range, in: query, schema: { type: string, enum: [today, week, month, quarter, year], default: month } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
  /companies/{companyId}/hubs/sales:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Dashboard]
      operationId: getSalesHub
      summary: Everything the Sales tab shows, in one call
      description: |
        The period's invoicing and collections (this month unless `range` says otherwise, with the
        period before when `compare=previous`), its sales trend, what customers owe (as the receivables
        aging works it out), how many of each sales document there are, the top five customers by value
        invoiced in the period, and the six latest invoices. Fields named `…ThisMonth` hold the period's
        figure. Amounts are in base currency; drafts and cancelled invoices count
        towards nothing but the document counts.
      parameters:
        - { $ref: '#/components/parameters/BranchIdQuery' }
        - { $ref: '#/components/parameters/DashboardRange' }
        - { $ref: '#/components/parameters/DashboardFrom' }
        - { $ref: '#/components/parameters/DashboardTo' }
        - { $ref: '#/components/parameters/DashboardCompare' }
        - { $ref: '#/components/parameters/DashboardGrain' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [period, invoicedThisMonth, invoicesThisMonth, collectedThisMonth, outstanding, overdue, counts, paymentsReceived, eInvoicesGenerated, topCustomers, salesTrend, recentInvoices]
                properties:
                  period: { $ref: '#/components/schemas/DashboardPeriod' }
                  invoicedThisMonth: { $ref: '#/components/schemas/Money', description: 'In the period (named for the default, this month)' }
                  invoicesThisMonth: { type: integer, description: Invoices issued in the period }
                  collectedThisMonth: { $ref: '#/components/schemas/Money', description: Received in the period }
                  previous:
                    type: object
                    description: The same figures for the period before, with `compare=previous`
                    required: [invoiced, invoices, collected]
                    properties:
                      invoiced: { $ref: '#/components/schemas/Money' }
                      invoices: { type: integer }
                      collected: { $ref: '#/components/schemas/Money' }
                  salesTrend: { type: array, items: { $ref: '#/components/schemas/MonthValue' } }
                  outstanding:
                    type: object
                    required: [amount, count]
                    properties: { amount: { $ref: '#/components/schemas/Money' }, count: { type: integer, description: Open invoices and debit notes } }
                  overdue:
                    type: object
                    required: [amount, count]
                    properties: { amount: { $ref: '#/components/schemas/Money' }, count: { type: integer } }
                  counts:
                    type: object
                    description: Documents of each sales kind, in every status
                    additionalProperties: { type: integer }
                  paymentsReceived: { type: integer }
                  eInvoicesGenerated: { type: integer }
                  topCustomers: { type: array, description: The five who were invoiced most in the period, items: { $ref: '#/components/schemas/PartyTotal' } }
                  recentInvoices: { type: array, items: { $ref: '#/components/schemas/DocumentSummary' } }
  /companies/{companyId}/hubs/purchases:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Dashboard]
      operationId: getPurchasesHub
      x-plan-module: purchases
      summary: Everything the Purchases tab shows, in one call
      description: |
        The period's bills and expenses (this month unless `range` says otherwise, with the period
        before when `compare=previous`), what the business owes suppliers (as the payables aging works
        it out), how many of each purchase document there are, the period's expenses by category with
        the Expenses tab's figures, and the six latest bills. Fields named `…ThisMonth` hold the
        period's figure. Amounts are in base currency. The expense figures are left
        out on a plan without expenses.
      parameters:
        - { $ref: '#/components/parameters/BranchIdQuery' }
        - { $ref: '#/components/parameters/DashboardRange' }
        - { $ref: '#/components/parameters/DashboardFrom' }
        - { $ref: '#/components/parameters/DashboardTo' }
        - { $ref: '#/components/parameters/DashboardCompare' }
        - { $ref: '#/components/parameters/DashboardGrain' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [period, billedThisMonth, payable, overdue, counts, paymentsMade, recentBills]
                properties:
                  period: { $ref: '#/components/schemas/DashboardPeriod' }
                  billedThisMonth: { $ref: '#/components/schemas/Money', description: 'In the period (named for the default, this month)' }
                  expensesThisMonth: { $ref: '#/components/schemas/Money', description: In the period }
                  previous:
                    type: object
                    description: The same figures for the period before, with `compare=previous`
                    required: [billed]
                    properties:
                      billed: { $ref: '#/components/schemas/Money' }
                      expenses: { $ref: '#/components/schemas/Money' }
                  expenseInsights:
                    type: object
                    description: The Expenses tab, for the period. Left out on a plan without expenses.
                    required: [count, tax, itcEligibleTax, billable, trend, topSuppliers, upcomingRecurring]
                    properties:
                      count: { type: integer }
                      tax: { $ref: '#/components/schemas/Money', description: GST on the period's expenses }
                      itcEligibleTax: { $ref: '#/components/schemas/Money', description: The part of that tax the business can claim as credit }
                      billable: { $ref: '#/components/schemas/Money', description: Spent on customers' behalf, to be recovered on an invoice }
                      trend: { type: array, items: { $ref: '#/components/schemas/MonthValue' } }
                      topSuppliers: { type: array, description: The five paid most, items: { $ref: '#/components/schemas/PartyTotal' } }
                      upcomingRecurring:
                        type: array
                        description: Recurring expenses due in the next 30 days, soonest first
                        items:
                          type: object
                          required: [id, nextDate, amount, category, recurrence]
                          properties:
                            id: { type: string }
                            nextDate: { type: string, format: date }
                            amount: { $ref: '#/components/schemas/Money' }
                            category: { type: string }
                            description: { type: string }
                            recurrence: { type: string, enum: [weekly, monthly, quarterly, yearly] }
                  payable:
                    type: object
                    required: [amount, count]
                    properties: { amount: { $ref: '#/components/schemas/Money' }, count: { type: integer, description: Open bills and supplier debit notes } }
                  overdue:
                    type: object
                    required: [amount, count]
                    properties: { amount: { $ref: '#/components/schemas/Money' }, count: { type: integer } }
                  counts:
                    type: object
                    description: Documents of each purchase kind, in every status
                    additionalProperties: { type: integer }
                  expenses: { type: integer }
                  paymentsMade: { type: integer }
                  expensesByCategory:
                    type: array
                    description: In the period, largest first
                    items:
                      type: object
                      required: [categoryId, name, total]
                      properties: { categoryId: { type: string }, name: { type: string }, total: { $ref: '#/components/schemas/Money' } }
                  recentBills: { type: array, items: { $ref: '#/components/schemas/DocumentSummary' } }
  /companies/{companyId}/hubs/home:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Dashboard]
      operationId: getHomeHub
      summary: Everything the Home tab shows, in one call
      description: |
        The period's sales, collections, expenses and profit (this month unless `range` says
        otherwise, with the period before when `compare=previous`), the sales trend and cash in and out
        at the chosen grain, invoices by status, cash and bank balances, stock health, the latest money
        in and out, receivables (with the four most overdue invoices) and payables as the aging works
        them out, counts that need attention, and the five latest invoices. Fields named `…ThisMonth`
        hold the period's figure; profit is the profit report's. Amounts are in base currency. Expense, payable and
        stock figures are left out on a plan without them.
      parameters:
        - { $ref: '#/components/parameters/BranchIdQuery' }
        - { $ref: '#/components/parameters/DashboardRange' }
        - { $ref: '#/components/parameters/DashboardFrom' }
        - { $ref: '#/components/parameters/DashboardTo' }
        - { $ref: '#/components/parameters/DashboardCompare' }
        - { $ref: '#/components/parameters/DashboardGrain' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [period, salesThisMonth, invoicesThisMonth, collectedThisMonth, salesTrend, cashFlow, invoiceStatus, cash, moneyMovement, receivable, overdueInvoices, draftInvoices, openQuotes, recentInvoices, firstRun]
                properties:
                  period: { $ref: '#/components/schemas/DashboardPeriod' }
                  salesThisMonth: { $ref: '#/components/schemas/Money', description: 'In the period (named for the default, this month)' }
                  invoicesThisMonth: { type: integer }
                  collectedThisMonth: { $ref: '#/components/schemas/Money' }
                  expensesThisMonth: { $ref: '#/components/schemas/Money' }
                  expenseEntriesThisMonth: { type: integer }
                  profit: { $ref: '#/components/schemas/Money', description: 'Net profit as the profit report gives it for the same period and branch. Left out on a plan without expenses.' }
                  previous:
                    type: object
                    description: The same figures for the period before, with `compare=previous`
                    required: [sales, invoices, collected]
                    properties:
                      sales: { $ref: '#/components/schemas/Money' }
                      invoices: { type: integer }
                      collected: { $ref: '#/components/schemas/Money' }
                      expenses: { $ref: '#/components/schemas/Money' }
                      profit: { $ref: '#/components/schemas/Money' }
                  cashFlow: { type: array, description: 'Money into and out of cash and bank per trend bucket: receipts, payments, expenses and vouchers; transfers between own accounts left out', items: { $ref: '#/components/schemas/CashFlowPoint' } }
                  invoiceStatus: { type: array, description: "The period's invoices by the status they're in today", items: { $ref: '#/components/schemas/StatusCount' } }
                  cash:
                    type: object
                    description: What each cash and bank account holds now. The accounts are the company's, whichever branch is chosen.
                    required: [total, accounts]
                    properties:
                      total: { $ref: '#/components/schemas/Money' }
                      accounts:
                        type: array
                        items:
                          type: object
                          required: [id, name, type, balance]
                          properties:
                            id: { type: string }
                            name: { type: string }
                            type: { type: string }
                            balance: { $ref: '#/components/schemas/Money' }
                  inventory:
                    type: object
                    description: Stock health now. Left out on a plan without inventory.
                    required: [value, tracked, low, out, dead]
                    properties:
                      value: { $ref: '#/components/schemas/Money', description: At weighted-average cost }
                      tracked: { type: integer }
                      low: { type: integer, description: 'At or below the reorder level, not yet out' }
                      out: { type: integer }
                      dead: { type: integer, description: 'In stock, nothing taken out in 90 days' }
                      deadValue: { $ref: '#/components/schemas/Money' }
                  moneyMovement: { type: array, description: "The period's latest ten receipts, payments and expenses, newest first", items: { $ref: '#/components/schemas/MoneyMovement' } }
                  salesTrend: { type: array, items: { $ref: '#/components/schemas/MonthValue' } }
                  receivable:
                    type: object
                    required: [total, overdue, dueSoon, overdueCount, buckets]
                    properties:
                      total: { $ref: '#/components/schemas/Money' }
                      overdue: { $ref: '#/components/schemas/Money' }
                      dueSoon: { $ref: '#/components/schemas/Money', description: Due within the next seven days }
                      overdueCount: { type: integer }
                      buckets:
                        type: array
                        items:
                          type: object
                          required: [key, amount, count]
                          properties:
                            key: { type: string, enum: [current, d1_30, d31_60, d61_90, d90plus] }
                            amount: { $ref: '#/components/schemas/Money' }
                            count: { type: integer }
                  overdueInvoices:
                    type: array
                    description: The four most overdue
                    items:
                      type: object
                      required: [document, daysOverdue]
                      properties: { document: { $ref: '#/components/schemas/DocumentSummary' }, daysOverdue: { type: integer } }
                  payable:
                    type: object
                    required: [total, overdue, count]
                    properties: { total: { $ref: '#/components/schemas/Money' }, overdue: { $ref: '#/components/schemas/Money' }, count: { type: integer } }
                  lowStockCount: { type: integer }
                  draftInvoices: { type: integer }
                  openQuotes: { type: integer, description: Quotes sent and not yet answered }
                  recentInvoices: { type: array, items: { $ref: '#/components/schemas/DocumentSummary' } }
                  firstRun: { type: boolean, description: 'No invoices, payments or expenses yet' }
  /companies/{companyId}/hubs/accounts:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Dashboard]
      operationId: getAccountsHub
      x-plan-module: books
      summary: Everything the Accounts & P&L tab shows, in one call
      description: |
        The period's profit (as the profit report gives it), cash in and out of cash and bank by kind,
        the GST position, and, for a user who sees every branch, the balance sheet at the period's end
        and the accounts that moved most. The books cover every branch, so a user limited to some gets
        `books: false` and no balance sheet or account movement.
      parameters:
        - { $ref: '#/components/parameters/BranchIdQuery' }
        - { $ref: '#/components/parameters/DashboardRange' }
        - { $ref: '#/components/parameters/DashboardFrom' }
        - { $ref: '#/components/parameters/DashboardTo' }
        - { $ref: '#/components/parameters/DashboardCompare' }
        - { $ref: '#/components/parameters/DashboardGrain' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [period, profit, profitTrend, cash, tax, books]
                properties:
                  period: { $ref: '#/components/schemas/DashboardPeriod' }
                  profit: { $ref: '#/components/schemas/ProfitFigures' }
                  previousProfit: { $ref: '#/components/schemas/ProfitFigures' }
                  profitTrend: { type: array, description: Net profit per trend bucket, items: { $ref: '#/components/schemas/MonthValue' } }
                  cash:
                    type: object
                    description: Direct-method cash movement. Opening and closing only without a branch, as the accounts are the company's.
                    required: [inflow, outflow, net, receipts, payments, expenses, tax, other]
                    properties:
                      opening: { $ref: '#/components/schemas/Money' }
                      inflow: { $ref: '#/components/schemas/Money' }
                      outflow: { $ref: '#/components/schemas/Money' }
                      net: { $ref: '#/components/schemas/Money' }
                      closing: { $ref: '#/components/schemas/Money' }
                      receipts: { $ref: '#/components/schemas/Money', description: From customers and receipt vouchers }
                      payments: { $ref: '#/components/schemas/Money', description: To suppliers and others (negative) }
                      expenses: { $ref: '#/components/schemas/Money', description: Negative }
                      tax: { $ref: '#/components/schemas/Money', description: TDS challans and GST payments (negative) }
                      other: { $ref: '#/components/schemas/Money', description: Other vouchers }
                  tax:
                    type: object
                    description: As the tax summary report gives it for the period
                    required: [output, input, netPayable]
                    properties:
                      output: { $ref: '#/components/schemas/Money', description: GST on sales }
                      input: { $ref: '#/components/schemas/Money', description: GST on purchases and expenses }
                      netPayable: { $ref: '#/components/schemas/Money' }
                  books: { type: boolean, description: Whether the user sees the books (every branch) }
                  balanceSheet:
                    type: object
                    required: [asOf, assets, liabilities, totalAssets, totalLiabilities, currentProfit]
                    properties:
                      asOf: { type: string, format: date }
                      assets: { type: array, items: { type: object, required: [heading, total], properties: { heading: { type: string }, total: { $ref: '#/components/schemas/Money' } } } }
                      liabilities: { type: array, items: { type: object, required: [heading, total], properties: { heading: { type: string }, total: { $ref: '#/components/schemas/Money' } } } }
                      totalAssets: { $ref: '#/components/schemas/Money' }
                      totalLiabilities: { $ref: '#/components/schemas/Money' }
                      currentProfit: { $ref: '#/components/schemas/Money', description: The year's profit so far, as the books give it }
                  accountMovement:
                    type: array
                    description: The eight accounts with the most debits and credits in the period
                    items:
                      type: object
                      required: [account, name, group, opening, debit, credit, closing]
                      properties:
                        account: { type: string }
                        name: { type: string }
                        group: { type: string }
                        opening: { $ref: '#/components/schemas/Money' }
                        debit: { $ref: '#/components/schemas/Money' }
                        credit: { $ref: '#/components/schemas/Money' }
                        closing: { $ref: '#/components/schemas/Money' }
  /companies/{companyId}/hubs/compliance:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Dashboard]
      operationId: getComplianceHub
      summary: What's due to the tax department, and where the credit stands
      description: |
        Returns and deposits due in the 45 days behind and 60 ahead (GSTR-1 or IFF and GSTR-3B or
        PMT-06 for each GSTIN, by its filing frequency, and the TDS deposit for a business with a TAN),
        with whether each was filed as recorded here; the last month's GSTR-2B against the purchase
        register (on a plan with purchases); and the TDS still to deposit (for a user who sees the books).
        Informational: it files nothing.
      parameters:
        - { $ref: '#/components/parameters/BranchIdQuery' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [calendar]
                properties:
                  calendar: { type: array, items: { $ref: '#/components/schemas/FilingDue' } }
                  itc:
                    type: object
                    description: The latest period fetched in the last three months, or last month's when none is
                    required: [gstin, period, fetched]
                    properties:
                      gstin: { type: string }
                      period: { type: string, description: MMYYYY }
                      fetched: { type: boolean }
                      lines: { type: integer }
                      matched: { type: integer, description: 'Matched exactly, within tolerance or by hand, or claimed' }
                      mismatched: { type: integer, description: Partly matched or only probably }
                      missingInBooks: { type: integer, description: On 2B with no bill recorded }
                      missingIn2b: { type: integer, description: Bills the suppliers haven't reported }
                      missingIn2bTax: { $ref: '#/components/schemas/Money', description: Tax on those bills, not yet claimable }
                      claimableTax: { $ref: '#/components/schemas/Money' }
                  tdsDue:
                    type: object
                    required: [total, overdue, rows]
                    properties:
                      total: { $ref: '#/components/schemas/Money' }
                      overdue: { $ref: '#/components/schemas/Money' }
                      rows:
                        type: array
                        items:
                          type: object
                          required: [section, month, balance, dueDate, overdue]
                          properties:
                            section: { type: string }
                            month: { type: string, description: yyyy-mm deducted }
                            balance: { $ref: '#/components/schemas/Money' }
                            dueDate: { type: string, format: date }
                            overdue: { type: boolean }
  /companies/{companyId}/search:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Search]
      operationId: search
      summary: Search across parties, items (name, SKU, barcode, HSN), documents and payments
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
        - { name: limit, in: query, schema: { type: integer, default: 5, maximum: 20 }, description: Per group }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  parties: { type: array, items: { $ref: '#/components/schemas/Party' } }
                  items: { type: array, items: { $ref: '#/components/schemas/ItemWithStock' } }
                  documents: { type: array, items: { $ref: '#/components/schemas/DocumentSummary' } }
                  payments: { type: array, items: { $ref: '#/components/schemas/Payment' } }

  # ------------------------------------------------------------------ Assistant
  /companies/{companyId}/lixi/messages:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    post:
      tags: [Assistant]
      operationId: lixiChat
      x-demo-allowed: true
      summary: Ask Lixi
      description: |
        Lixi answers from the company's books through the same routes the app
        uses, as the caller, so role and plan gating apply. It never writes: a
        request to draft, record or send comes back as `pendingAction`, which
        runs only through `lixiConfirmAction`. The same tools are served over
        MCP at `/companies/{companyId}/mcp` (outside this contract).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LixiChatRequest' }
      responses:
        '200':
          description: Lixi's answer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LixiChatResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502': { $ref: '#/components/responses/UpstreamError' }
  /companies/{companyId}/lixi/actions:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    post:
      tags: [Assistant]
      operationId: lixiConfirmAction
      summary: Confirm an action Lixi prepared
      description: |
        Runs a `pendingAction` as the caller. The token is bound to the user,
        session and company and expires after five minutes (`410
        LIXI_ACTION_EXPIRED`). Role and plan are checked again now; the inner
        route's error comes back unchanged. Confirming twice runs once.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 1, maxLength: 20000 }
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LixiConfirmResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410':
          description: The action expired
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ------------------------------------------------------------------ Notifications
  /companies/{companyId}/notifications:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Notifications]
      operationId: listNotifications
      parameters:
        - { name: unread, in: query, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/AppNotification' } }
                      unreadCount: { type: integer }
    delete:
      tags: [Notifications]
      operationId: clearNotifications
      responses:
        '204': { description: Cleared for this user }
  /companies/{companyId}/notifications/{id}/read:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      responses:
        '204': { description: Marked }
  /companies/{companyId}/notifications/read-all:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    post:
      tags: [Notifications]
      operationId: markAllNotificationsRead
      responses:
        '204': { description: Marked }

  # ------------------------------------------------------------------ Audit
  /companies/{companyId}/audit-events:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Audit]
      operationId: listAuditEvents
      summary: Append-only audit trail. The server writes it on every mutation, and clients cannot write to it.
      x-roles: [owner, admin, accountant]
      parameters:
        - { name: entityType, in: query, schema: { type: string } }
        - { name: entityId, in: query, schema: { type: string } }
        - { name: actorId, in: query, schema: { type: string } }
        - { name: q, in: query, description: "Action, record or who did it", schema: { type: string } }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }

  # ------------------------------------------------------------------ Integrations
  /companies/{companyId}/integrations:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Integrations]
      operationId: listIntegrations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Integration' } }
  /companies/{companyId}/integrations/{integrationId}/connect:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { name: integrationId, in: path, required: true, schema: { type: string, enum: [int_razorpay, int_upi, int_einvoice, int_eway, int_whatsapp, int_sms, int_tally, int_drive] } }
    post:
      tags: [Integrations]
      operationId: connectIntegration
      summary: Connect an integration. OAuth providers (Google Drive, Razorpay) return an `authorizeUrl`.
      x-roles: [owner, admin]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                config:
                  type: object
                  description: 'Provider-specific. Examples: UPI `{ vpa, payeeName }`, WhatsApp `{ phoneNumberId }`, SMS `{ senderId }`.'
                  additionalProperties: true
      responses:
        '200':
          description: Connected, or an OAuth redirect is needed
          content:
            application/json:
              schema:
                type: object
                properties:
                  integration: { $ref: '#/components/schemas/Integration' }
                  authorizeUrl: { type: string, format: uri }
  /companies/{companyId}/integrations/{integrationId}/disconnect:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { name: integrationId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Integrations]
      operationId: disconnectIntegration
      x-roles: [owner, admin]
      responses:
        '200':
          description: Disconnected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integration' }

  # ------------------------------------------------------------------ Exports / backup
  /companies/{companyId}/exports:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    post:
      tags: [Exports]
      operationId: createExport
      x-demo-allowed: true
      summary: Export the whole company (backup), or Tally vouchers, as a background job. Also allowed while the business is archived.
      x-roles: [owner, admin]
      x-archived-allowed: true
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format]
              properties:
                format: { type: string, enum: [json-backup, csv-zip, tally-xml] }
                from: { type: string, format: date }
                to: { type: string, format: date }
                includeAttachments: { type: boolean, default: false }
      responses:
        '202':
          description: Job queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportJob' }
    get:
      tags: [Exports]
      operationId: listExports
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ExportJob' } }
  /companies/{companyId}/exports/{id}:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Exports]
      operationId: getExport
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportJob' }
  /companies/{companyId}/backup-settings:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Exports]
      operationId: getBackupSettings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupSettings' }
    put:
      tags: [Exports]
      operationId: saveBackupSettings
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackupSettings' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupSettings' }

  # ------------------------------------------------------------------ Sync (offline-first)
  /sync/push:
    post:
      tags: [Sync]
      operationId: syncPush
      summary: Replay the offline queue in order
      description: |
        Each mutation carries the endpoint it stands for, plus the `baseVersion` the
        client edited. The server applies them in order and reports each result.
        A stale `baseVersion` returns `conflict` with the server copy, so the
        client can show it in Settings → Sync and retry or discard. Numbers and
        totals are always assigned by the server here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mutations]
              properties:
                mutations:
                  type: array
                  maxItems: 200
                  items: { $ref: '#/components/schemas/SyncMutation' }
      responses:
        '200':
          description: Per-mutation results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        status: { type: string, enum: [applied, conflict, rejected, retry], description: 'retry: not an outcome (a passing server error, rate limit or expired token), send the same entry again' }
                        entity: { type: object, description: 'Server copy after the mutation, or at conflict' }
                        error: { $ref: '#/components/schemas/Problem' }
  /sync/pull:
    get:
      tags: [Sync]
      operationId: syncPull
      summary: Changes since a cursor, for every company the user can reach
      parameters:
        - { name: since, in: query, description: Cursor from the previous pull; omit for a full snapshot, schema: { type: string } }
        - { name: companyId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 500, maximum: 2000 } }
        - name: entityTypes
          in: query
          description: "Snapshot only: these entity types in full (e.g. the setup a device needs to work). With neither this nor `changedSince`, every type is sent in full; changes after a cursor always cover every type."
          style: form
          explode: false
          schema: { type: array, items: { type: string } }
        - { name: changedSince, in: query, description: "Snapshot only: other entity types too, but only those whose latest change is at or after this", schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  changes:
                    type: array
                    items:
                      type: object
                      properties:
                        companyId: { type: string, description: 'The company the change belongs to. The same entity id can change in more than one company (an integration, a user).' }
                        entityType: { type: string, example: document }
                        entityId: { type: string }
                        op: { type: string, enum: [upsert, delete] }
                        version: { type: integer }
                        data: { type: object }
                  cursor: { type: string }
                  hasMore: { type: boolean }

  # ------------------------------------------------------------------ Reference data
  /reference/countries:
    get:
      tags: [Reference]
      operationId: listCountries
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, example: IN }
                        name: { type: string }
                        currency: { type: string }
                        taxRegime: { type: string, enum: [GST, VAT, NONE] }
                        taxIdLabel: { type: string, example: GSTIN }
  /reference/states:
    get:
      tags: [Reference]
      operationId: listStates
      security: []
      parameters:
        - { name: country, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK, with GST state codes for India
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, example: '27' }
                        name: { type: string, example: Maharashtra }
  /reference/cities:
    get:
      tags: [Reference]
      operationId: searchCities
      security: []
      summary: City search for `CityField` (the prototype bundles `src/data/cities.ts`)
      parameters:
        - { name: country, in: query, schema: { type: string, default: IN } }
        - { name: state, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        state: { type: string }
                        stateCode: { type: string }
  /reference/pincodes/{pincode}:
    get:
      tags: [Reference]
      operationId: lookupPincode
      security: []
      parameters:
        - { name: pincode, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]{5}$' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  pincode: { type: string }
                  city: { type: string }
                  state: { type: string }
                  stateCode: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/FeatureUnavailable' }
  /reference/distance:
    get:
      tags: [Reference]
      operationId: getRoadDistance
      summary: Approximate road distance between PIN codes, used for e-way bill validity
      parameters:
        - { name: fromPincode, in: query, required: true, schema: { type: string } }
        - { name: toPincode, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  distanceKm: { type: integer }
                  source: { type: string, enum: [ewb-portal, maps] }
        '503': { $ref: '#/components/responses/FeatureUnavailable' }
  /reference/currencies:
    get:
      tags: [Reference]
      operationId: listCurrencies
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string }
                        name: { type: string }
                        symbol: { type: string }
                        precision: { type: integer }
  /reference/hsn:
    get:
      tags: [Reference]
      operationId: searchHsn
      summary: HSN/SAC code search with the suggested GST rate
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string }
                        description: { type: string }
                        kind: { type: string, enum: [HSN, SAC] }
                        gstRate: { type: number }
  /reference/gstin/{gstin}:
    get:
      tags: [Reference]
      operationId: lookupGstin
      summary: Verify a GSTIN on the GST portal and fetch its legal name, address and status, to autofill a party or company
      parameters:
        - { name: gstin, in: path, required: true, schema: { type: string, pattern: '^[0-9]{2}[A-Z0-9]{13}$' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  gstin: { type: string }
                  legalName: { type: string }
                  tradeName: { type: string }
                  status: { type: string, enum: [Active, Cancelled, Suspended, Inactive] }
                  registrationType: { $ref: '#/components/schemas/GstRegistrationType' }
                  address: { $ref: '#/components/schemas/Address' }
                  registeredOn: { type: string, format: date }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: Check digit invalid }
        '502': { $ref: '#/components/responses/UpstreamError' }
        '503': { $ref: '#/components/responses/FeatureUnavailable' }

  # ------------------------------------------------------------------ Platform (operators)
  # Cross-tenant routes for platform operators (`users.platform_role`).
  # `x-platform-roles` replaces `x-roles` here: tenant roles never apply, and a
  # caller without a platform role gets 403 PLATFORM_FORBIDDEN.
  # Operators prove a second factor (an authenticator app) once per session. Every other
  # /admin route answers 403 MFA_ENROLLMENT_REQUIRED or MFA_REQUIRED until they have;
  # `x-mfa-exempt` marks the four routes that get them there.
  /admin/mfa:
    get:
      tags: [Platform]
      operationId: getMfaStatus
      summary: Whether the operator has an authenticator set up, and whether this session has passed it
      x-platform-roles: [superadmin, support]
      x-mfa-exempt: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/mfa/enrollment:
    post:
      tags: [Platform]
      operationId: startMfaEnrollment
      summary: A new authenticator secret to scan. Replaces one not yet confirmed; refused once set up (reset from the command line).
      x-platform-roles: [superadmin, support]
      x-mfa-exempt: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaEnrollment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/mfa/enrollment/confirm:
    post:
      tags: [Platform]
      operationId: confirmMfaEnrollment
      summary: Turns the authenticator on with a code from it, verifies this session, and returns the recovery codes. They are shown this once.
      x-platform-roles: [superadmin, support]
      x-mfa-exempt: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaCode' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaRecoveryCodes' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /admin/mfa/verify:
    post:
      tags: [Platform]
      operationId: verifyMfa
      summary: Passes this session with a code from the authenticator, or one unused recovery code
      x-platform-roles: [superadmin, support]
      x-mfa-exempt: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaCode' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /admin/metrics/overview:
    get:
      tags: [Platform]
      operationId: getPlatformOverview
      summary: Platform totals, plan mix, and daily signups and document volume for a date range (default the last 30 days)
      x-platform-roles: [superadmin, support]
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformOverview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/accounts:
    get:
      tags: [Platform]
      operationId: listPlatformAccounts
      summary: Every tenant account, newest first. `q` matches the account, company or owner name and the owner's email.
      x-platform-roles: [superadmin, support]
      parameters:
        - { $ref: '#/components/parameters/Q' }
        - { name: status, in: query, schema: { type: string, enum: [active, suspended] } }
        - { name: plan, in: query, description: Accounts with at least one company on this plan, schema: { $ref: '#/components/schemas/PlanTier' } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/PlatformAccount' } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/accounts/{accountId}:
    parameters: [{ name: accountId, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Platform]
      operationId: getPlatformAccount
      summary: One account with its companies and users
      x-platform-roles: [superadmin, support]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformAccountDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/accounts/{accountId}/suspend:
    parameters:
      - { name: accountId, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Platform]
      operationId: suspendAccount
      summary: Lock every user of the account out and sign them out everywhere. Sign-in and refresh fail with ACCOUNT_SUSPENDED until it is reactivated.
      x-platform-roles: [superadmin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformReason' }
      responses:
        '200':
          description: Suspended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformAccount' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /admin/accounts/{accountId}/reactivate:
    parameters:
      - { name: accountId, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Platform]
      operationId: reactivateAccount
      summary: Lift a suspension. Users sign in again; their old sessions stay revoked.
      x-platform-roles: [superadmin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformReason' }
      responses:
        '200':
          description: Reactivated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformAccount' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /admin/companies/{companyId}:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Platform]
      operationId: getPlatformCompany
      summary: One company with its subscription, plan history and document counts
      x-platform-roles: [superadmin, support]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformCompanyDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/companies/{companyId}/plan:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    put:
      tags: [Platform]
      operationId: overrideCompanyPlan
      summary: Set a company's plan by hand (comps, trials, support fixes). Recorded as an `adminOverride` subscription event. A provider-managed subscription may be changed back by its next billing webhook; the response warns when that applies.
      x-platform-roles: [superadmin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformPlanOverride' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [company, subscription]
                properties:
                  company: { $ref: '#/components/schemas/PlatformCompany' }
                  subscription: { $ref: '#/components/schemas/Subscription' }
                  warning: { type: [string, 'null'] }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /admin/users:
    get:
      tags: [Platform]
      operationId: listPlatformUsers
      summary: Users across every account, newest first. `q` matches name, email or phone.
      x-platform-roles: [superadmin, support]
      parameters:
        - { $ref: '#/components/parameters/Q' }
        - { name: status, in: query, schema: { type: string, enum: [active, invited, disabled] } }
        - { name: accountId, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/PlatformUser' } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/users/{userId}/disable:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Platform]
      operationId: disablePlatformUser
      summary: Disable a user and sign them out everywhere. Platform operators can't be disabled here.
      x-platform-roles: [superadmin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformReason' }
      responses:
        '200':
          description: Disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformUser' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /admin/users/{userId}/enable:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    post:
      tags: [Platform]
      operationId: enablePlatformUser
      summary: Re-enable a disabled user
      x-platform-roles: [superadmin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformReason' }
      responses:
        '200':
          description: Enabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformUser' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /admin/users/{userId}/platform-role:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
      - { $ref: '#/components/parameters/IdempotencyKey' }
    put:
      tags: [Platform]
      operationId: setPlatformUserRole
      summary: Make a user a platform superadmin or support operator, or remove their platform access
      description: >-
        Signs the user out everywhere, so their next session opens under the new role's rules (an authenticator, 12-hour sessions).
        `SELF`: you can't change your own role. `USER_DISABLED`: enable the user first. `LAST_SUPERADMIN`: there must always be one.
        `NO_CHANGE`: they already have that role.
      x-platform-roles: [superadmin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformRoleChange' }
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformUser' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /admin/audit-events:
    get:
      tags: [Platform]
      operationId: listPlatformAuditEvents
      summary: Every action platform operators have taken, newest first
      x-platform-roles: [superadmin, support]
      parameters:
        - { name: actorId, in: query, schema: { type: string } }
        - { name: targetType, in: query, schema: { type: string, enum: [account, company, user] } }
        - { name: targetId, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/PlatformAuditEvent' } }
        '403': { $ref: '#/components/responses/Forbidden' }

webhooks:
  razorpayEvent:
    post:
      operationId: razorpayWebhook
      summary: 'Inbound: Razorpay payment and subscription events (to POST /webhooks/razorpay)'
      description: |
        Verified with `X-Razorpay-Signature`. `payment_link.paid` records a
        `received` Payment allocated to the linked document. `subscription.charged`
        and `subscription.cancelled` update `Company.plan`.
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Acknowledged }
  whatsappStatus:
    post:
      operationId: whatsappWebhook
      summary: 'Inbound: WhatsApp Business delivery and read receipts (to POST /webhooks/whatsapp)'
      requestBody:
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Acknowledged }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token (15 min). Rotate it with `/auth/refresh`. The refresh token is bound to a DeviceSession.

  parameters:
    CompanyId: { name: companyId, in: path, required: true, schema: { type: string, example: cmp_vertex } }
    Id: { name: id, in: path, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: false, schema: { type: string, format: uuid } }
    AppVersion: { name: X-App-Version, in: header, required: false, description: The app's version (`web` from the web app); older than the server's minimum gets 426, schema: { type: string, example: 1.0.5 } }
    IfMatch: { name: If-Match, in: header, required: false, description: ETag from the last read, schema: { type: string } }
    Q: { name: q, in: query, description: Free-text search, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    From: { name: from, in: query, schema: { type: string, format: date } }
    To: { name: to, in: query, schema: { type: string, format: date } }
    BranchIdQuery: { name: branchId, in: query, schema: { type: string } }
    DashboardRange:
      name: range
      in: query
      description: The period, in India time. `year` is the company's financial year; `custom` takes `from` and `to`.
      schema: { type: string, enum: [today, week, month, quarter, year, custom], default: month }
    DashboardFrom: { name: from, in: query, description: 'First day, with `range=custom`', schema: { type: string, format: date } }
    DashboardTo: { name: to, in: query, description: 'Last day, with `range=custom`', schema: { type: string, format: date } }
    DashboardCompare:
      name: compare
      in: query
      description: '`previous` adds the same figures for the period just before, the same length'
      schema: { type: string, enum: [none, previous], default: none }
    DashboardGrain:
      name: grain
      in: query
      description: Trend bars by the day, Monday-week or month. A grain that would draw too many bars steps up; by the month a trend shows six months at least.
      schema: { type: string, enum: [day, week, month], default: month }

  headers:
    ETag: { schema: { type: string }, description: 'Weak ETag of `version`, e.g. W/"7"' }

  responses:
    AuthSession:
      description: Session issued
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthSession' }
    BadRequest:
      description: Malformed request
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unauthorized:
      description: Missing, expired or revoked token, or bad credentials
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: Role not allowed, company not reachable, or `PLAN_UPGRADE_REQUIRED`
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: Not found (also returned for another company's records)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: 'Business-rule conflict: IN_USE, INVALID_TRANSITION, DOCUMENT_LOCKED, DUPLICATE'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    PreconditionFailed:
      description: '`If-Match` is stale; re-read and retry'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unprocessable:
      description: Validation failed; see `issues[]`
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    UpdateRequired:
      description: '`APP_UPDATE_REQUIRED`: this app version is older than the server serves; the body carries `minVersion`'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    TooManyRequests:
      description: Rate limited; see `Retry-After`
      headers: { Retry-After: { schema: { type: integer } } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    UpstreamError:
      description: The IRP, EWB or GST portal rejected the request or was unreachable. The portal's code is in `issues[].code`.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    FeatureUnavailable:
      description: '`FEATURE_UNAVAILABLE`: this server has no provider for the feature yet (GSTIN_PROVIDER or OCR_PROVIDER=disabled). Fall back to manual entry.'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  schemas:
    # ---------------------------------------------------------------- primitives
    Money:
      type: object
      required: [minor, currency]
      properties:
        minor: { type: integer, format: int64, description: 'Integer minor units (paise, cents, fils)' }
        currency: { type: string, pattern: '^[A-Z]{3}$', example: INR }
      example: { minor: 1180000, currency: INR }
    Address:
      type: object
      required: [line1, city, state, postalCode, country]
      properties:
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        state: { type: string }
        stateCode: { type: string, description: 'GST state code, e.g. `27`' }
        postalCode: { type: string }
        country: { type: string, example: IN }
    Page:
      type: object
      properties:
        data: { type: array, items: {} }
        nextCursor: { type: [string, 'null'] }
    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string, example: PLAN_UPGRADE_REQUIRED }
        detail: { type: string }
        requiredPlan: { $ref: '#/components/schemas/PlanTier' }
        issues: { type: array, items: { $ref: '#/components/schemas/ComplianceIssue' } }
        traceId: { type: string }
    Versioned:
      type: object
      properties:
        version: { type: integer, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }

    # ---------------------------------------------------------------- auth & tenancy
    DeviceInfo:
      type: object
      properties:
        label: { type: string, example: Priya's iPhone }
        platform: { type: string, example: ios 19.0 }
        appVersion: { type: string }
    AuthSession:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, example: 900 }
        user: { $ref: '#/components/schemas/User' }
        onboardingComplete: { type: boolean }
    MeResponse:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        accountId: { type: string }
        onboardingComplete: { type: boolean }
        companies: { type: array, items: { $ref: '#/components/schemas/Company' } }
        defaultCompanyId: { type: string }
        platformRole:
          description: Set only for platform operators, who can use `/admin/*`
          oneOf: [{ $ref: '#/components/schemas/PlatformRole' }, { type: 'null' }]
        demo:
          type: boolean
          description: The public demo account. Everything reads; every write is refused with 403 DEMO_READ_ONLY.
        shareUsageData:
          type: boolean
          description: This person shares anonymous usage data; false means the apps send no analytics for them
    PlanTier: { type: string, enum: [free, basic, pro, business] }
    UserRole: { type: string, enum: [owner, admin, accountant, sales, viewer] }
    InviteDetails:
      type: object
      required: [email, name, role, inviterName, businesses, companyIds, existingUser, expiresAt]
      properties:
        email: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
        inviterName: { type: string }
        businesses: { type: array, items: { type: string } }
        companyIds: { type: array, items: { type: string } }
        existingUser: { type: boolean, description: 'They already have an account; accepting needs no new password' }
        expiresAt: { type: string, format: date-time }
    TaxRegistration:
      type: object
      required: [regime, identifierLabel, registered]
      properties:
        regime: { type: string, enum: [GST, VAT, NONE] }
        identifier: { type: string, description: GSTIN / VAT number }
        identifierLabel: { type: string, example: GSTIN }
        registered: { type: boolean }
        compositionScheme: { type: boolean }
        placeOfSupplyStateCode: { type: string }
        lutNumber: { type: string, description: 'Letter of Undertaking. While valid, exports and SEZ supplies are zero-rated instead of charged IGST.' }
        lutValidTill: { type: string, format: date, description: Last day the LUT covers; absent means open-ended }
        returnFrequency: { type: string, enum: [monthly, qrmp], description: 'Unset reads as monthly. How GSTR-1 and GSTR-3B are filed. QRMP: quarterly returns with monthly payment.' }
    BankDetails:
      type: object
      description: |
        The account customers pay into, printed on invoices; with `upiId`, a UPI QR for the amount
        due too. Sent whole: an empty string clears a field, and an absent object leaves them all as they are.
      properties:
        bankName: { type: string, maxLength: 100 }
        accountName: { type: string, maxLength: 100, description: Name the account is held in }
        accountNumber: { type: string, pattern: '^((?:[0-9A-Za-z] ?){6,34})?$', description: 'Up to 34 letters and digits; single spaces between groups are allowed and dropped when saved' }
        ifsc: { type: string, pattern: '^([A-Za-z]{4}0[A-Za-z0-9]{6})?$', description: Indian Financial System Code }
        branch: { type: string, maxLength: 100 }
        upiId: { type: string, pattern: '^([A-Za-z0-9.\-_]{2,256}@[A-Za-z][A-Za-z0-9]{1,63})?$', description: 'Virtual payment address, e.g. `vertex@okhdfc`' }
        paymentAccountId: { type: string, maxLength: 40, description: "The bank payment account these details belong to. Receipts default to it; an empty string unlinks it. Linked, the other fields are that account's own (set in payment accounts) and what is sent for them is ignored." }
    Company:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          required: [name, businessType, country, baseCurrency, address, fiscalYearStartMonth]
          properties:
            id: { type: string, readOnly: true }
            accountId: { type: string, readOnly: true }
            name: { type: string }
            legalName: { type: string }
            logoUri: { type: string, format: uri, readOnly: true }
            signatureUri: { type: string, format: uri, readOnly: true, description: "The authorised signatory's signature, printed above that line on documents. Set through /signature." }
            bankDetails: { $ref: '#/components/schemas/BankDetails' }
            invoiceTemplate:
              type: object
              description: How its documents look. Statutory content always prints; every option unset takes the layout's own, and no layout is the standard page.
              properties:
                layout: { type: string, enum: [standard, classic, detailed, modern], description: 'The ready-made page: standard (the app''s own), classic and detailed (boxed, as in an accounting package), modern (cards). A document can override it (setDocumentPrintLayout).' }
                accentColor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
                logoPosition: { type: string, enum: [left, right] }
                showDiscountColumn: { type: boolean }
                showTaxColumn: { type: boolean }
                showHsn: { type: boolean }
                showLogo: { type: boolean }
                showHsnSummary: { type: boolean, description: The HSN/SAC-wise tax table with the tax in words }
                showBank: { type: boolean }
                showSignature: { type: boolean }
                showDeclaration: { type: boolean }
                showShipTo: { type: boolean, description: The consignee (ship to) and dispatch-from blocks }
                showPanTan: { type: boolean }
                showCustomerSeal: { type: boolean }
                declarationText: { type: string, maxLength: 300 }
                footerText: { type: string, maxLength: 200 }
                compact: { type: boolean }
            aiMonthlyLimit: { type: [integer, 'null'], minimum: 0, description: "The owner's monthly AI budget (Lixi messages plus provider bill scans), below the plan's allowance. Null is the plan's." }
            businessType: { type: string, description: 'Stable slug, e.g. `wholesale`' }
            country: { type: string }
            baseCurrency: { type: string }
            address: { $ref: '#/components/schemas/Address' }
            email: { type: string, format: email }
            phone: { type: string }
            website: { type: string }
            taxRegistration: { $ref: '#/components/schemas/TaxRegistration' }
            fiscalYearStartMonth: { type: integer, minimum: 1, maximum: 12 }
            disabledModules: { type: array, items: { type: string, enum: [purchases, inventory, expenses, ocr, fx, branches, payables, books, pos] }, description: 'Modules switched off within the plan: hidden, and their operations refused (403 MODULE_OFF); their records stay. Only an owner can change it.' }
            approvalRules:
              type: array
              description: 'Documents of a kind whose total (in base currency) is over the amount wait for an owner or admin before they are issued; with kind `payment`, payments made over it wait as payment requests. Only an owner can change them.'
              items:
                type: object
                required: [kind, overMinor]
                properties:
                  kind:
                    description: A document kind, or `payment` for payments made to suppliers (RULES 6.14).
                    anyOf:
                      - { $ref: '#/components/schemas/DocumentKind' }
                      - { type: string, enum: [payment] }
                  overMinor: { type: integer, minimum: 0 }
            lockedThroughDate: { type: [string, 'null'], format: date, description: 'Books are closed up to and including this date: no document dated then can be finalised or cancelled. Only an owner can change it.' }
            perpetualStockFrom: { type: [string, 'null'], format: date, description: 'Perpetual stock from this day, which must start a financial year after any closed period: tracked goods post to Stock in hand at a moving weighted-average cost as they come in and go out, and the goods sold to Cost of goods sold. Null keeps the books periodic (closing stock valued from the stock ledger). Only an owner can change it; `422 PERPETUAL_NOT_YEAR_START`, `409 PERIOD_LOCKED`.' }
            stockCosting: { type: string, enum: [average, fifo], description: 'How stock is costed as it goes out (RULES 6.2): `average`, a moving weighted average (the default), or `fifo`, first in, first out. It values every period, so it changes only while no period is closed (`409 PERIOD_LOCKED`), and only by an owner.' }
            tan: { type: string, pattern: '^([A-Z]{4}[0-9]{5}[A-Z])?$', description: 'Tax deduction account number. With it, TDS is worked out on supplier bills under their section. An empty string clears it.' }
            allowNegativeStock: { type: boolean, default: false, description: 'When false, finalising a sale that would take a tracked item below zero at its branch fails with 422 INSUFFICIENT_STOCK.' }
            msmeBankRate: { type: number, minimum: 0, maximum: 50, default: 5.5, description: "RBI's bank rate in percent; MSME late-payment interest is three times it (MSMED Act s.16)" }
            gstr2bDateToleranceDays: { type: integer, minimum: 0, maximum: 30, default: 3, description: 'How many days apart a GSTR-2B line and a bill with the same amounts may be dated and still be claimable without a person accepting it; 0 means the same day only.' }
            plan: { allOf: [{ $ref: '#/components/schemas/PlanTier' }], readOnly: true, description: Changed only through billing }
            archivedAt: { type: string, format: date-time, readOnly: true, description: 'Set when an owner archived the business (/archive). Its books are read-only: anything but a read, an export or /restore is refused with 409 COMPANY_ARCHIVED.' }
            purgeAfter: { type: string, format: date-time, readOnly: true, description: 'An archived business is erased after this, 8 years from archiving, as GST law keeps books 72 months. /restore before then brings it back.' }
    ArchiveCompanyRequest:
      type: object
      required: [confirmName]
      description: The business's name typed in, and proof it's really them, as at sign-in. The password if they have one, otherwise a fresh code sent to their verified phone.
      properties:
        confirmName: { type: string, description: "The business's name, typed by the owner; compared ignoring case and surrounding spaces" }
        password: { type: string, format: password }
        otpRequestId: { type: string }
        otpCode: { type: string }
    Branch:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          required: [name, code, address]
          properties:
            id: { type: string, readOnly: true }
            companyId: { type: string, readOnly: true }
            name: { type: string }
            code: { type: string, maxLength: 6, example: MUM }
            address: { $ref: '#/components/schemas/Address' }
            isPrimary: { type: boolean }
            phone: { type: string }
            gstin: { type: string, description: 'The branch''s own GSTIN when it is registered separately; printed as the seller' }
    User:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          properties:
            id: { type: string, readOnly: true }
            accountId: { type: string, readOnly: true }
            name: { type: string }
            email: { type: string, format: email }
            phone: { type: string }
            role: { $ref: '#/components/schemas/UserRole' }
            companyIds: { type: array, items: { type: string } }
            branchIds: { type: array, items: { type: string }, description: Empty means all branches }
            avatarColor: { type: string }
            status: { type: string, enum: [active, invited, disabled] }
            lastActiveAt: { type: string, format: date-time, readOnly: true }
    DeviceSession:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        platform: { type: string }
        lastActiveAt: { type: string, format: date-time }
        current: { type: boolean }
        location: { type: string }
    PlanInfo:
      type: object
      properties:
        key: { $ref: '#/components/schemas/PlanTier' }
        name: { type: string }
        monthly: { type: number, description: INR }
        yearly: { type: number }
        features: { type: array, items: { type: string } }
        modules: { type: array, items: { type: string, enum: [purchases, inventory, expenses, ocr, fx, branches, payables, books] } }
        popular: { type: boolean }
    Subscription:
      type: object
      properties:
        companyId: { type: string }
        plan: { $ref: '#/components/schemas/PlanTier' }
        cycle: { type: string, enum: [monthly, yearly] }
        status: { type: string, enum: [active, trialing, pastDue, cancelled, none] }
        currentPeriodEnd: { type: string, format: date-time }
        cancelAtPeriodEnd: { type: boolean }
        provider: { type: string, enum: [razorpay, appStore, playStore] }

    # ---------------------------------------------------------------- settings
    TaxCategory:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          required: [name, rate, type, effectiveFrom]
          properties:
            id: { type: string, readOnly: true }
            companyId: { type: string, readOnly: true }
            name: { type: string, example: GST 18% }
            rate: { type: number, minimum: 0, maximum: 999.999, description: 'Combined percentage, split at calculation time. Up to 100, or 999.999 for CESS' }
            type: { type: string, enum: [GST, CGST, SGST, IGST, VAT, CESS, NONE] }
            hsnCode: { type: string }
            effectiveFrom: { type: string, format: date }
            description: { type: string }
    ExpenseCategory:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          required: [name]
          properties:
            id: { type: string, readOnly: true }
            companyId: { type: string, readOnly: true }
            name: { type: string }
            icon: { type: string }
            color: { type: string }
    VoucherTemplate:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          required: [name, kind, lines]
          properties:
            id: { type: string, readOnly: true }
            companyId: { type: string, readOnly: true }
            name: { type: string, maxLength: 100 }
            kind: { type: string, enum: [journal, contra, gstJournal, tdsChallan, receipt, gstChallan] }
            narration: { type: string }
            lines:
              type: array
              minItems: 1
              items:
                type: object
                required: [account, side]
                properties:
                  account: { type: string }
                  side: { type: string, enum: [dr, cr] }
                  amount: { allOf: [{ $ref: '#/components/schemas/Money' }], description: Left out to fill in on each use }
                  narration: { type: string }
                  costCentreId: { type: string }
    Vehicle:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          required: [registration]
          properties:
            id: { type: string, readOnly: true }
            companyId: { type: string, readOnly: true }
            registration: { type: string, description: 'As on the RC; spaces and dashes are dropped: TN09AB1234' }
            name: { type: string, maxLength: 100 }
            status: { type: string, enum: [active, inactive] }
    CustomField:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          required: [entity, label, kind]
          properties:
            id: { type: string, readOnly: true }
            companyId: { type: string, readOnly: true }
            entity: { type: string, enum: [party, item, document] }
            label: { type: string, maxLength: 60 }
            kind: { type: string, enum: [text, number, date, select, checkbox] }
            options: { type: array, items: { type: string }, description: "A select's choices, in order" }
            required: { type: boolean }
            showOnPdf: { type: boolean, description: 'Printed on documents: a document field on its own PDF, a party field on documents to that party' }
            position: { type: integer }
            status: { type: string, enum: [active, inactive] }
    ItemCategory:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          required: [name]
          properties:
            id: { type: string, readOnly: true }
            companyId: { type: string, readOnly: true }
            name: { type: string, maxLength: 100 }
            color: { type: string, description: 'Hex, like #4DA3FF; a neutral grey when left out' }
    Brand:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          required: [name]
          properties:
            id: { type: string, readOnly: true }
            companyId: { type: string, readOnly: true }
            name: { type: string, maxLength: 100 }
    PaymentAccount:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          required: [name, type, currency, openingBalance]
          properties:
            id: { type: string, readOnly: true }
            companyId: { type: string, readOnly: true }
            name: { type: string }
            type: { type: string, enum: [cash, bank, wallet] }
            currency: { type: string }
            accountNumber: { type: string, maxLength: 40 }
            accountHolderName: { type: string, maxLength: 100, description: 'Name the account is held in, as a customer pays it' }
            bankName: { type: string, maxLength: 100 }
            branchName: { type: string, maxLength: 100 }
            ifsc: { type: string, pattern: '^([A-Za-z]{4}0[A-Za-z0-9]{6})?$', description: Indian Financial System Code }
            upiId: { type: string, pattern: '^([A-Za-z0-9.\-_]{2,256}@[A-Za-z][A-Za-z0-9]{1,63})?$', description: 'Virtual payment address, e.g. `vertex@okhdfc`' }
            openingBalance: { $ref: '#/components/schemas/Money' }
            openingBalanceDate: { type: string, format: date, description: "The day the opening balance was counted; not after today." }
            openingRate: { type: number, readOnly: true, description: "A foreign-currency account: the opening balance's rate to base on its date, from the company's exchange rates" }
            currentBalance: { allOf: [{ $ref: '#/components/schemas/Money' }], readOnly: true, description: 'In base currency' }
            isDefault: { type: boolean }
    ExchangeRate:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          required: [from, to, rate, effectiveFrom]
          properties:
            id: { type: string, readOnly: true }
            companyId: { type: string, readOnly: true }
            from: { type: string }
            to: { type: string }
            rate: { type: number }
            effectiveFrom: { type: string, format: date }
            source: { type: string, enum: [manual, provider] }
    NumberingSeries:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          required: [kind, prefix, nextNumber, padding]
          properties:
            id: { type: string, readOnly: true }
            companyId: { type: string, readOnly: true }
            kind:
              type: string
              enum: [quote, proforma, salesOrder, delivery, invoice, salesReturn, purchaseOrder, goodsReceipt, purchaseBill, purchaseReturn, creditNote, debitNote, supplierCreditNote, supplierDebitNote, selfInvoice, payment, expense, journal, contra, gstJournal, tdsChallan, receipt, gstChallan]
            prefix: { type: string, example: INV }
            nextNumber: { type: integer, minimum: 1 }
            padding: { type: integer, minimum: 1, maximum: 8 }
            includeFiscalYear: { type: boolean }
            includeBranchCode: { type: boolean }
            resetPolicy: { type: string, enum: [never, yearly, monthly] }
    Transporter:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          required: [name, transporterId]
          properties:
            id: { type: string, readOnly: true }
            companyId: { type: string, readOnly: true }
            name: { type: string }
            transporterId: { type: string, description: 15-character GSTIN or TRANSIN }
            phone: { type: string }
            status: { type: string, enum: [active, inactive] }
    TransportMode: { type: string, enum: [road, rail, air, ship] }
    VehicleType: { type: string, enum: [regular, overDimensional] }
    ComplianceSettings:
      type: object
      properties:
        companyId: { type: string, readOnly: true }
        eInvoiceEnabled: { type: boolean }
        annualTurnover: { $ref: '#/components/schemas/Money' }
        eInvoiceTurnoverThreshold: { $ref: '#/components/schemas/Money' }
        reportingWindowDays: { type: integer, example: 30 }
        autoGenerateEInvoiceOnFinalise: { type: boolean }
        irpUsername: { type: string, description: 'The e-invoice (IRP) portal username' }
        ewbUsername: { type: string, description: 'The e-way bill portal username' }
        irpClientIdMasked: { type: string, readOnly: true, example: 'ELX-****-9F21' }
        ewayBillEnabled: { type: boolean }
        ewayBillThreshold: { $ref: '#/components/schemas/Money' }
        autoGenerateEwayBillOnFinalise: { type: boolean }
        defaultTransporterId: { type: string }
        defaultTransporterName: { type: string }
        defaultDistanceKm: { type: integer }
        defaultTransportMode: { $ref: '#/components/schemas/TransportMode' }
        defaultVehicleType: { $ref: '#/components/schemas/VehicleType' }
        updatedAt: { type: string, format: date-time, readOnly: true }
    BackupSettings:
      type: object
      properties:
        automatic: { type: boolean }
        frequency: { type: string, enum: [daily, weekly] }
        destination: { type: string, enum: [elixir-cloud, google-drive] }
        lastBackupAt: { type: string, format: date-time, readOnly: true }

    # ---------------------------------------------------------------- parties & items
    PartyKind: { type: string, enum: [customer, supplier, both, general], description: "both: buys and sells, one ledger under Sundry Debtors, on sales and purchase documents. general: a contact only, on no document or payment. Listing customers or suppliers includes both." }
    GstRegistrationType: { type: string, enum: [regular, composition, unregistered, sez, overseas] }
    Party:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          required: [kind, name, currency, billingAddress, openingBalance, paymentTermsDays]
          properties:
            id: { type: string, readOnly: true }
            companyId: { type: string, readOnly: true }
            kind: { $ref: '#/components/schemas/PartyKind' }
            name: { type: string }
            code: { type: string, description: Server assigns one when blank }
            displayName: { type: string }
            taxId: { type: string, description: GSTIN }
            gstRegistrationType: { $ref: '#/components/schemas/GstRegistrationType' }
            pan: { type: string, pattern: '^[A-Z]{5}[0-9]{4}[A-Z]$', description: Income-tax PAN; read from the GSTIN when not given }
            msmeType: { type: string, enum: [micro, small, medium], description: "The supplier's Udyam category; their bills fall due within 45 days (MSMED Act s.15)" }
            udyamNumber: { type: string, example: UDYAM-MH-26-0012345 }
            reverseCharge: { type: boolean, description: Bills from this supplier are under reverse charge unless a line says otherwise }
            tdsSection: { allOf: [{ $ref: '#/components/schemas/TdsSectionCode' }], description: "The TDS section this supplier's bills fall under by default" }
            lowerTdsCertificate:
              type: object
              description: A lower or nil deduction certificate (s.197)
              required: [rate, validTill]
              properties:
                rate: { type: number, minimum: 0, maximum: 100 }
                validTill: { type: string, format: date }
            tcsApplicable: { type: boolean, description: "Sales to this customer collect TCS (s.206C) by default, under tcsSection" }
            tcsSection: { allOf: [{ $ref: '#/components/schemas/TcsSectionCode' }], description: "The TCS section this customer's invoices fall under by default; needs tcsApplicable" }
            email: { type: string, format: email }
            phone: { type: string }
            currency: { type: string }
            billingAddress: { $ref: '#/components/schemas/Address' }
            shippingAddress: { $ref: '#/components/schemas/Address' }
            creditLimit: { $ref: '#/components/schemas/Money' }
            openingBalance: { $ref: '#/components/schemas/Money' }
            openingBalanceDate: { type: string, format: date, description: "The day the opening balance stands at; not after today. Unset reads as the start of the books." }
            openingBalanceSide: { type: string, enum: [dr, cr], description: "dr: they owe us; cr: we owe them. Unset is the kind's usual side (customer and both dr, supplier cr). A general contact has no opening balance." }
            paymentTermsDays: { type: integer, minimum: 0 }
            notes: { type: string }
            status: { type: string, enum: [active, inactive] }
            customFields: { type: object, additionalProperties: true, description: 'Values of the company custom fields, by field id (listCustomFields); checked against them' }
    PartyWithBalance:
      allOf:
        - $ref: '#/components/schemas/Party'
        - type: object
          properties:
            outstanding: { allOf: [{ $ref: '#/components/schemas/Money' }], readOnly: true }
            overdue: { allOf: [{ $ref: '#/components/schemas/Money' }], readOnly: true }
            advance: { allOf: [{ $ref: '#/components/schemas/Money' }], readOnly: true, description: Unallocated payments }
            payable: { allOf: [{ $ref: '#/components/schemas/Money' }], readOnly: true, description: "Only for a party that is both: what we owe them on bills (outstanding is what they owe on invoices)" }
    PartyStatement:
      type: object
      properties:
        party: { $ref: '#/components/schemas/Party' }
        openingBalance: { $ref: '#/components/schemas/Money' }
        closingBalance: { $ref: '#/components/schemas/Money' }
        entries:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              entityType: { type: string, enum: [document, payment, voucher, opening] }
              entityId: { type: string }
              number: { type: string }
              debit: { $ref: '#/components/schemas/Money' }
              credit: { $ref: '#/components/schemas/Money' }
              balance: { $ref: '#/components/schemas/Money' }
    Item:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          required: [sku, name, type, unit, salePrice, purchasePrice, taxCategoryId]
          properties:
            id: { type: string, readOnly: true }
            companyId: { type: string, readOnly: true }
            customFields: { type: object, additionalProperties: true, description: 'Values of the company custom fields, by field id (listCustomFields); checked against them' }
            sku: { type: string }
            name: { type: string }
            description: { type: string }
            type: { type: string, enum: [goods, service] }
            unit: { type: string, example: pcs }
            salePrice: { $ref: '#/components/schemas/Money' }
            purchasePrice: { $ref: '#/components/schemas/Money' }
            taxCategoryId: { type: string }
            hsnCode: { type: string }
            barcode: { type: string }
            trackInventory: { type: boolean }
            gst: { $ref: '#/components/schemas/GstFlags' }
            openingStock: { type: number, description: Used only on create }
            openingStockDate: { type: string, format: date, description: "The day the opening stock was counted; not after today, and no document with this item can be dated before it. Used only on create, and only when trackInventory is set." }
            reorderLevel: { type: number }
            imageUri: { type: string, format: uri, readOnly: true }
            categoryId: { type: [string, 'null'], description: 'An item category of this company, or null for none' }
            brandId: { type: [string, 'null'], description: 'A brand of this company, or null for none' }
            status: { type: string, enum: [active, inactive] }
    ItemWithStock:
      allOf:
        - $ref: '#/components/schemas/Item'
        - type: object
          properties:
            stockOnHand: { type: number, readOnly: true }
            low: { type: boolean, readOnly: true }

    # ---------------------------------------------------------------- documents
    DocumentKind:
      type: string
      enum: [quote, proforma, salesOrder, delivery, invoice, salesReturn, purchaseOrder, goodsReceipt, purchaseBill, purchaseReturn, creditNote, debitNote, supplierCreditNote, supplierDebitNote, openingInvoice, openingBill]
      description: >-
        creditNote and debitNote lower or raise what an invoice charged, with no goods moving;
        supplierCreditNote and supplierDebitNote are a supplier's against their bill. Each is usually
        raised against its invoice or bill (sourceDocumentId); a direct note, against no one invoice
        or bill, must give its noteReason. Credit notes, like returns, settle what the source still
        owes, and a direct one is credit the party holds, like an advance; debit notes are owed and
        paid like an invoice or bill. openingInvoice and openingBill are what was still owed, invoice by
        invoice, when the books started here (importOpeningDocuments): paid and aged like an invoice or bill,
        posted only to Opening balances, never in sales, purchases or GST.
    DocStatus:
      type: string
      enum: [draft, sent, accepted, rejected, expired, confirmed, fulfilled, cancelled, delivered, issued, partiallyPaid, paid, overdue, requested, approved, processed, received, billed]
    LedgerAccount:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          required: [name, group, openingBalance]
          properties:
            id: { type: string, readOnly: true }
            companyId: { type: string, readOnly: true }
            name: { type: string, maxLength: 200 }
            group: { type: string, enum: [capital, reserves, loans, sundryCreditors, dutiesTaxes, provisions, currentLiabilities, fixedAssets, investments, sundryDebtors, cashInHand, bankAccounts, stockInHand, loansAdvances, currentAssets, salesAccounts, directIncomes, indirectIncomes, purchaseAccounts, directExpenses, indirectExpenses] }
            openingBalance: { allOf: [{ $ref: '#/components/schemas/Money' }], description: 'Debit positive, as of the day the books begin' }
            openingBalanceDate: { type: string, format: date, description: "The day the opening balance stands at; not after today. Unset reads as the start of the books." }
            status: { type: string, enum: [active, inactive] }
    Budget:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          required: [name, yearFrom, lines]
          properties:
            id: { type: string, readOnly: true }
            name: { type: string, maxLength: 200 }
            yearFrom: { type: string, format: date, description: 'The first day of the financial year it plans' }
            branchId: { type: string }
            costCentreId: { type: string }
            notes: { type: string, maxLength: 2000 }
            lines:
              type: array
              maxItems: 500
              items:
                type: object
                required: [account, months]
                properties:
                  account: { type: string, description: 'An income or expense account, by key' }
                  months: { type: array, minItems: 12, maxItems: 12, items: { type: integer, minimum: 0 }, description: "Base-currency paise for each month from the year's first" }
    BudgetVariance:
      type: object
      required: [from, to, rows, income, expense, profit]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        income: { $ref: '#/components/schemas/BudgetActual' }
        expense: { $ref: '#/components/schemas/BudgetActual' }
        profit: { $ref: '#/components/schemas/BudgetActual' }
        rows:
          type: array
          items:
            type: object
            required: [account, nature, budget, actual, variance, favourable, months]
            properties:
              account: { $ref: '#/components/schemas/LedgerAccountRef' }
              nature: { type: string, enum: [income, expense] }
              budget: { type: integer }
              actual: { type: integer }
              variance: { type: integer }
              favourable: { type: boolean }
              months:
                type: array
                items:
                  type: object
                  required: [month, budget, actual]
                  properties:
                    month: { type: string, format: date }
                    budget: { type: integer }
                    actual: { type: integer }
    BudgetActual:
      type: object
      required: [budget, actual]
      properties:
        budget: { type: integer }
        actual: { type: integer }
    LedgerAccountRef:
      type: object
      required: [key, name, group]
      properties:
        key: { type: string }
        name: { type: string }
        group: { type: string }
    FixedAsset:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          required: [name, account, acquiredOn, inUseFrom, cost, method]
          properties:
            id: { type: string, readOnly: true }
            companyId: { type: string, readOnly: true }
            branchId: { type: string }
            name: { type: string, maxLength: 200 }
            category: { type: string, maxLength: 60, description: 'What kind of asset: Computers, Vehicles, Furniture…' }
            account: { type: string, description: "The fixed-asset account its cost sits in, by key: `sys:fixedAssets` or `acc:<id>`" }
            assetCode: { type: string, maxLength: 60 }
            acquiredOn: { type: string, format: date }
            inUseFrom: { type: string, format: date, description: 'Depreciation runs from this day' }
            cost: { $ref: '#/components/schemas/Money' }
            residualValue: { allOf: [{ $ref: '#/components/schemas/Money' }], description: 'What it is expected to fetch at the end; never written off' }
            method: { type: string, enum: [slm, wdv], description: 'Straight line over `lifeMonths`, or written down value at `rate` percent a year' }
            lifeMonths: { type: integer, minimum: 1, maximum: 1200 }
            rate: { type: number, exclusiveMinimum: 0, maximum: 100 }
            openingDepreciation: { allOf: [{ $ref: '#/components/schemas/Money' }], description: 'Written off before the books began here, by `openingAsOf`' }
            openingAsOf: { type: string, format: date }
            sourceDocumentId: { type: string, description: 'The purchase bill it was bought on, when bought here' }
            costCentreId: { type: string }
            disposedOn: { type: string, format: date, description: 'Sold, scrapped or lost: depreciation stops and it leaves the books that day' }
            disposalNote: { type: string, maxLength: 500 }
            notes: { type: string, maxLength: 2000 }
            status: { type: string, enum: [active, disposed], readOnly: true }
            accumulatedDepreciation: { allOf: [{ $ref: '#/components/schemas/Money' }], readOnly: true, description: 'Written off by `asOf` (today, unless the list was asked for another day)' }
            bookValue: { allOf: [{ $ref: '#/components/schemas/Money' }], readOnly: true }
            years:
              type: array
              readOnly: true
              description: 'Only from getFixedAsset: depreciation by financial year'
              items:
                type: object
                required: [label, from, to, opening, depreciation, closing]
                properties:
                  label: { type: string }
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  opening: { $ref: '#/components/schemas/Money' }
                  depreciation: { $ref: '#/components/schemas/Money' }
                  closing: { $ref: '#/components/schemas/Money' }
    FixedAssetSchedule:
      type: object
      required: [from, to, rows, totals]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        rows: { type: array, items: { $ref: '#/components/schemas/FixedAssetScheduleRow' } }
        totals: { $ref: '#/components/schemas/FixedAssetScheduleRow' }
    FixedAssetScheduleRow:
      type: object
      required: [openingCost, additions, disposals, closingCost, openingDepreciation, depreciation, depreciationOnDisposals, closingDepreciation, openingValue, closingValue]
      properties:
        assetId: { type: string }
        name: { type: string }
        category: { type: string }
        account: { type: string }
        openingCost: { type: integer }
        additions: { type: integer }
        disposals: { type: integer }
        closingCost: { type: integer }
        openingDepreciation: { type: integer }
        depreciation: { type: integer }
        depreciationOnDisposals: { type: integer }
        closingDepreciation: { type: integer }
        openingValue: { type: integer }
        closingValue: { type: integer }
    CostCentre:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          required: [name]
          properties:
            id: { type: string, readOnly: true }
            companyId: { type: string, readOnly: true }
            name: { type: string, maxLength: 200 }
            category: { type: string, maxLength: 60, example: Project }
            parentId: { type: string, description: The centre this one sits under }
            status: { type: string, enum: [active, inactive] }
    VoucherLine:
      type: object
      required: [account, debit, credit]
      properties:
        account: { type: string, description: 'An account key: sys:<name>, sys:tdsPayable:<section>, party:<id>, pay:<id>, exp:<id> or acc:<id>', example: 'pay:pac_123' }
        debit: { $ref: '#/components/schemas/Money' }
        credit: { $ref: '#/components/schemas/Money' }
        narration: { type: string }
        costCentreId: { type: string }
    Voucher:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          required: [kind, date, lines]
          properties:
            id: { type: string, readOnly: true }
            companyId: { type: string, readOnly: true }
            branchId: { type: string }
            kind: { type: string, enum: [journal, contra, gstJournal, tdsChallan, receipt, gstChallan], description: "receipt: money in that isn't from an invoice (interest, rent, a refund); it debits cash or bank only" }
            number: { type: string, readOnly: true }
            date: { type: string, format: date }
            narration: { type: string }
            reference: { type: string, description: "A TDS challan's number and BSR code, a cheque number" }
            challan:
              type: object
              description: A TDS challan's deposit details (ITNS 281), for the challan register and Form 26Q
              required: [bsrCode, serial, depositedOn]
              properties:
                bsrCode: { type: string, pattern: '^[0-9]{7}$' }
                serial: { type: string, pattern: '^[0-9]{1,5}$' }
                depositedOn: { type: string, format: date }
            gstChallan: { $ref: '#/components/schemas/GstChallan' }
            gstin: { type: string, readOnly: true, description: "On a GST set-off journal, the registration it sets off" }
            gstPeriod: { type: string, readOnly: true, description: "On a GST set-off journal, the return period (MMYYYY) it sets off" }
            status: { type: string, enum: [draft, posted], description: "Omitted on create means posted; omitted on save keeps it. A posted voucher cannot go back to draft." }
            postedAt: { type: string, format: date-time, readOnly: true }
            lines: { type: array, minItems: 1, items: { $ref: '#/components/schemas/VoucherLine' } }
            partyId: { type: string, description: "On a receipt: the customer, supplier or contact it came from, for reference. The lines are what post." }
            attachmentIds: { type: array, items: { type: string }, description: Files kept with the voucher (a receipt's slip) }
            createdBy: { type: string, readOnly: true }
    TrialBalance:
      type: object
      properties:
        rows:
          type: array
          items:
            type: object
            properties:
              account: { type: string }
              name: { type: string }
              group: { type: string }
              opening: { allOf: [{ $ref: '#/components/schemas/Money' }], description: Debit positive }
              debit: { $ref: '#/components/schemas/Money' }
              credit: { $ref: '#/components/schemas/Money' }
              closing: { allOf: [{ $ref: '#/components/schemas/Money' }], description: Debit positive }
        totalDebit: { $ref: '#/components/schemas/Money' }
        totalCredit: { $ref: '#/components/schemas/Money' }
    GstPortalSession:
      type: object
      properties:
        gstin: { type: string }
        username: { type: string }
        connected: { type: boolean }
        expiresAt: { type: string, format: date-time }
        refreshableUntil: { type: string, format: date-time, description: Until when it renews without a new OTP }
        otpRequestedAt: { type: string, format: date-time }
    GstReturn:
      type: object
      properties:
        id: { type: string }
        gstin: { type: string }
        returnType: { type: string, enum: [gstr1, gstr3b] }
        period: { type: string, description: MMYYYY }
        status: { type: string, enum: [prepared, saved, submitted, filed, failed, notFiled] }
        arn: { type: string }
        filedOn: { type: string, format: date }
        referenceId: { type: string }
        lastError: { type: string }
    Gstr2bBill:
      type: object
      properties:
        documentId: { type: string }
        kind: { type: string, enum: [purchaseBill, supplierCreditNote, supplierDebitNote] }
        number: { type: string }
        supplierNumber: { type: string }
        date: { type: string, format: date }
        taxable: { $ref: '#/components/schemas/Money' }
        tax: { $ref: '#/components/schemas/Money' }
        claimedIn: { type: string }
    Gstr2bReconciliation:
      type: object
      properties:
        gstin: { type: string }
        period: { type: string }
        fetched: { type: boolean }
        fetchedAt: { type: string, format: date-time }
        generatedOn: { type: string, format: date }
        summary:
          type: object
          properties:
            lines: { type: integer }
            matched: { type: integer }
            matchedWithinTolerance: { type: integer }
            manuallyLinked: { type: integer }
            claimed: { type: integer }
            partial: { type: integer }
            probable: { type: integer }
            missingInBooks: { type: integer }
            missingIn2b: { type: integer }
            claimableTax: { $ref: '#/components/schemas/Money' }
        rows:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              section: { type: string }
              supplierGstin: { type: string }
              supplierName: { type: string }
              documentType: { type: string, enum: [I, C, D, BOE, ISD] }
              number: { type: string }
              date: { type: string, format: date }
              taxable: { $ref: '#/components/schemas/Money' }
              tax: { $ref: '#/components/schemas/Money' }
              reverseCharge: { type: boolean }
              itcAvailable: { type: boolean }
              itcReason: { type: string }
              status:
                type: string
                enum: [matched, matchedWithinTolerance, manuallyLinked, claimed, partial, probable, missingInBooks, notOurs, claimLater]
                description: "matchedWithinTolerance: amounts agree, dated a few days apart. partial: number agrees, amount or date doesn't (see reasons). claimed: its bill's credit is claimed for this period."
              reasons: { type: array, items: { type: string, enum: [taxable, tax, date, number] }, description: What differs between the line and its bill }
              decision: { type: string, enum: [accepted, notOurs, claimLater] }
              bill: { $ref: '#/components/schemas/Gstr2bBill' }
              difference:
                type: object
                properties:
                  taxable: { $ref: '#/components/schemas/Money' }
                  tax: { $ref: '#/components/schemas/Money' }
                  days: { type: integer }
        missingIn2b: { type: array, items: { $ref: '#/components/schemas/Gstr2bBill' } }
    GstAmounts:
      type: object
      properties:
        taxable: { $ref: '#/components/schemas/Money' }
        igst: { $ref: '#/components/schemas/Money' }
        cgst: { $ref: '#/components/schemas/Money' }
        sgst: { $ref: '#/components/schemas/Money' }
        cess: { $ref: '#/components/schemas/Money' }
    Gstr3bView:
      type: object
      properties:
        gstin: { type: string }
        period: { type: string }
        dueDate: { type: string, format: date }
        filingEnabled: { type: boolean, description: Whether this server files returns (GST_FILING_ENABLED) }
        outward:
          type: object
          properties:
            taxable: { $ref: '#/components/schemas/GstAmounts' }
            zeroRated: { $ref: '#/components/schemas/GstAmounts' }
            nilExempt: { $ref: '#/components/schemas/GstAmounts' }
            reverseCharge: { $ref: '#/components/schemas/GstAmounts' }
            nonGst: { $ref: '#/components/schemas/GstAmounts' }
        interStateUnregistered: { type: array, items: { type: object, properties: { placeOfSupply: { type: string }, taxable: { $ref: '#/components/schemas/Money' }, igst: { $ref: '#/components/schemas/Money' } } } }
        itc:
          type: object
          properties:
            importOfGoods: { $ref: '#/components/schemas/GstAmounts' }
            importOfServices: { $ref: '#/components/schemas/GstAmounts' }
            reverseCharge: { $ref: '#/components/schemas/GstAmounts' }
            isd: { $ref: '#/components/schemas/GstAmounts' }
            allOther: { $ref: '#/components/schemas/GstAmounts' }
            reversedRules: { $ref: '#/components/schemas/GstAmounts' }
            reversedOther: { $ref: '#/components/schemas/GstAmounts' }
            net: { $ref: '#/components/schemas/GstAmounts' }
            reclaimed: { $ref: '#/components/schemas/GstAmounts' }
        inwardExempt: { type: object, properties: { interState: { $ref: '#/components/schemas/Money' }, intraState: { $ref: '#/components/schemas/Money' } } }
        interest: { $ref: '#/components/schemas/GstAmounts' }
        lateFee: { $ref: '#/components/schemas/GstAmounts' }
        setOff:
          type: object
          description: How the tax is paid. credit[from][to], cash by kind, credit carried in from last month and forward to the next.
          properties:
            liability: { $ref: '#/components/schemas/GstAmounts' }
            credit: { type: object, additionalProperties: { $ref: '#/components/schemas/GstAmounts' } }
            cash: { $ref: '#/components/schemas/GstAmounts' }
            carriedIn: { $ref: '#/components/schemas/GstAmounts' }
            carriedForward: { $ref: '#/components/schemas/GstAmounts' }
            cashLedger: { allOf: [{ $ref: '#/components/schemas/GstAmounts' }], description: "The electronic cash ledger as the books hold it today (challans less what set-offs used)" }
        returns: { type: array, items: { $ref: '#/components/schemas/GstReturn' }, description: This period's GSTR-1 and GSTR-3B as recorded }
        breakup:
          type: object
          description: "What makes up each table, keyed as the portal numbers them (3.1a … 3.1e, 3.2, 4A1 … 4A5, 4B1, 4B2, 4D1, 5): one row per document, expense or advance, signed (a credit note takes away)."
          additionalProperties:
            type: array
            items:
              allOf:
                - $ref: '#/components/schemas/GstAmounts'
                - type: object
                  properties:
                    type: { type: string, enum: [document, expense, advance] }
                    id: { type: string }
                    kind: { type: string }
                    number: { type: string }
                    date: { type: string, format: date }
                    partyId: { type: string }
                    partyName: { type: string }
    GstHeadMinor:
      type: object
      description: An amount in paise per GST head
      required: [igst, cgst, sgst, cess]
      properties:
        igst: { type: integer }
        cgst: { type: integer }
        sgst: { type: integer }
        cess: { type: integer }
    GstChallan:
      type: object
      description: A GST deposit (PMT-06). Each head's minor heads in paise; the voucher's lines debit the GST cash ledger by each head's total and credit the bank.
      required: [cpin, depositedOn, heads]
      properties:
        cpin: { type: string, pattern: '^[0-9A-Za-z]{14}$', description: The 14-character common portal identification number }
        cin: { type: string, maxLength: 20, description: The challan identification number the bank gave }
        brn: { type: string, maxLength: 40, description: The bank reference number }
        depositedOn: { type: string, format: date }
        heads:
          type: object
          additionalProperties: false
          properties:
            igst: { $ref: '#/components/schemas/GstChallanHead' }
            cgst: { $ref: '#/components/schemas/GstChallanHead' }
            sgst: { $ref: '#/components/schemas/GstChallanHead' }
            cess: { $ref: '#/components/schemas/GstChallanHead' }
    GstChallanHead:
      type: object
      required: [tax, interest, penalty, fee, others]
      properties:
        tax: { type: integer, minimum: 0 }
        interest: { type: integer, minimum: 0 }
        penalty: { type: integer, minimum: 0 }
        fee: { type: integer, minimum: 0 }
        others: { type: integer, minimum: 0 }
    GstSetOff:
      type: object
      description: "A set-off, in paise by head: credit[from][to], forward tax paid in cash, reverse charge (cash only), older reverse charge payable, interest and late fee (cash only)."
      required: [credit, cash, reverseCharge, oldReverseCharge, interest, lateFee]
      properties:
        credit:
          type: object
          required: [igst, cgst, sgst, cess]
          properties:
            igst: { $ref: '#/components/schemas/GstHeadMinor' }
            cgst: { $ref: '#/components/schemas/GstHeadMinor' }
            sgst: { $ref: '#/components/schemas/GstHeadMinor' }
            cess: { $ref: '#/components/schemas/GstHeadMinor' }
        cash: { $ref: '#/components/schemas/GstHeadMinor' }
        reverseCharge: { $ref: '#/components/schemas/GstHeadMinor' }
        oldReverseCharge: { $ref: '#/components/schemas/GstHeadMinor' }
        interest: { $ref: '#/components/schemas/GstHeadMinor' }
        lateFee: { $ref: '#/components/schemas/GstHeadMinor' }
    GstUtilizationView:
      type: object
      required: [gstin, period, from, to, currency, forward, reverseCharge, available, carriedIn, cashBalance, oldReverseChargeOpen, interest, lateFee, prefill, outputCheck, existing]
      properties:
        gstin: { type: string }
        period: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        currency: { type: string }
        forward: { allOf: [{ $ref: '#/components/schemas/GstHeadMinor' }], description: "3.1(a) and (b) from the GSTR-3B data: payable by credit or cash" }
        reverseCharge: { allOf: [{ $ref: '#/components/schemas/GstHeadMinor' }], description: "3.1(d): payable in cash only" }
        available: { allOf: [{ $ref: '#/components/schemas/GstHeadMinor' }], description: Net credit (4C) plus what the last return carried forward }
        carriedIn: { $ref: '#/components/schemas/GstHeadMinor' }
        cashBalance: { allOf: [{ $ref: '#/components/schemas/GstHeadMinor' }], description: The GST cash ledger in the books on the asked date }
        oldReverseChargeOpen: { allOf: [{ $ref: '#/components/schemas/GstHeadMinor' }], description: "Reverse charge payable from before Output took it, still open" }
        interest: { $ref: '#/components/schemas/GstHeadMinor' }
        lateFee: { $ref: '#/components/schemas/GstHeadMinor' }
        prefill: { $ref: '#/components/schemas/GstSetOff' }
        outputCheck:
          type: object
          description: The Output ledger's credit over the period (set-offs left out) against forward plus reverse-charge liability
          required: [books, expected, difference, ok]
          properties:
            books: { $ref: '#/components/schemas/GstHeadMinor' }
            expected: { $ref: '#/components/schemas/GstHeadMinor' }
            difference: { $ref: '#/components/schemas/GstHeadMinor' }
            ok: { type: boolean }
        existing: { type: array, items: { $ref: '#/components/schemas/Voucher' }, description: "The set-off already posted for this GSTIN and period (by hand, or when 3B was filed)" }
    TdsSectionCode:
      type: string
      enum: [194C, 194JA, 194JB, 194H, 194IA, 194IB, 194A, 194Q]
      description: '194J(a) is 194JA, 194I(b) is 194IB, and so on.'
    TcsSectionCode:
      type: string
      enum: [scrap, liquor, tenduLeaves, timberLease, timberOther, forestProduce, minerals, motorVehicle, luxuryGoods]
      description: 'A TCS section of s.206C, as core TCS_SECTIONS names it.'
    TdsDeduction:
      type: object
      readOnly: true
      required: [section, rate, amount]
      properties:
        section: { $ref: '#/components/schemas/TdsSectionCode' }
        rate: { type: number }
        amount: { $ref: '#/components/schemas/Money' }
    MsmePayables:
      type: object
      description: "Bills of micro and small suppliers still unpaid (MSMED Act s.15: by the agreed day, at most 45 days, else 15), and for the CA what wasn't paid in time this financial year (s.43B(h))"
      properties:
        rows:
          type: array
          items:
            type: object
            properties:
              documentId: { type: string }
              number: { type: string }
              supplierDocNumber: { type: string }
              partyId: { type: string }
              partyName: { type: string }
              msmeType: { type: string, enum: [micro, small] }
              date: { type: string, format: date }
              dueDate: { type: string, format: date }
              outstanding: { $ref: '#/components/schemas/Money' }
              daysLeft: { type: integer, description: Negative once overdue }
              interest: { allOf: [{ $ref: '#/components/schemas/Money' }], description: 's.16 interest so far, at three times the bank rate, compounded monthly' }
        notPaidInTime:
          type: array
          items:
            type: object
            properties:
              documentId: { type: string }
              number: { type: string }
              partyId: { type: string }
              partyName: { type: string }
              date: { type: string, format: date }
              dueDate: { type: string, format: date }
              amount: { $ref: '#/components/schemas/Money' }
        bankRate: { type: number, description: "RBI's bank rate used for the interest, percent" }
        outstanding: { $ref: '#/components/schemas/Money' }
        overdue: { $ref: '#/components/schemas/Money' }
    TdsRegister:
      type: object
      properties:
        rows:
          type: array
          items:
            type: object
            properties:
              section: { type: string }
              sectionLabel: { type: string }
              partyId: { type: string }
              partyName: { type: string }
              pan: { type: string }
              quarter: { type: string, example: FY 2026-27 Q1 }
              base: { $ref: '#/components/schemas/Money' }
              tds: { $ref: '#/components/schemas/Money' }
              documents: { type: integer }
        total: { $ref: '#/components/schemas/Money' }
    GstFlags:
      type: object
      description: How GST treats an item. Kept on each document line as it was when the line was written.
      properties:
        supplyType: { type: string, enum: [taxable, nil, exempt, nonGst], description: 'Unset reads as taxable. Nil-rated, exempt and non-GST supplies carry no tax and are reported separately' }
        reimbursement: { type: boolean, description: "Recovered at cost as the customer's pure agent (Rule 33): no tax, outside the taxable value" }
        capitalGoods: { type: boolean, description: An asset; its input tax credit is reported separately }
        itcEligibility: { type: string, enum: [eligible, blocked, ineligible], description: 'Unset reads as eligible. Whether GST paid on it can be claimed; blocked is s.17(5)' }
        reverseCharge: { type: boolean, description: A notified reverse-charge supply; the buyer pays the GST }
        cessRate: { type: number, minimum: 0, maximum: 999, description: 'Compensation cess, percent of the taxable value' }
    DocumentLine:
      type: object
      required: [name, quantity, unit, unitPrice, taxCategoryId]
      properties:
        id: { type: string }
        itemId: { type: string }
        name: { type: string }
        description: { type: string }
        hsnCode: { type: string }
        quantity: { type: number, exclusiveMinimum: 0 }
        unit: { type: string }
        unitPrice: { $ref: '#/components/schemas/Money' }
        discountMode: { type: string, enum: [percent, amount], default: percent }
        discountValue: { type: number, default: 0 }
        taxCategoryId: { type: string }
        taxRate: { type: number, readOnly: true, description: Snapshot of the rate applied }
        taxInclusive: { type: boolean, default: false }
        gst: { allOf: [{ $ref: '#/components/schemas/GstFlags' }], description: "Defaults to the item's; kept as it was once the document is finalised" }
        expenseId: { type: string, description: "A reimbursement line: the customer's billable expense it recovers. An expense is recovered once (409 EXPENSE_ALREADY_RECOVERED)" }
        costCentreId: { type: string, description: "On a purchase document: this line's cost centre, for a line that is not stock (an item that tracks stock takes the document's). Left out takes the document's." }
    TaxComponent:
      type: object
      properties:
        type: { type: string, enum: [GST, CGST, SGST, IGST, VAT, CESS, NONE] }
        label: { type: string }
        rate: { type: number }
        amount: { $ref: '#/components/schemas/Money' }
    TaxLine:
      type: object
      properties:
        categoryId: { type: string }
        categoryName: { type: string }
        rate: { type: number }
        reverseCharge: { type: boolean, description: Tax the buyer pays the government; not part of the total }
        taxableAmount: { $ref: '#/components/schemas/Money' }
        components: { type: array, items: { $ref: '#/components/schemas/TaxComponent' } }
        totalTax: { $ref: '#/components/schemas/Money' }
    DocumentTotals:
      type: object
      readOnly: true
      properties:
        subtotal: { $ref: '#/components/schemas/Money' }
        lineDiscount: { $ref: '#/components/schemas/Money' }
        documentDiscount: { $ref: '#/components/schemas/Money' }
        taxableAmount: { $ref: '#/components/schemas/Money' }
        taxLines: { type: array, items: { $ref: '#/components/schemas/TaxLine' } }
        totalTax: { allOf: [{ $ref: '#/components/schemas/Money' }], description: 'Tax charged on the document, cess included; reverse-charge tax is not' }
        reverseChargeTax: { allOf: [{ $ref: '#/components/schemas/Money' }], description: Tax the buyer owes under reverse charge; not in the grand total }
        tcs: { allOf: [{ $ref: '#/components/schemas/Money' }], description: 'TCS collected from the buyer (s.206C), inside the grand total' }
        reimbursements: { allOf: [{ $ref: '#/components/schemas/Money' }], description: 'Pure-agent reimbursements, added after tax' }
        charges: { allOf: [{ $ref: '#/components/schemas/Money' }], description: 'Charges left after tax, untaxed (all of them on a document dated before 2026-12-01)' }
        chargesTaxed: { allOf: [{ $ref: '#/components/schemas/Money' }], description: 'Charges spread over the lines and taxed with them (RULES 1.10), inside taxableAmount; absent when none' }
        roundOff: { $ref: '#/components/schemas/Money' }
        grandTotal: { $ref: '#/components/schemas/Money' }
        grandTotalBase: { $ref: '#/components/schemas/Money' }
    NewDocumentInput:
      type: object
      required: [kind, partyId, date, currency, lines]
      properties:
        kind: { $ref: '#/components/schemas/DocumentKind' }
        partyId: { type: string }
        customFields: { type: object, additionalProperties: true, description: 'Values of the company custom fields, by field id (listCustomFields); checked against them' }
        branchId: { type: string, description: Defaults to the user's active branch }
        date: { type: string, format: date }
        dueDate: { type: string, format: date }
        validUntil: { type: string, format: date }
        currency: { type: string }
        exchangeRate: { type: number, description: Defaults to the effective rate on `date` }
        lines: { type: array, minItems: 1, items: { $ref: '#/components/schemas/DocumentLine' } }
        documentDiscountMode: { type: string, enum: [percent, amount] }
        documentDiscountValue: { type: number }
        charges: { $ref: '#/components/schemas/Money' }
        applyRoundOff: { type: boolean }
        roundOffManual: { allOf: [{ $ref: '#/components/schemas/Money' }], description: A round-off the user typed; overrides the automatic one when applyRoundOff is true }
        notes: { type: string }
        terms: { type: string }
        reference: { type: string }
        supplierDocNumber: { type: string }
        billOfEntry:
          type: object
          description: "On an import bill (a purchase bill from an overseas supplier): the bill of entry customs assessed it on, with the IGST and cess paid there. That IGST is input credit, claimed in 3B 4A(1) once 2B shows the bill of entry."
          required: [number, date, portCode, assessableValue, igst]
          properties:
            number: { type: string, maxLength: 20 }
            date: { type: string, format: date }
            portCode: { type: string, pattern: '^[A-Z0-9]{6}$' }
            assessableValue: { $ref: '#/components/schemas/Money' }
            igst: { $ref: '#/components/schemas/Money' }
            cess: { $ref: '#/components/schemas/Money' }
        isdInvoice: { type: boolean, description: "A purchase bill that is an Input Service Distributor's invoice: its credit goes to 3B 4A(4)" }
        placeOfSupplyStateCode: { type: string }
        reverseCharge: { type: boolean, description: The whole document is under reverse charge; the buyer pays the GST }
        attachmentIds: { type: array, items: { type: string } }
        sourceDocumentId: { type: string }
        noteReason: { type: string, enum: [discount, priceChange, taxCorrection, deficiency, other], description: Why a credit or debit note was raised }
        noteGst:
          type: string
          enum: [withGst, noGst]
          description: >-
            A direct note's GST treatment (no sourceDocumentId; RULES 6.24). withGst (the default) is a
            s.34 note: it names the original invoice or bill (originalNumber, originalDate), goes to
            GSTR-1 CDNR/CDNUR and, for a credit note, must be issued by 30 November after the end of
            the original invoice's financial year (422 NOTE_TIME_BARRED). noGst is a financial or
            commercial note: no tax on any line, posted to discount allowed (or received), and left
            out of GSTR-1 and GSTR-3B.
        originalNumber: { type: string, maxLength: 40, description: 'A direct note with GST: the number of the original invoice or bill it adjusts' }
        originalDate: { type: string, format: date, description: 'A direct note with GST: the date of the original invoice or bill' }
        costCentreId: { type: string, description: The project or department it belongs to }
        vehicleId: { type: string, description: The vehicle it moved on }
        tcsSection: { type: string, enum: [none, scrap, liquor, tenduLeaves, timberLease, timberOther, forestProduce, minerals, motorVehicle, luxuryGoods], description: 'On an invoice: the TCS section (s.206C) the sale falls under, or none. The rate follows the section, higher when the buyer has no PAN; a 206C(1F) sale collects only over ₹10 lakh.' }
        tdsSection: { type: string, enum: [none, 194C, 194JA, 194JB, 194H, 194IA, 194IB, 194A, 194Q], writeOnly: true, description: "On a supplier's bill or debit note: the TDS section, or none. Defaults to the supplier's; worked out only for a company with a TAN. On an invoice: the section the customer will deduct TDS under (expected TDS, not posted), or none; defaults to the party's." }
        tdsRate: { type: number, minimum: 0, maximum: 100, writeOnly: true, description: "On an invoice: the rate the customer will deduct at, percent. Defaults to the section's rate for the company's PAN." }
        overrideCreditLimit: { type: boolean, writeOnly: true, description: 'Finalise an invoice even though it takes the customer past their credit limit; without it that is 422 CREDIT_LIMIT_EXCEEDED.' }
        status:
          allOf: [{ $ref: '#/components/schemas/DocStatus' }]
          default: draft
          description: >-
            A non-draft value creates and finalises in one step. On create only
            draft, issued, sent, confirmed, delivered, received and approved are
            accepted; paid, partiallyPaid and overdue are derived by the server
            (422 STATUS_DERIVED). The enum is the full DocStatus so that
            BusinessDocument, which extends this schema, can carry any status.
    BusinessDocument:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - $ref: '#/components/schemas/NewDocumentInput'
        - type: object
          properties:
            id: { type: string, readOnly: true }
            companyId: { type: string, readOnly: true }
            number: { type: string, readOnly: true, example: INV/25-26/MUM/0042 }
            status: { $ref: '#/components/schemas/DocStatus' }
            totals: { $ref: '#/components/schemas/DocumentTotals' }
            partyGstin: { type: string, readOnly: true, description: "The party's GSTIN when the document was finalised" }
            tds: { allOf: [{ $ref: '#/components/schemas/TdsDeduction' }], description: 'TDS deducted on the bill: what is owed the supplier is the grand total less this' }
            tdsExpected: { allOf: [{ $ref: '#/components/schemas/TdsDeduction' }], description: 'On an invoice: TDS the customer is expected to deduct (on the taxable value, without GST). Not posted and not settled: the receipt that allocates to the invoice records what was deducted. The grand total is unchanged.' }
            selfInvoiceNumber: { type: string, readOnly: true, description: 'The self-invoice for a reverse-charge purchase from an unregistered supplier (Rule 46(f))' }
            itcReversedOn: { type: string, format: date, readOnly: true, description: 'Input tax credit reversed after 180 days unpaid' }
            itcReclaimedOn: { type: string, format: date, readOnly: true, description: 'Credit claimed again once paid' }
            itcClaimPeriod: { type: string, readOnly: true, description: 'The GSTR-2B period (MMYYYY) whose line this bill matched; its credit is claimed in that return' }
            partyStateCode: { type: string, readOnly: true }
            recurrence: { type: string, enum: [none, weekly, monthly, quarterly, yearly], readOnly: true, description: Set with setDocumentRecurrence }
            tcs:
              type: object
              readOnly: true
              description: TCS collected on the sale; the amount is totals.tcs
              properties:
                section: { type: string }
                rate: { type: number }
            nextRecurrenceDate: { type: string, format: date, readOnly: true, description: The date of the next copy; unset once the series has ended }
            recurrenceEndDate: { type: string, format: date, readOnly: true }
            recurrenceAutoSend: { type: boolean, readOnly: true }
            recurringParentId: { type: string, readOnly: true, description: "On a copy, the recurring invoice it was issued from" }
            printLayout: { type: string, enum: [standard, classic, detailed, modern], readOnly: true, description: "This document's own printed layout, over the company's invoiceTemplate.layout; unset takes the company's. Set with setDocumentPrintLayout" }
            approval:
              type: object
              readOnly: true
              description: 'Set when the document was sent for approval: it stays a draft until an owner or admin approves it (which issues it) or rejects it'
              properties:
                status: { type: string, enum: [pending, approved, rejected] }
                requestedBy: { type: string }
                requestedAt: { type: string, format: date-time }
                decidedBy: { type: string }
                decidedAt: { type: string, format: date-time }
                note: { type: string }
            compliance: { $ref: '#/components/schemas/ComplianceInfo' }
            createdBy: { type: string, readOnly: true }
            editable:
              type: boolean
              readOnly: true
              description: >-
                On an invoice: whether it can be edited in full. A draft always can; an issued one only
                while it is the latest in its series, with nothing allocated, applied or raised against
                it, no IRN or e-way bill, and its GSTR-1 month and books period open (RULES 6.23).
                Unset on other kinds.
            editBlock:
              type: string
              readOnly: true
              enum: [notInvoice, notFinal, periodLocked, notLatest, hasPayments, hasCredit, hasNotes, eInvoiced, ewayBill, returnFiled, laterStock]
              description: Why an issued invoice can't be edited in full (editable false)
    CreditApplication:
      type: object
      description: A direct credit note applied to an invoice (or a supplier's to a bill), through adjustAdvances
      required: [id, noteId, noteNumber, documentId, documentNumber, amount, date]
      properties:
        id: { type: string }
        noteId: { type: string }
        noteNumber: { type: string }
        documentId: { type: string }
        documentNumber: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        date: { type: string, format: date }
    DocumentSummary:
      type: object
      description: Light row for lists
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/DocumentKind' }
        number: { type: string }
        status: { $ref: '#/components/schemas/DocStatus' }
        partyId: { type: string }
        partyName: { type: string }
        branchId: { type: string }
        date: { type: string, format: date }
        dueDate: { type: string, format: date }
        supplierDocNumber: { type: string, description: "On a purchase: the supplier's own number for it" }
        itcClaimPeriod: { type: string, description: The GSTR-2B period (MMYYYY) its credit was claimed in }
        grandTotal: { $ref: '#/components/schemas/Money' }
        exchangeRate: { type: number, description: To base currency }
        totalTax: { $ref: '#/components/schemas/Money' }
        outstanding: { $ref: '#/components/schemas/Money' }
        tdsExpected: { allOf: [{ $ref: '#/components/schemas/TdsDeduction' }], description: 'On an invoice: TDS the customer is expected to deduct (not settled)' }
        eInvoiceStatus: { $ref: '#/components/schemas/EInvoiceStatus' }
        irn: { type: string, description: The IRN once one is issued }
        ewayBillStatus: { type: string, enum: [notApplicable, notRequired, pending, generated, cancelled, expired] }
    DocumentDetail:
      allOf:
        - $ref: '#/components/schemas/BusinessDocument'
        - type: object
          readOnly: true
          properties:
            party: { $ref: '#/components/schemas/Party' }
            allocated: { $ref: '#/components/schemas/Money' }
            outstanding: { $ref: '#/components/schemas/Money' }
            payments: { type: array, items: { $ref: '#/components/schemas/Payment' } }
            linkedDocuments: { type: array, items: { $ref: '#/components/schemas/DocumentSummary' } }
            allowedTransitions: { type: array, items: { $ref: '#/components/schemas/DocStatus' } }
            allowedConversions: { type: array, items: { $ref: '#/components/schemas/DocumentKind' } }
            creditApplications: { type: array, items: { $ref: '#/components/schemas/CreditApplication' }, description: 'Direct notes applied to this document, or (on a note) the documents it is applied to' }

    # ---------------------------------------------------------------- compliance
    EInvoiceStatus: { type: string, enum: [notApplicable, pending, generated, cancelled, failed] }
    CancelReasonCode: { type: string, enum: ['1', '2', '3', '4'], description: '1 duplicate, 2 data entry mistake, 3 order cancelled, 4 other' }
    ComplianceIssue:
      type: object
      properties:
        code: { type: string, description: NIC error code where one exists }
        field: { type: string, example: 'lines[2].hsnCode' }
        message: { type: string }
        severity: { type: string, enum: [blocking, warning] }
    ComplianceResult:
      type: object
      properties:
        ok: { type: boolean }
        issues: { type: array, items: { $ref: '#/components/schemas/ComplianceIssue' } }
    CancelRequest:
      type: object
      required: [reasonCode]
      properties:
        reasonCode: { $ref: '#/components/schemas/CancelReasonCode' }
        remark: { type: string, maxLength: 100 }
    ComplianceInfo:
      type: object
      readOnly: true
      properties:
        eInvoiceStatus: { $ref: '#/components/schemas/EInvoiceStatus' }
        eInvoiceDocType: { type: string, enum: [INV, CRN, DBN] }
        eInvoiceSupplyType: { type: string, enum: [B2B, SEZWP, SEZWOP, EXPWP, EXPWOP, DEXP] }
        irn: { type: string, pattern: '^[0-9a-f]{64}$' }
        ackNo: { type: string, pattern: '^[0-9]{16}$' }
        ackDate: { type: string, example: '2026-09-22 14:03:11' }
        signedQrPayload: { type: string, description: JWS compact serialisation }
        irnGeneratedAt: { type: string, format: date-time }
        irnCancelledAt: { type: string, format: date-time }
        irnCancelReasonCode: { $ref: '#/components/schemas/CancelReasonCode' }
        irnCancelRemark: { type: string }
        eInvoiceIssues: { type: array, items: { $ref: '#/components/schemas/ComplianceIssue' } }
        ewayBillStatus: { type: string, enum: [notApplicable, notRequired, pending, generated, cancelled, expired] }
        ewayBillId: { type: string }
        ewayBillNumber: { type: string }
        ewayBillValidUpto: { type: string, format: date-time }
        lastMessage: { type: string }
        lastAttemptAt: { type: string, format: date-time }
    EwayBillStatus: { type: string, enum: [active, expired, cancelled] }
    EwayPlace:
      type: object
      required: [legalName, gstin, address1, place, pincode, stateCode]
      properties:
        legalName: { type: string }
        gstin: { type: string, description: GSTIN or `URP` }
        address1: { type: string }
        address2: { type: string }
        place: { type: string }
        pincode: { type: string }
        stateCode: { type: string }
    NewEwayBillInput:
      type: object
      required: [documentId, subSupplyType, transactionType, from, to, transportMode, vehicleType, distanceKm]
      properties:
        documentId: { type: string }
        subSupplyType: { type: string, enum: [supply, export, jobWork, ownUse, jobWorkReturn, salesReturn, exhibition, lineSales, recipientNotKnown, others] }
        subSupplyDescription: { type: string, description: Required when `others` }
        transactionType: { type: integer, enum: [1, 2, 3, 4] }
        from: { $ref: '#/components/schemas/EwayPlace' }
        to: { $ref: '#/components/schemas/EwayPlace' }
        transporterId: { type: string }
        transporterName: { type: string }
        transportMode: { $ref: '#/components/schemas/TransportMode' }
        vehicleNumber: { type: string, example: MH04AB1234 }
        vehicleType: { $ref: '#/components/schemas/VehicleType' }
        transportDocNumber: { type: string }
        transportDocDate: { type: string, format: date }
        distanceKm: { type: integer, minimum: 0, maximum: 4000 }
    EwayBillPartBUpdate:
      type: object
      required: [mode, vehicleType, fromPlace, fromStateCode, reasonCode]
      properties:
        id: { type: string, readOnly: true }
        mode: { $ref: '#/components/schemas/TransportMode' }
        vehicleNumber: { type: string }
        vehicleType: { $ref: '#/components/schemas/VehicleType' }
        transportDocNumber: { type: string }
        transportDocDate: { type: string, format: date }
        fromPlace: { type: string }
        fromStateCode: { type: string }
        reasonCode: { type: string, enum: ['1', '2', '3', '4'], description: '1 first time, 2 breakdown, 3 transhipment, 4 others' }
        remark: { type: string }
        updatedAt: { type: string, format: date-time, readOnly: true }
        updatedBy: { type: string, readOnly: true }
    ExtendEwayBillInput:
      type: object
      required: [remainingDistanceKm, reasonCode, transitType, currentPlace, currentPincode, currentStateCode]
      properties:
        remainingDistanceKm: { type: integer, minimum: 1 }
        reasonCode: { type: string, enum: ['1', '2', '3', '4', '5'], description: '1 natural calamity, 2 law and order, 3 transhipment, 4 accident, 5 other' }
        remark: { type: string }
        transitType: { type: string, enum: [inTransit, inMovement] }
        currentPlace: { type: string }
        currentPincode: { type: string }
        currentStateCode: { type: string }
    EwayBillExtension:
      allOf:
        - $ref: '#/components/schemas/ExtendEwayBillInput'
        - type: object
          properties:
            id: { type: string }
            extendedAt: { type: string, format: date-time }
            extendedBy: { type: string }
            previousValidUpto: { type: string, format: date-time }
            newValidUpto: { type: string, format: date-time }
    EwayBill:
      type: object
      readOnly: true
      properties:
        id: { type: string }
        companyId: { type: string }
        branchId: { type: string }
        ewayBillNumber: { type: string, pattern: '^[0-9]{12}$' }
        documentId: { type: string }
        documentKind: { $ref: '#/components/schemas/DocumentKind' }
        documentNumber: { type: string }
        documentDate: { type: string, format: date }
        partyId: { type: string }
        docType: { type: string, enum: [INV, BIL, BOE, CHL, CNT, OTH] }
        supplyType: { type: string, enum: [outward, inward] }
        subSupplyType: { type: string }
        subSupplyDescription: { type: string }
        transactionType: { type: integer, enum: [1, 2, 3, 4] }
        from: { $ref: '#/components/schemas/EwayPlace' }
        to: { $ref: '#/components/schemas/EwayPlace' }
        consignmentValue: { $ref: '#/components/schemas/Money' }
        taxableValue: { $ref: '#/components/schemas/Money' }
        cgst: { $ref: '#/components/schemas/Money' }
        sgst: { $ref: '#/components/schemas/Money' }
        igst: { $ref: '#/components/schemas/Money' }
        mainHsnCode: { type: string }
        itemCount: { type: integer }
        transporterId: { type: string }
        transporterName: { type: string }
        transportMode: { $ref: '#/components/schemas/TransportMode' }
        vehicleNumber: { type: string }
        vehicleType: { $ref: '#/components/schemas/VehicleType' }
        transportDocNumber: { type: string }
        transportDocDate: { type: string, format: date }
        distanceKm: { type: integer }
        generatedAt: { type: string, format: date-time }
        generatedBy: { type: string }
        validFrom: { type: string, format: date-time }
        validUpto: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/EwayBillStatus' }
        cancelledAt: { type: string, format: date-time }
        cancelReasonCode: { $ref: '#/components/schemas/CancelReasonCode' }
        cancelRemark: { type: string }
        partBUpdates: { type: array, items: { $ref: '#/components/schemas/EwayBillPartBUpdate' } }
        extensions: { type: array, items: { $ref: '#/components/schemas/EwayBillExtension' } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # ---------------------------------------------------------------- money movement
    PaymentDirection: { type: string, enum: [received, paid] }
    PaymentMethod: { type: string, enum: [cash, bank, upi, card, cheque, wallet, other] }
    PaymentAllocation:
      type: object
      required: [documentId, amount]
      properties:
        documentId: { type: string }
        documentNumber: { type: string, readOnly: true }
        documentKind: { allOf: [{ $ref: '#/components/schemas/DocumentKind' }], readOnly: true }
        amount: { allOf: [{ $ref: '#/components/schemas/Money' }], description: 'Cash: what the payment itself settles; may be zero when an adjustment below settles the document' }
        tdsDeducted: { allOf: [{ $ref: '#/components/schemas/Money' }], description: 'Settled without cash: TDS the customer deducted, or the business deducted from a supplier' }
        discount: { allOf: [{ $ref: '#/components/schemas/Money' }], description: 'Settled without cash: a discount allowed or received' }
        writeOff: { allOf: [{ $ref: '#/components/schemas/Money' }], description: 'Settled without cash: written off as bad debt (owner, admin or accountant)' }
    PaymentRequest:
      type: object
      required: [id, status, payment, partyName, amount, requestedBy, requestedAt, version]
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        payment: { $ref: '#/components/schemas/Payment' }
        partyName: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        requestedBy: { type: string }
        requestedByName: { type: string }
        requestedAt: { type: string, format: date-time }
        decidedBy: { type: string }
        decidedByName: { type: string }
        decidedAt: { type: string, format: date-time }
        note: { type: string }
        paymentId: { type: string }
        version: { type: integer }
    AdjustmentAllocation:
      type: object
      required: [sourceType, sourceId, documentId, amount]
      properties:
        sourceType: { type: string, enum: [payment, note], description: 'payment: an advance (its unallocated part); note: a direct credit note applied to the document' }
        sourceId: { type: string }
        documentId: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
    Adjustable:
      type: object
      required: [credits, open]
      properties:
        credits:
          type: array
          description: Unadjusted advances and direct notes, oldest first
          items:
            type: object
            required: [sourceType, id, number, date, left]
            properties:
              sourceType: { type: string, enum: [payment, note] }
              id: { type: string }
              number: { type: string }
              date: { type: string, format: date }
              total: { $ref: '#/components/schemas/Money' }
              left: { $ref: '#/components/schemas/Money' }
              advanceTax: { type: boolean, description: A service advance taxed on receipt }
        open:
          type: array
          description: Documents still owed, oldest first
          items:
            type: object
            required: [documentId, number, kind, date, outstanding]
            properties:
              documentId: { type: string }
              number: { type: string }
              kind: { $ref: '#/components/schemas/DocumentKind' }
              date: { type: string, format: date }
              total: { $ref: '#/components/schemas/Money' }
              outstanding: { $ref: '#/components/schemas/Money' }
              hasServiceLines: { type: boolean, description: 'Has a line for a service (an item of type service, or a SAC code starting 99)' }
    Payment:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          required: [direction, partyId, date, amount, currency, method, accountId]
          properties:
            id: { type: string, readOnly: true }
            companyId: { type: string, readOnly: true }
            branchId: { type: string }
            number: { type: string, readOnly: true }
            direction: { $ref: '#/components/schemas/PaymentDirection' }
            partyId: { type: string }
            partyName: { type: string, readOnly: true, description: "The customer's or supplier's name, so a list needn't look each one up" }
            date: { type: string, format: date }
            amount: { $ref: '#/components/schemas/Money' }
            currency: { type: string }
            exchangeRate: { type: number }
            method: { $ref: '#/components/schemas/PaymentMethod' }
            reference: { type: string }
            accountId: { type: string }
            allocations: { type: array, items: { $ref: '#/components/schemas/PaymentAllocation' } }
            unallocated: { allOf: [{ $ref: '#/components/schemas/Money' }], readOnly: true }
            fxGainLoss: { allOf: [{ $ref: '#/components/schemas/Money' }], readOnly: true }
            advanceTax:
              type: object
              description: "A receipt that is an advance for services owes GST when received (s.13(2)), at this rate and place of supply; invoices raised against it later take the tax back (GSTR-1 table 11). Advances for goods carry none."
              required: [taxCategoryId, placeOfSupplyStateCode]
              properties:
                taxCategoryId: { type: string }
                rate: { type: number, readOnly: true, description: The rate on the day received }
                placeOfSupplyStateCode: { type: string, pattern: '^\d{2}$' }
                hsn: { type: string, pattern: '^\d{4,8}$', description: 'The SAC (or HSN) of the service the advance is for, for table 11 and the receipt voucher' }
                cessRate: { type: number, minimum: 0, description: 'Cess on the advance, percent of its value; the amount received includes it' }
            advanceTds: { allOf: [{ $ref: '#/components/schemas/Money' }], description: "On money received: TDS the customer deducted from an advance before any invoice, under `tdsSection`. It credits the customer as money would, so it adds to the advance." }
            tdsSection: { type: string, description: "The TDS section of what its allocations settled as tdsDeducted: on money paid, what was kept back (26Q and TDS payable); on money received, what the customer deducted (TDS receivable by section, matched to 26AS)" }
            refundOf:
              type: string
              description: "Money paid back to a customer (direction `paid`) out of the advance on this receipt: no allocations, no more than is left of that advance. Prints as the refund voucher (Rule 51); a service advance's tax comes back on its date."
            refunds:
              type: array
              readOnly: true
              description: On a receipt, what has been paid back out of it
              items:
                type: object
                required: [paymentId, date, amount]
                properties: { paymentId: { type: string }, number: { type: string }, date: { type: string, format: date }, amount: { $ref: '#/components/schemas/Money' } }
            source: { type: string, enum: [manual, gateway], readOnly: true }
            notes: { type: string }
            attachmentIds: { type: array, items: { type: string } }
            createdBy: { type: string, readOnly: true }
    # ---------------------------------------------------------------- banking
    BankLineStatus: { type: string, enum: [unmatched, matched, excluded] }
    BankMatchType: { type: string, enum: [payment, expense, voucher] }
    BankLineRecord:
      type: object
      description: A payment, expense or voucher in the books, as a bank line matches it. `amount` is signed as the bank sees it (+ money into the account).
      required: [type, id, date, amount]
      properties:
        type: { $ref: '#/components/schemas/BankMatchType' }
        id: { type: string }
        number: { type: string }
        date: { type: string, format: date }
        amount: { $ref: '#/components/schemas/Money' }
        reference: { type: string }
        partyName: { type: string }
    BankLineSuggestion:
      allOf:
        - $ref: '#/components/schemas/BankLineRecord'
        - type: object
          required: [score, referenceHit]
          properties:
            score: { type: integer, minimum: 0, maximum: 100 }
            referenceHit: { type: boolean, description: "The record's reference or number (a UTR, a cheque number) is in the line" }
    BankStatementLine:
      type: object
      required: [id, statementId, accountId, date, description, amount, status, version, createdAt, updatedAt]
      properties:
        id: { type: string }
        statementId: { type: string }
        accountId: { type: string }
        date: { type: string, format: date }
        description: { type: string }
        reference: { type: string }
        amount: { allOf: [{ $ref: '#/components/schemas/Money' }], description: '+ money into the account (a credit on the statement), − money out' }
        balance: { allOf: [{ $ref: '#/components/schemas/Money' }], description: The running balance the bank printed }
        status: { $ref: '#/components/schemas/BankLineStatus' }
        excludedReason: { type: string }
        match: { $ref: '#/components/schemas/BankLineRecord' }
        suggestions: { type: array, maxItems: 3, items: { $ref: '#/components/schemas/BankLineSuggestion' } }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BankStatement:
      type: object
      required: [id, accountId, fileName, from, to, lineCount, createdBy, createdAt]
      properties:
        id: { type: string }
        accountId: { type: string }
        fileName: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        openingBalance: { $ref: '#/components/schemas/Money' }
        closingBalance: { $ref: '#/components/schemas/Money' }
        lineCount: { type: integer, description: Lines it added (duplicates are not counted) }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    BankStatementImport:
      type: object
      required: [fileName, lines]
      properties:
        fileName: { type: string, minLength: 1, maxLength: 200 }
        dryRun: { type: boolean, default: false }
        lines:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: object
            required: [date, description, amount]
            properties:
              date: { type: string, format: date }
              description: { type: string, maxLength: 1000 }
              reference: { type: string, description: Cut to 100 characters }
              amount: { allOf: [{ $ref: '#/components/schemas/Money' }], description: '+ money in, − money out; not zero' }
              balance: { $ref: '#/components/schemas/Money' }
    BankStatementImportResult:
      type: object
      required: [imported, duplicates, autoMatched, lines]
      properties:
        statement: { $ref: '#/components/schemas/BankStatement' }
        imported: { type: integer }
        duplicates: { type: integer }
        autoMatched: { type: integer }
        lines:
          type: array
          description: The file's lines in its order, each flagged when it was already imported (or repeats an earlier line of this file with no running balance to tell them apart)
          items:
            type: object
            required: [date, description, amount, duplicate]
            properties:
              date: { type: string, format: date }
              description: { type: string }
              reference: { type: string }
              amount: { $ref: '#/components/schemas/Money' }
              balance: { $ref: '#/components/schemas/Money' }
              duplicate: { type: boolean }
    BankLineSummary:
      type: object
      required: [unmatched, matched, excluded]
      properties:
        unmatched: { type: integer }
        matched: { type: integer }
        excluded: { type: integer }
        lastStatement: { $ref: '#/components/schemas/BankStatement' }
        statementBalance: { allOf: [{ $ref: '#/components/schemas/Money' }], description: The running balance on the latest line that has one }
        statementBalanceDate: { type: string, format: date }
    BankReconciliation:
      type: object
      description: |
        Bank reconciliation statement. `adjustedBookBalance` = book balance + lines the books
        don't have yet (credits − debits). `adjustedStatementBalance` = statement balance +
        deposits not yet credited − payments not yet debited. They agree (`difference` 0) when
        every difference is explained. Records dated before the account's first imported
        statement (`since`) are taken as cleared.
      required: [asOf, bookBalance, adjustedBookBalance, unclearedPayments, unrecordedLines]
      properties:
        asOf: { type: string, format: date }
        since: { type: string, format: date, description: First day of the earliest statement imported }
        bookBalance: { $ref: '#/components/schemas/Money' }
        statementBalance: { allOf: [{ $ref: '#/components/schemas/Money' }], description: The running balance on the last line on or before `asOf` that has one; absent when none does }
        statementBalanceDate: { type: string, format: date }
        unclearedPayments:
          type: object
          description: In the books, on or before `asOf`, matched to no line
          required: [deposits, payments, depositsTotal, paymentsTotal]
          properties:
            deposits: { type: array, description: Deposited but not yet credited by the bank, items: { $ref: '#/components/schemas/BankLineRecord' } }
            payments: { type: array, description: Paid but not yet debited by the bank, items: { $ref: '#/components/schemas/BankLineRecord' } }
            depositsTotal: { $ref: '#/components/schemas/Money' }
            paymentsTotal: { allOf: [{ $ref: '#/components/schemas/Money' }], description: As a positive amount }
        unrecordedLines:
          type: object
          description: On the statement, on or before `asOf`, neither matched nor excluded
          required: [credits, debits, creditsTotal, debitsTotal]
          properties:
            credits: { type: array, items: { $ref: '#/components/schemas/BankStatementLine' } }
            debits: { type: array, items: { $ref: '#/components/schemas/BankStatementLine' } }
            creditsTotal: { $ref: '#/components/schemas/Money' }
            debitsTotal: { allOf: [{ $ref: '#/components/schemas/Money' }], description: As a positive amount }
        adjustedBookBalance: { $ref: '#/components/schemas/Money' }
        adjustedStatementBalance: { $ref: '#/components/schemas/Money' }
        difference: { allOf: [{ $ref: '#/components/schemas/Money' }], description: adjustedBookBalance − adjustedStatementBalance }
    Expense:
      allOf:
        - $ref: '#/components/schemas/Versioned'
        - type: object
          required: [categoryId, date, amount, currency, accountId, method]
          properties:
            id: { type: string, readOnly: true }
            recoveredBy:
              type: object
              readOnly: true
              description: The live invoice that recovered it as a reimbursement line
              properties: { documentId: { type: string }, number: { type: string } }
            companyId: { type: string, readOnly: true }
            branchId: { type: string }
            number: { type: string, readOnly: true }
            categoryId: { type: string }
            supplierId: { type: string }
            date: { type: string, format: date }
            amount: { $ref: '#/components/schemas/Money' }
            currency: { type: string }
            exchangeRate: { type: number }
            taxCategoryId: { type: string }
            taxAmount: { $ref: '#/components/schemas/Money' }
            taxInclusive: { type: boolean }
            placeOfSupplyStateCode: { type: string, description: "Decides CGST+SGST or IGST; defaults to the company's state" }
            supplierGstin: { type: string, description: "The supplier's GSTIN on the bill, when there's no saved supplier" }
            itcEligibility: { type: string, enum: [eligible, blocked, ineligible], description: Unset reads as eligible }
            reverseCharge: { type: boolean, description: "The business pays this tax itself under reverse charge; amount is then the supplier's price without it" }
            accountId: { type: string }
            method: { $ref: '#/components/schemas/PaymentMethod' }
            reference: { type: string }
            notes: { type: string }
            billable: { type: boolean }
            customerId: { type: string, description: 'Billable: the customer it is recovered from, as a reimbursement line on their invoice' }
            costCentreId: { type: string }
            vehicleId: { type: string, description: The vehicle it was spent on }
            recurrence: { type: string, enum: [none, weekly, monthly, quarterly, yearly] }
            nextRecurrenceDate: { type: string, format: date, readOnly: true }
            attachmentIds: { type: array, items: { type: string } }
            createdBy: { type: string, readOnly: true }
    StockMovementType: { type: string, enum: [opening, purchaseReceipt, salesIssue, salesReturn, purchaseReturn, transferIn, transferOut, adjustment] }
    StockMovement:
      type: object
      readOnly: true
      properties:
        id: { type: string }
        companyId: { type: string }
        branchId: { type: string }
        itemId: { type: string }
        itemName: { type: string, description: "On lists: the item's name, so a list needn't look each one up" }
        itemSku: { type: string, description: "On lists: the item's SKU" }
        type: { $ref: '#/components/schemas/StockMovementType' }
        quantity: { type: number }
        unitCost: { $ref: '#/components/schemas/Money' }
        date: { type: string, format: date }
        referenceId: { type: string }
        referenceNumber: { type: string }
        notes: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }

    # ---------------------------------------------------------------- supporting
    Attachment:
      type: object
      properties:
        id: { type: string, readOnly: true }
        companyId: { type: string, readOnly: true }
        name: { type: string }
        mimeType: { type: string }
        size: { type: integer }
        uri: { type: string, format: uri, readOnly: true, description: 'Signed, short-lived' }
        status: { type: string, enum: [pending, ready], readOnly: true }
        entityType: { type: string }
        entityId: { type: string }
        uploadedAt: { type: string, format: date-time, readOnly: true }
    OcrExtraction:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [queued, processing, completed, failed] }
        attachmentId: { type: string }
        kind: { type: string, enum: [expense, purchaseBill] }
        fields:
          type: array
          items:
            type: object
            properties:
              key: { type: string, enum: [vendor, gstin, date, amount, tax, reference, category] }
              label: { type: string }
              value: { type: string }
              confidence: { type: number, minimum: 0, maximum: 1, description: Values below 0.75 are flagged for review }
        lines:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              quantity: { type: number }
              unitPrice: { type: number }
              confidence: { type: number }
              matchedItemId: { type: string }
        matchedPartyId: { type: string }
        error: { type: string }
    AppNotification:
      type: object
      properties:
        id: { type: string }
        companyId: { type: string }
        kind: { type: string, enum: [invoiceSent, paymentReceived, invoiceOverdue, lowStock, compliance, syncFailure, system] }
        title: { type: string }
        body: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
    AuditEvent:
      type: object
      properties:
        id: { type: string }
        companyId: { type: string }
        actorId: { type: string }
        actorName: { type: string }
        action: { type: string, example: marked sent }
        entityType: { type: string }
        entityId: { type: string }
        entityLabel: { type: string }
        before: { type: string }
        after: { type: string }
        device: { type: string }
        createdAt: { type: string, format: date-time }
    # ---------------------------------------------------------------- platform (operators)
    PlatformRole: { type: string, enum: [superadmin, support] }
    PlatformReason:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500, description: Why; kept in the platform audit log }
    PlatformRoleChange:
      type: object
      required: [platformRole, reason]
      properties:
        platformRole: { oneOf: [{ $ref: '#/components/schemas/PlatformRole' }, { type: 'null' }], description: '`null` removes platform access' }
        reason: { type: string, minLength: 3, maxLength: 500, description: Why; kept in the platform audit log }
    PlatformAccount:
      type: object
      required: [id, name, status, companyCount, userCount, plans, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        ownerUserId: { type: [string, 'null'] }
        ownerName: { type: [string, 'null'] }
        ownerEmail: { type: [string, 'null'] }
        status: { type: string, enum: [active, suspended] }
        suspendedAt: { type: [string, 'null'], format: date-time }
        suspendedReason: { type: [string, 'null'] }
        companyCount: { type: integer }
        userCount: { type: integer }
        plans: { type: array, description: Distinct plans across the account's companies, items: { $ref: '#/components/schemas/PlanTier' } }
        lastActiveAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    PlatformCompany:
      type: object
      required: [id, accountId, name, country, plan, subscriptionStatus, createdAt]
      properties:
        id: { type: string }
        accountId: { type: string }
        name: { type: string }
        legalName: { type: [string, 'null'] }
        country: { type: string }
        city: { type: string }
        taxIdentifier: { type: [string, 'null'] }
        plan: { $ref: '#/components/schemas/PlanTier' }
        subscriptionStatus: { type: string, enum: [active, trialing, pastDue, cancelled, none] }
        onboardingCompletedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    PlatformUser:
      type: object
      required: [id, accountId, name, email, role, status, accountSuspended, createdAt]
      properties:
        id: { type: string }
        accountId: { type: string }
        accountName: { type: string }
        name: { type: string }
        email: { type: string }
        phone: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/UserRole' }
        platformRole: { oneOf: [{ $ref: '#/components/schemas/PlatformRole' }, { type: 'null' }] }
        status: { type: string, enum: [active, invited, disabled] }
        accountSuspended: { type: boolean }
        lastActiveAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    PlatformAccountDetail:
      type: object
      required: [account, companies, users]
      properties:
        account: { $ref: '#/components/schemas/PlatformAccount' }
        companies: { type: array, items: { $ref: '#/components/schemas/PlatformCompany' } }
        users: { type: array, items: { $ref: '#/components/schemas/PlatformUser' } }
    PlatformCompanyDetail:
      type: object
      required: [company, accountName, subscription, planHistory, documentCounts, userCount]
      properties:
        company: { $ref: '#/components/schemas/PlatformCompany' }
        accountName: { type: string }
        accountSuspended: { type: boolean }
        subscription: { oneOf: [{ $ref: '#/components/schemas/Subscription' }, { type: 'null' }] }
        planHistory:
          type: array
          items:
            type: object
            required: [id, event, createdAt]
            properties:
              id: { type: string }
              fromPlan: { oneOf: [{ $ref: '#/components/schemas/PlanTier' }, { type: 'null' }] }
              toPlan: { oneOf: [{ $ref: '#/components/schemas/PlanTier' }, { type: 'null' }] }
              event: { type: string }
              createdAt: { type: string, format: date-time }
        documentCounts:
          type: array
          items:
            type: object
            required: [kind, count]
            properties:
              kind: { type: string }
              count: { type: integer }
        userCount: { type: integer }
        aiCost:
          type: array
          description: What this company's AI use cost the platform, by month (India time), newest first, the last six months with any use.
          items:
            type: object
            required: [month, actions, inputTokens, outputTokens, costUsd]
            properties:
              month: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
              actions: { type: integer, description: Lixi messages and bill scans counted against the allowance }
              inputTokens: { type: integer }
              outputTokens: { type: integer }
              costUsd: { type: number, description: 'As the provider reported it; 0 where it reports none (Anthropic, most non-OpenRouter servers)' }
    PlatformPlanOverride:
      type: object
      required: [plan, reason]
      properties:
        plan: { $ref: '#/components/schemas/PlanTier' }
        status: { type: string, enum: [active, trialing], description: Defaults to active }
        cycle: { type: string, enum: [monthly, yearly], description: 'Defaults to the current cycle, else monthly' }
        currentPeriodEnd: { type: [string, 'null'], format: date-time, description: 'Shown as the end of the current period. Nothing downgrades automatically when it passes; omit or null for open-ended' }
        reason: { type: string, minLength: 3, maxLength: 500 }
    PlatformOverview:
      type: object
      required: [from, to, totals, plans, signups, documents]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        totals:
          type: object
          required: [accounts, suspendedAccounts, companies, users, activeUsers30d]
          properties:
            accounts: { type: integer }
            suspendedAccounts: { type: integer }
            companies: { type: integer }
            users: { type: integer }
            activeUsers30d: { type: integer, description: Users seen in the 30 days up to now }
        plans:
          type: array
          description: Companies per plan, every tier listed
          items:
            type: object
            required: [plan, companies]
            properties:
              plan: { $ref: '#/components/schemas/PlanTier' }
              companies: { type: integer }
        signups:
          type: array
          description: One row per day in the range, zero-filled
          items:
            type: object
            required: [date, accounts, companies]
            properties:
              date: { type: string, format: date }
              accounts: { type: integer }
              companies: { type: integer }
        documents:
          type: array
          description: Documents created per day in the range, zero-filled
          items:
            type: object
            required: [date, count]
            properties:
              date: { type: string, format: date }
              count: { type: integer }
    DeleteAccountRequest:
      type: object
      required: [confirm]
      description: Proof it's really them, as at sign-in. The password if they have one, otherwise a fresh code sent to their verified phone.
      properties:
        confirm: { type: string, enum: [DELETE], description: Typed by the user }
        password: { type: string, format: password }
        otpRequestId: { type: string }
        otpCode: { type: string }
    NotificationPreferences:
      type: object
      required: [pushMuted]
      properties:
        pushMuted:
          type: array
          description: Kinds not pushed to this person's devices
          items: { type: string, enum: [invoiceSent, paymentReceived, invoiceOverdue, lowStock, compliance, syncFailure, system] }
    PrivacyPreferences:
      type: object
      required: [shareUsageData]
      properties:
        shareUsageData:
          type: boolean
          description: Anonymous usage events and error reports go to product analytics (never amounts, names or tax numbers)
    MfaStatus:
      type: object
      required: [enrolled, verified, recoveryCodesLeft]
      properties:
        enrolled: { type: boolean, description: An authenticator is set up }
        verified: { type: boolean, description: This session passed it }
        recoveryCodesLeft: { type: integer }
    MfaEnrollment:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret: { type: string, description: 'Base32, for typing into the app by hand' }
        otpauthUri: { type: string, description: What the QR code holds }
    MfaCode:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 6, maxLength: 20, description: 'Six digits from the app, or a recovery code' }
    MfaRecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes: { type: array, items: { type: string } }
    PlatformAuditEvent:
      type: object
      required: [id, actorId, actorEmail, action, targetType, targetId, targetLabel, reason, createdAt]
      properties:
        id: { type: string }
        actorId: { type: string }
        actorEmail: { type: string }
        action: { type: string, example: account.suspend }
        targetType: { type: string, enum: [account, company, user] }
        targetId: { type: string }
        targetLabel: { type: string }
        reason: { type: string }
        before: { type: string, description: JSON snapshot }
        after: { type: string, description: JSON snapshot }
        ipAddress: { type: string }
        createdAt: { type: string, format: date-time }
    Integration:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        icon: { type: string }
        category: { type: string, enum: [payments, compliance, messaging, accounting, storage] }
        connected: { type: boolean }
        available: { type: boolean, description: 'False while the integration is coming soon: connecting it is refused (409 INTEGRATION_COMING_SOON).' }
        configRoute: { type: string }
    ExportJob:
      type: object
      properties:
        id: { type: string }
        format: { type: string, enum: [json-backup, csv-zip, tally-xml] }
        status: { type: string, enum: [queued, running, completed, failed] }
        downloadUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    SyncMutation:
      type: object
      required: [id, method, path, queuedAt]
      properties:
        id: { type: string, description: Client queue entry id; also the idempotency key }
        method: { type: string, enum: [POST, PUT, PATCH, DELETE] }
        path: { type: string, example: /companies/cmp_vertex/documents }
        body: { type: object }
        baseVersion: { type: integer }
        clientEntityId: { type: string, description: Temporary id minted offline; the server maps it to the real one }
        queuedAt: { type: string, format: date-time }

    # ---------------------------------------------------------------- reports
    MonthValue:
      type: object
      properties:
        key: { type: string, example: 2026-09 }
        value: { $ref: '#/components/schemas/Money' }
    SummaryRow:
      type: object
      properties:
        label: { type: string }
        value: { $ref: '#/components/schemas/Money' }
        count: { type: integer }
    TransactionSummary:
      type: object
      properties:
        total: { $ref: '#/components/schemas/Money' }
        taxable: { $ref: '#/components/schemas/Money' }
        tax: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        count: { type: integer }
        byMonth: { type: array, items: { $ref: '#/components/schemas/MonthValue' } }
        byParty: { type: array, items: { $ref: '#/components/schemas/SummaryRow' } }
        byItem: { type: array, items: { $ref: '#/components/schemas/SummaryRow' } }
        byBranch: { type: array, items: { $ref: '#/components/schemas/SummaryRow' } }
        documents: { type: array, items: { $ref: '#/components/schemas/DocumentSummary' } }
    ExpenseSummary:
      type: object
      properties:
        total: { $ref: '#/components/schemas/Money' }
        tax: { $ref: '#/components/schemas/Money' }
        count: { type: integer }
        byCategory: { type: array, items: { $ref: '#/components/schemas/SummaryRow' } }
        byMonth: { type: array, items: { $ref: '#/components/schemas/MonthValue' } }
        expenses: { type: array, items: { $ref: '#/components/schemas/Expense' } }
    AgingReport:
      type: object
      properties:
        asOf: { type: string, format: date }
        total: { $ref: '#/components/schemas/Money' }
        overdue: { $ref: '#/components/schemas/Money' }
        dueSoon: { $ref: '#/components/schemas/Money', description: Not yet overdue and due within seven days }
        buckets:
          type: array
          items:
            type: object
            properties:
              key: { type: string, enum: [current, d1_30, d31_60, d61_90, d90plus] }
              amount: { $ref: '#/components/schemas/Money' }
              count: { type: integer }
        byParty:
          type: array
          items:
            type: object
            properties:
              partyId: { type: string }
              partyName: { type: string }
              outstanding: { $ref: '#/components/schemas/Money' }
              oldestDaysOverdue: { type: integer }
        documents:
          type: array
          items:
            type: object
            properties:
              document: { $ref: '#/components/schemas/DocumentSummary' }
              allocated: { $ref: '#/components/schemas/Money' }
              outstanding: { $ref: '#/components/schemas/Money' }
              daysOverdue: { type: integer }
              bucket: { type: string, enum: [current, d1_30, d31_60, d61_90, d90plus] }
    StockReport:
      type: object
      properties:
        rows:
          type: array
          items:
            type: object
            properties:
              item: { $ref: '#/components/schemas/Item' }
              onHand: { type: number }
              value: { $ref: '#/components/schemas/Money' }
              low: { type: boolean }
        totalValue: { $ref: '#/components/schemas/Money' }
        lowCount: { type: integer }
        outCount: { type: integer }
        trackedCount: { type: integer }
    TaxSummaryRow:
      type: object
      properties:
        rate: { type: number }
        taxable: { $ref: '#/components/schemas/Money' }
        cgst: { $ref: '#/components/schemas/Money' }
        sgst: { $ref: '#/components/schemas/Money' }
        igst: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
    TaxSummary:
      type: object
      properties:
        outward: { type: array, items: { $ref: '#/components/schemas/TaxSummaryRow' } }
        inward: { type: array, items: { $ref: '#/components/schemas/TaxSummaryRow' } }
        outwardTotal: { $ref: '#/components/schemas/Money' }
        inwardTotal: { $ref: '#/components/schemas/Money' }
        netPayable: { $ref: '#/components/schemas/Money' }
    PaymentSummary:
      type: object
      properties:
        received: { $ref: '#/components/schemas/Money' }
        paid: { $ref: '#/components/schemas/Money' }
        net: { $ref: '#/components/schemas/Money' }
        byMethod: { type: array, items: { $ref: '#/components/schemas/SummaryRow' } }
        byAccount: { type: array, items: { $ref: '#/components/schemas/SummaryRow' } }
        byMonth:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              received: { $ref: '#/components/schemas/Money' }
              paid: { $ref: '#/components/schemas/Money' }
        payments: { type: array, items: { $ref: '#/components/schemas/Payment' } }
    ProfitSnapshot:
      type: object
      description: 'The books'' profit and loss (core `profitFigures`): revenue and cost of goods are the trading account, so gross profit is the books'' gross profit; other income and expenses are the indirect side'
      properties:
        revenue: { $ref: '#/components/schemas/Money' }
        costOfGoods: { $ref: '#/components/schemas/Money' }
        grossProfit: { $ref: '#/components/schemas/Money' }
        otherIncome: { $ref: '#/components/schemas/Money' }
        expenses: { $ref: '#/components/schemas/Money' }
        netProfit: { $ref: '#/components/schemas/Money' }
        margin: { type: number }
        byMonth:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              revenue: { $ref: '#/components/schemas/Money' }
              cost: { $ref: '#/components/schemas/Money' }
              otherIncome: { $ref: '#/components/schemas/Money' }
              expenses: { $ref: '#/components/schemas/Money' }
              profit: { $ref: '#/components/schemas/Money' }
    Gstr1Row:
      type: object
      properties:
        documentId: { type: string }
        kind: { $ref: '#/components/schemas/DocumentKind' }
        table: { type: string, enum: [b2b, b2cl, b2cs, exp, cdnr, cdnur] }
        gstin: { type: string }
        partyName: { type: string }
        number: { type: string }
        date: { type: string, format: date }
        placeOfSupply: { type: string }
        placeOfSupplyName: { type: string }
        rate: { type: number }
        taxableValue: { $ref: '#/components/schemas/Money' }
        cgst: { $ref: '#/components/schemas/Money' }
        sgst: { $ref: '#/components/schemas/Money' }
        igst: { $ref: '#/components/schemas/Money' }
        invoiceValue: { $ref: '#/components/schemas/Money' }
        exported: { type: boolean, description: 'Set on an export, or a credit note against one' }
        originalNumber: { type: string, description: 'On a note: the invoice it adjusts, linked or (a direct note with GST) as entered on it' }
        originalDate: { type: string, format: date }
    HsnRow:
      type: object
      properties:
        hsnCode: { type: string }
        description: { type: string }
        unit: { type: string }
        quantity: { type: number }
        taxableValue: { $ref: '#/components/schemas/Money' }
        cgst: { $ref: '#/components/schemas/Money' }
        sgst: { $ref: '#/components/schemas/Money' }
        igst: { $ref: '#/components/schemas/Money' }
        totalValue: { $ref: '#/components/schemas/Money' }
    NilRow:
      type: object
      description: GSTR-1 table 8, one row per supply type
      properties:
        supplyType: { type: string, enum: [INTRB2B, INTRAB2B, INTRB2C, INTRAB2C] }
        nilRated: { $ref: '#/components/schemas/Money' }
        exempt: { $ref: '#/components/schemas/Money' }
        nonGst: { $ref: '#/components/schemas/Money' }
    DocIssueRow:
      type: object
      description: GSTR-1 table 13, one row per numbering series
      properties:
        nature: { type: string, enum: [invoice, creditNote, debitNote] }
        series: { type: string }
        from: { type: string }
        to: { type: string }
        total: { type: integer }
        cancelled: { type: integer }
    Gstr1AdvanceRow:
      type: object
      properties:
        placeOfSupply: { type: string }
        rate: { type: number }
        interState: { type: boolean }
        taxable: { $ref: '#/components/schemas/Money' }
        igst: { $ref: '#/components/schemas/Money' }
        cgst: { $ref: '#/components/schemas/Money' }
        sgst: { $ref: '#/components/schemas/Money' }
        cess: { $ref: '#/components/schemas/Money' }
    Gstr1Summary:
      type: object
      properties:
        period: { type: string }
        b2b: { type: array, items: { $ref: '#/components/schemas/Gstr1Row' } }
        b2cl: { type: array, items: { $ref: '#/components/schemas/Gstr1Row' } }
        b2cs: { type: array, items: { $ref: '#/components/schemas/Gstr1Row' } }
        exp: { type: array, items: { $ref: '#/components/schemas/Gstr1Row' } }
        cdnr: { type: array, items: { $ref: '#/components/schemas/Gstr1Row' } }
        cdnur: { type: array, items: { $ref: '#/components/schemas/Gstr1Row' } }
        hsn: { type: array, items: { $ref: '#/components/schemas/HsnRow' } }
        nil: { type: array, items: { $ref: '#/components/schemas/NilRow' } }
        docs: { type: array, items: { $ref: '#/components/schemas/DocIssueRow' } }
        advances:
          type: object
          description: 'Table 11: tax on advances for services received in the period and not yet invoiced (11A), and on earlier advances invoiced in it (11B)'
          properties:
            received: { type: array, items: { $ref: '#/components/schemas/Gstr1AdvanceRow' } }
            adjusted: { type: array, items: { $ref: '#/components/schemas/Gstr1AdvanceRow' } }
        totals:
          type: object
          properties:
            taxableValue: { $ref: '#/components/schemas/Money' }
            tax: { $ref: '#/components/schemas/Money' }
            invoiceValue: { $ref: '#/components/schemas/Money' }
            documents: { type: integer }
    Dashboard:
      type: object
      properties:
        sales: { $ref: '#/components/schemas/Money' }
        purchases: { $ref: '#/components/schemas/Money' }
        expenses: { $ref: '#/components/schemas/Money' }
        receivable: { $ref: '#/components/schemas/Money' }
        overdueReceivable: { $ref: '#/components/schemas/Money' }
        payable: { $ref: '#/components/schemas/Money' }
        cashBalance: { $ref: '#/components/schemas/Money' }
        salesTrend: { type: array, items: { $ref: '#/components/schemas/MonthValue' } }
        lowStockCount: { type: integer }
        pendingCompliance: { type: integer, description: Invoices awaiting IRN plus e-way bills expiring soon }
        recentDocuments: { type: array, items: { $ref: '#/components/schemas/DocumentSummary' } }
        unreadNotifications: { type: integer }
    DashboardPeriod:
      type: object
      description: The dates a hub's figures cover, and the period `previous` figures cover when compared
      required: [range, from, to, grain]
      properties:
        range: { type: string, enum: [today, week, month, quarter, year, custom] }
        from: { type: string, format: date }
        to: { type: string, format: date }
        grain: { type: string, enum: [day, week, month], description: 'The trend''s grain, after any step up' }
        previous:
          type: object
          required: [from, to]
          properties: { from: { type: string, format: date }, to: { type: string, format: date } }
    CashFlowPoint:
      type: object
      required: [key, inflow, outflow]
      properties:
        key: { type: string, description: 'The bucket: yyyy-mm-dd (a day, or a week''s Monday) or yyyy-mm' }
        inflow: { $ref: '#/components/schemas/Money' }
        outflow: { $ref: '#/components/schemas/Money' }
    StatusCount:
      type: object
      required: [status, count, total]
      properties:
        status: { $ref: '#/components/schemas/DocStatus' }
        count: { type: integer }
        total: { $ref: '#/components/schemas/Money' }
    PartyTotal:
      type: object
      required: [partyId, name, total]
      properties: { partyId: { type: string }, name: { type: string }, total: { $ref: '#/components/schemas/Money' } }
    ProfitFigures:
      type: object
      description: 'As the profit report works it out (core `profitFigures`, the books'' profit and loss): the trading account''s revenue less its cost of goods is gross profit; net profit adds other income and takes off indirect expenses'
      required: [revenue, costOfGoods, grossProfit, expenses, netProfit, margin]
      properties:
        revenue: { $ref: '#/components/schemas/Money' }
        costOfGoods: { $ref: '#/components/schemas/Money' }
        grossProfit: { $ref: '#/components/schemas/Money' }
        otherIncome: { $ref: '#/components/schemas/Money' }
        expenses: { $ref: '#/components/schemas/Money' }
        netProfit: { $ref: '#/components/schemas/Money' }
        margin: { type: number, description: Net profit as a percentage of revenue }
    MoneyMovement:
      type: object
      required: [id, kind, date, amount, label]
      properties:
        id: { type: string }
        kind: { type: string, enum: [received, paid, expense] }
        date: { type: string, format: date }
        amount: { $ref: '#/components/schemas/Money' }
        label: { type: string, description: 'The party, or the expense''s category' }
        accountName: { type: string }
    FilingDue:
      type: object
      required: [kind, period, due, optional, status]
      properties:
        kind: { type: string, enum: [gstr1, iff, gstr3b, pmt06, tds] }
        period: { type: string, description: 'MMYYYY for GST; yyyy-mm (the month deducted) for TDS' }
        gstin: { type: string, description: 'The registration it is for; absent for TDS' }
        due: { type: string, format: date }
        optional: { type: boolean, description: 'IFF is a choice under QRMP' }
        status: { type: string, enum: [filed, pending, overdue], description: 'Filed as recorded here; TDS is filed once the month''s deductions are deposited; PMT-06 shows pending or overdue only' }

    # ---------------------------------------------------------------- assistant
    LixiChatRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 40
          description: The conversation so far, oldest first, ending with the user's question.
          items:
            type: object
            required: [role, text]
            properties:
              role: { type: string, enum: [user, assistant] }
              text: { type: string, minLength: 1, maxLength: 4000 }
        locale: { type: string, description: 'Reply language, e.g. `en` or `ta`. Defaults to the user''s locale.' }
    LixiStat:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: string }
    LixiAction:
      type: object
      required: [type, label]
      properties:
        type: { type: string, enum: [route, document, ask] }
        label: { type: string }
        route: { type: string, description: 'App route, for `route`. Only routes the plan can open.' }
        kind: { $ref: '#/components/schemas/DocumentKind' }
        id: { type: string, description: 'Document id, for `document`' }
        question: { type: string, description: 'For `ask`' }
    LixiReply:
      type: object
      required: [text, stats, actions]
      properties:
        text: { type: string }
        stats: { type: array, items: { $ref: '#/components/schemas/LixiStat' } }
        actions: { type: array, items: { $ref: '#/components/schemas/LixiAction' } }
    LixiPendingAction:
      type: object
      required: [token, tool, summary, preview, expiresAt]
      properties:
        token: { type: string, description: Opaque; pass to lixiConfirmAction }
        tool: { type: string }
        summary: { type: string }
        preview: { type: object, additionalProperties: true }
        expiresAt: { type: string, format: date-time }
    LixiChatResponse:
      type: object
      required: [reply]
      properties:
        reply: { $ref: '#/components/schemas/LixiReply' }
        pendingAction: { $ref: '#/components/schemas/LixiPendingAction' }
    LixiConfirmResponse:
      type: object
      required: [reply, result]
      properties:
        reply: { $ref: '#/components/schemas/LixiReply' }
        result:
          type: object
          required: [entity]
          properties:
            entity: { type: string, enum: [document, payment, party, expense, message, reminder] }
            id: { type: string }
            kind: { type: string }
            number: { type: string }
