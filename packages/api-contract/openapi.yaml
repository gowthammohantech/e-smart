              required: [type, id]
              properties:
                type: { $ref: '#/components/schemas/BankMatchType' }
                id: { type: string }
      responses:
        '200':
          description: Matched
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankStatementLine' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [Banking]
      operationId: unmatchBankLine
      summary: Undo a line's match
      x-roles: [owner, admin, accountant]
      x-plan-module: books
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '200':
          description: Unmatched
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankStatementLine' }
  /companies/{companyId}/bank-lines/{id}/exclude:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Banking]
      operationId: excludeBankLine
      summary: Set a line aside as needing no record in the books
      x-roles: [owner, admin, accountant]
      x-plan-module: books
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Excluded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankStatementLine' }
  /companies/{companyId}/bank-lines/{id}/include:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Banking]
      operationId: includeBankLine
      summary: Bring an excluded line back, unmatched
      x-roles: [owner, admin, accountant]
      x-plan-module: books
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '200':
          description: Included
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankStatementLine' }
  /companies/{companyId}/bank-lines/{id}/payment:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Banking]
      operationId: createPaymentFromBankLine
      summary: Record the payment a line is, and match it
      description: |
        Money in is a payment received, money out a payment made, on the line's date, for its
        amount, through its account, with its reference. Same checks as
        `createPayment` (open period, party kind, allocations; money paid needs the payables module).
      x-roles: [owner, admin, accountant]
      x-plan-module: books
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partyId]
              properties:
                partyId: { type: string }
                method: { allOf: [{ $ref: '#/components/schemas/PaymentMethod' }], description: Defaults to bank }
                allocations: { type: array, items: { $ref: '#/components/schemas/PaymentAllocation' } }
                notes: { type: string }
      responses:
        '201':
          description: Recorded and matched
          content:
            application/json:
              schema:
                type: object
                required: [line, payment]
                properties:
                  line: { $ref: '#/components/schemas/BankStatementLine' }
                  payment: { $ref: '#/components/schemas/Payment' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /companies/{companyId}/bank-lines/{id}/expense:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Banking]
      operationId: createExpenseFromBankLine
      summary: Record a debit line as an expense, and match it
      description: Only money out (422 `NOT_MONEY_OUT`). The expense takes the line's date, amount, account and reference; needs the expenses module.
      x-roles: [owner, admin, accountant]
