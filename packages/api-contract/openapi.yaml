        - { name: kind, in: query, schema: { $ref: '#/components/schemas/PartyKind' } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { $ref: '#/components/parameters/Q' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [count, outstanding, overdue, advance]
                properties:
                  count: { type: integer }
                  outstanding: { $ref: '#/components/schemas/Money' }
                  overdue: { $ref: '#/components/schemas/Money' }
                  advance: { $ref: '#/components/schemas/Money' }
