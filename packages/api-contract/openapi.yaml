                narration: { type: string }
      responses:
        '201':
          description: Recorded and matched
          content:
            application/json:
              schema:
                type: object
                required: [line, voucher]
                properties:
                  line: { $ref: '#/components/schemas/BankStatementLine' }
                  voucher: { $ref: '#/components/schemas/Voucher' }
