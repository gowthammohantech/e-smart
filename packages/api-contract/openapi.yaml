    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Compliance]
      operationId: getComplianceSettings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComplianceSettings' }
    put:
