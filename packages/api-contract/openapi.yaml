          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComplianceSettings' }
  /companies/{companyId}/compliance-settings/credentials:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    put:
      tags: [Compliance]
      operationId: saveComplianceCredentials
      summary: Store IRP / EWB API credentials
      description: |
        Write-only. The portal username and password for the e-invoice (IRP) portal, the e-way bill portal, or both. The two
        logins can differ, so each is stored on its own. The server encrypts the password and never returns it; settings
        expose only the usernames. The GSP's own client id and secret are the server's (environment) and are never supplied.
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                portal: { type: string, enum: [einvoice, ewaybill, both], default: both, description: 'Which portal this login is for. `both` stores the same login for each.' }
                username: { type: string }
                password: { type: string, writeOnly: true }
      responses:
        '204': { description: Stored }
