        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemCategory' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /companies/{companyId}/item-categories/{id}:
    parameters:
      - { $ref: '#/components/parameters/CompanyId' }
      - { $ref: '#/components/parameters/Id' }
    put:
      tags: [Catalog]
