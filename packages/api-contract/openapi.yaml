    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    post:
      tags: [Compliance]
      operationId: testComplianceConnection
      summary: Authenticate against the IRP and the EWB portal with the stored credentials
      x-roles: [owner, admin]
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                type: object
                properties:
                  irp: { type: object, properties: { ok: { type: boolean }, message: { type: string } } }
                  ewb: { type: object, properties: { ok: { type: boolean }, message: { type: string } } }

