openapi: 3.1.0
info:
  title: Elixir Books Smart API
  version: 1.0.0-draft
  summary: Backend contract for taking the Elixir Books Smart app fully online.
  description: |
    Every action the app now performs against its local Zustand store
    (`src/store/appStore.ts`) has a matching endpoint here. The entity shapes
    mirror `src/types/index.ts`, so the client can swap the store's local
    writes for these calls without changing its domain model.

    ## Conventions
    - **Auth**: `Authorization: Bearer <accessToken>` on everything except `/auth/*`,
      `/plans` and `/reference/*`.
    - **Tenancy**: the path scopes business data to a company:
      `/companies/{companyId}/...`. The server checks that the caller's
      `User.companyIds` (and `branchIds`, when set) include it.
    - **Money** is always `{ minor: integer, currency: "INR" }`, in integer
      minor units. There are no floats (see `src/lib/money.ts`).
    - **Dates** are `YYYY-MM-DD`. **Timestamps** are ISO 8601 UTC.
    - **Server-owned fields** are marked `readOnly`. The client may send them,
      but the server ignores them: `id`, `companyId`, `number`, `totals`,
      `createdAt`, `createdBy`, `updatedAt`, `version`, compliance results.
    - **The server is the authority on calculation.** It recomputes document
      totals, tax splits, stock levels, outstanding amounts and document
      status with the same rules as `src/domain/*`. The client keeps its
      engines for instant previews.
    - **Numbering**: the server assigns document numbers when a document is
      finalised and never reuses one. Drafts carry `"<KIND>-DRAFT"`.
    - **Concurrency**: every mutable resource has a `version` and an `ETag`.
      Send `If-Match` on `PUT`/`PATCH`/`DELETE`. A stale write gets `412`.
    - **Idempotency**: send `Idempotency-Key` (a UUID) on every `POST`. Retries
      from the offline queue are then safe. Keys are kept for 24 hours.
    - **Pagination** is by cursor: `?limit=50&cursor=...` returns
      `{ data, nextCursor }`.
    - **App version**: the native apps send `X-App-Version` (e.g. `1.0.5`), the
      web app `web`. When the server's `MIN_APP_VERSION` is set, an older
      version, or a signed-in request with no version (the offline-first builds
      sent none), answers `426` with code `APP_UPDATE_REQUIRED` and
      `minVersion`. Requests without a session are served.
    - **Errors** use `application/problem+json` with a stable `code`. Validation
      failures and compliance rejections also carry `issues[]`, which has the
      same shape as `ComplianceIssue`.
    - **Plan gating**: a request to a module the company's plan does not include
      (see `src/domain/plan.ts`) returns `403` with code `PLAN_UPGRADE_REQUIRED`
      and `requiredPlan`.
    - **Roles**: owner > admin > accountant > sales > viewer. Each operation's
      `x-roles` lists the minimum roles that may call it.
    - **Platform operators**: `/admin/*` operations carry `x-platform-roles`
      instead and are open only to users with a platform role
      (`superadmin`, `support`). Tenant roles never grant them.
servers:
  - url: https://api.elixirbooks.example/v1
    description: Production
  - url: https://sandbox-api.elixirbooks.example/v1
    description: Sandbox (IRP / EWB sandbox, test payments)
security:
  - bearerAuth: []
tags:
  - { name: Auth, description: 'Sign-up, sign-in, OTP, tokens' }
  - { name: Me, description: 'Current user, profile, devices, push tokens' }
  - { name: Companies, description: 'Companies, branches, onboarding' }
  - { name: Books, description: 'The general ledger: accounts a business adds, and journal, contra, GST journal and TDS challan vouchers' }
  - { name: Users, description: 'Team members and invitations' }
  - { name: Billing, description: 'Plans and subscriptions' }
  - { name: Settings, description: 'Tax, expense categories, payment accounts, currencies, numbering, transporters' }
  - { name: Parties, description: 'Customers and suppliers' }
  - { name: Catalog, description: 'Items (goods and services)' }
  - { name: Documents, description: 'Quotes, orders, deliveries, invoices, returns, POs, receipts, bills' }
  - { name: Compliance, description: 'GST e-invoice (IRP) and e-way bills' }
  - { name: Payments, description: 'Payments received and made' }
  - { name: Banking, description: 'Bank statement import and reconciliation' }
  - { name: Expenses, description: 'Business expenses, recurring and billable' }
  - { name: Inventory, description: 'Stock levels, movements, adjustments, transfers' }
  - { name: Attachments, description: 'File uploads (receipts, logos, scans)' }
  - { name: OCR, description: 'Bill and receipt extraction' }
  - { name: Ledger, description: 'Receivables, payables, reminders' }
  - { name: Reports, description: 'The nine PRD reports, with CSV and PDF export' }
  - { name: GST, description: 'GSTR-1, GSTR-2B, GSTR-3B and the GST portal session they are filed through' }
  - { name: Dashboard, description: 'Home-tab summary' }
  - { name: Search, description: 'Global search' }
  - { name: Assistant, description: 'Lixi: answers from the books, and prepares writes for the user to confirm' }
  - { name: Notifications, description: 'In-app notification feed' }
  - { name: Audit, description: 'Read-only audit trail' }
  - { name: Integrations, description: 'Payments, messaging, accounting and storage connectors' }
  - { name: Exports, description: 'Backup and data export' }
  - { name: Sync, description: 'Offline queue push and pull' }
  - { name: Reference, description: 'Countries, states, cities, currencies, HSN, GSTIN lookup' }
  - { name: Platform, description: 'Cross-tenant operations for platform operators (`x-platform-roles`)' }

paths:
  # ------------------------------------------------------------------ Auth
  /auth/sign-up:
    post:
      tags: [Auth]
      operationId: signUp
      security: []
      summary: Create an account and its owner user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, maxLength: 120 }
                email: { type: string, format: email }
                phone: { type: string, description: E.164 }
                phoneVerificationId: { type: string, description: 'The `requestId` of an OTP just verified for a phone with no account (`PHONE_NOT_REGISTERED`). The account takes that phone, marked verified.' }
                password: { type: string, minLength: 8, writeOnly: true }
                locale: { type: string, example: en }
                termsVersion: { type: string, maxLength: 20, description: 'The terms and privacy policy version the person agreed to (the date on the pages, e.g. 2026-11-02); stored with when.' }
      responses:
        '201': { $ref: '#/components/responses/AuthSession' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /auth/sign-in:
    post:
      tags: [Auth]
      operationId: signIn
      x-demo-allowed: true
      security: []
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, writeOnly: true }
                device: { $ref: '#/components/schemas/DeviceInfo' }
      responses:
        '200': { $ref: '#/components/responses/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/otp/request:
    post:
      tags: [Auth]
      operationId: requestOtp
      security: []
      summary: Send a 6-digit sign-in code by SMS
      description: The prototype accepts `123456`. The real server sends the code through the SMS provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, description: E.164, example: '+919876543210' }
                channel: { type: string, enum: [sms, whatsapp], default: sms }
      responses:
        '200':
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string }
                  expiresInSeconds: { type: integer, example: 300 }
                  resendAfterSeconds: { type: integer, example: 30 }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyOtp
      security: []
      summary: Exchange an OTP for a session
      description: A correct code for a phone with no account answers 401 `PHONE_NOT_REGISTERED`; the code is then spent as proof of the phone, and the client continues to sign-up with `phoneVerificationId` set to this `requestId`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, code]
              properties:
                requestId: { type: string }
                code: { type: string, pattern: '^[0-9]{6}$' }
                device: { $ref: '#/components/schemas/DeviceInfo' }
      responses:
        '200': { $ref: '#/components/responses/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/password/forgot:
    post:
      tags: [Auth]
      operationId: forgotPassword
      security: []
      summary: Email a password-reset link
      description: Always returns 202, so the response does not reveal whether the email is registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Accepted }
  /auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8, writeOnly: true }
      responses:
        '204': { description: Password changed; all other sessions revoked }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/demo:
    get:
      tags: [Auth]
      operationId: getDemoLogin
      security: []
      summary: The public demo account's sign-in, for the "Give it a try" button
      description: |
        The demo account is read-only (every write from it is refused with 403
        DEMO_READ_ONLY), so its password is public. 404 when the demo is
        switched off (DEMO_ENABLED=false) or not seeded yet.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [email, password]
                properties:
                  email: { type: string, format: email }
                  password: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      x-demo-allowed: true
      security: []
      summary: Rotate the refresh token and issue a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200': { $ref: '#/components/responses/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/sign-out:
    post:
      tags: [Auth]
      operationId: signOut
      x-demo-allowed: true
      summary: Revoke the current device session
      # Cancelling at the authenticator prompt signs out; that must not need the authenticator.
      x-mfa-exempt: true
      responses:
        '204': { description: Signed out }

  # ------------------------------------------------------------------ Me
  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: The signed-in user, their account, and the companies they can reach
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
    patch:
      tags: [Me]
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                phone: { type: string }
                avatarColor: { type: string }
                locale: { type: string, enum: [en, ta] }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /me/mfa:
    get:
      tags: [Me]
      operationId: getMyMfa
      summary: Whether I have an authenticator app turned on, and whether this session has passed it
      x-mfa-exempt: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaStatus' }
    delete:
      tags: [Me]
      operationId: disableMyMfa
      summary: Turns my authenticator off, on a code from it or a recovery code
      x-mfa-exempt: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaCode' }
      responses:
        '204': { description: Turned off }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/mfa/enrollment:
    post:
      tags: [Me]
      operationId: startMyMfaEnrollment
      summary: A new authenticator secret to scan; replaces one not yet confirmed
      x-mfa-exempt: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaEnrollment' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/mfa/enrollment/confirm:
    post:
      tags: [Me]
      operationId: confirmMyMfaEnrollment
      summary: Turns the authenticator on with a code from it, passes this session, and returns the recovery codes, shown this once
      description: From then on every new session of mine is refused (403 MFA_REQUIRED) until it passes verifyMyMfa.
      x-mfa-exempt: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaCode' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaRecoveryCodes' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/mfa/verify:
    post:
      tags: [Me]
      operationId: verifyMyMfa
      summary: Passes this session with a code from my authenticator, or one unused recovery code
      x-mfa-exempt: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaCode' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/delete:
    post:
      tags: [Me]
      operationId: deleteMe
      summary: >-
        Deletes the caller's account (app store rule). Their name, email, phone and logins are erased and every
        session ends. Refused while they are the only owner of a business other people use (transfer ownership
        first), and for platform operators. When nobody else is on the account it is closed: the subscription is
        cancelled and the books are kept, unreadable, for the 8 years GST law requires, then erased.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteAccountRequest' }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/onboarding/complete:
    post:
      tags: [Me]
      operationId: completeOnboarding
      responses:
        '204': { description: Marked complete }
  /me/devices:
    get:
      tags: [Me]
      operationId: listDevices
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/DeviceSession' } }
  /me/devices/{deviceId}:
    delete:
      tags: [Me]
      operationId: revokeDevice
      summary: Sign a device out. Its refresh token is revoked at once.
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/notification-preferences:
    get:
      tags: [Me]
      operationId: getNotificationPreferences
      summary: Which kinds of notification this person gets on their phone (all of them still show in the app)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
    put:
      tags: [Me]
      operationId: saveNotificationPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferences' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /me/privacy-preferences:
    get:
      tags: [Me]
      operationId: getPrivacyPreferences
      summary: Whether this person shares anonymous usage data (product analytics and error reports)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacyPreferences' }
    put:
      tags: [Me]
      operationId: savePrivacyPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrivacyPreferences' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacyPreferences' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /me/push-tokens:
    post:
      tags: [Me]
      operationId: registerPushToken
      summary: Register an Expo / FCM / APNs push token for this device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, provider]
              properties:
                token: { type: string }
                provider: { type: string, enum: [expo, fcm, apns] }
      responses:
        '204': { description: Registered }
  /me/push-tokens/{token}:
    delete:
      tags: [Me]
      operationId: unregisterPushToken
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Removed }

  # ------------------------------------------------------------------ Companies
  /companies:
    get:
      tags: [Companies]
      operationId: listCompanies
      summary: The businesses the caller can open. Archived ones are left out unless `archived=true`, which lists only them.
      parameters:
        - { name: archived, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Company' } }
    post:
      tags: [Companies]
      operationId: createCompany
      summary: Create a company. Onboarding sends branches, tax and numbering in the same call.
      x-roles: [owner]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Company'
                - type: object
                  properties:
                    branches: { type: array, items: { $ref: '#/components/schemas/Branch' } }
                    numberingSeries: { type: array, items: { $ref: '#/components/schemas/NumberingSeries' } }
                    seedDefaults:
                      type: boolean
                      default: true
                      description: Create default tax categories, expense categories, a cash account and compliance settings for the country.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /companies/{companyId}:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Companies]
      operationId: getCompany
      responses:
        '200':
          description: OK
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
    put:
      tags: [Companies]
      operationId: saveCompany
      x-roles: [owner, admin]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Company' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /companies/{companyId}/archive:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    post:
      tags: [Companies]
      operationId: archiveCompany
      summary: >-
        Closes one business. Its subscription is cancelled now, it leaves everyone's business list, and its books
        turn read-only (exports still work) for the 8 years GST law requires, then are erased. An owner can restore
        it before then. Refused for the account's last business that is still open (409 LAST_COMPANY; delete the
        account instead), when the name doesn't match (422), or when the password or code is wrong (401 REAUTH_FAILED).
      x-roles: [owner]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArchiveCompanyRequest' }
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '502': { $ref: '#/components/responses/UpstreamError' }
  /companies/{companyId}/restore:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    post:
      tags: [Companies]
      operationId: restoreCompany
      summary: Opens an archived business again, on the free plan. Its books are as they were left.
      x-roles: [owner]
      x-archived-allowed: true
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
        '409': { $ref: '#/components/responses/Conflict' }
  /companies/{companyId}/logo:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    get:
      tags: [Companies]
      operationId: getCompanyLogo
      summary: The logo itself, for documents a device renders (its `logoUri` link expires within the hour, and a page may not load images from storage)
      responses:
        '200':
          description: The image, as uploaded
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Companies]
      operationId: uploadCompanyLogo
      x-roles: [owner, admin]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary, description: 'PNG or JPEG, up to 5 MB' }
      responses:
        '200':
          description: Logo stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
    delete:
      tags: [Companies]
      operationId: removeCompanyLogo
      x-roles: [owner, admin]
      responses:
        '204': { description: Removed }
  /companies/{companyId}/signature:
    parameters: [{ $ref: '#/components/parameters/CompanyId' }]
    put:
      tags: [Companies]
      operationId: uploadCompanySignature
      x-roles: [owner, admin]
      summary: The authorised signatory's signature, as printed on documents
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary, description: 'PNG or JPEG, up to 5 MB; a transparent PNG prints best' }
      responses:
        '200':
          description: Signature stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Company' }
    delete:
      tags: [Companies]
      operationId: removeCompanySignature
